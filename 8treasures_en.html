<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
           <link rel="manifest" href="manifest_en.json">
    <title>City of Vows ． Eight Treasures Vault</title>
    <style>
        :root {
            --gold-light: #f3e5ab;
            --gold-solid: #d4af37;
            --cyan-jade: #8ba89c;
            --bg-deep: #010204;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background: var(--bg-deep); 
            color: #fff; 
            font-family: "PingFang TC", "Microsoft JhengHei", serif;
            height: 100vh; height: 100dvh;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        /* ════ Top Navigation ════ */
        .top-nav {
            position: absolute; top: 25px; left: 0; width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            padding: env(safe-area-inset-top, 0px) 20px 0 20px; 
            z-index: 200;
        }
        .nav-btn {
            color: var(--cyan-jade); font-size: 0.85rem; letter-spacing: 2px;
            padding: 6px 14px; border: 1px solid rgba(139,168,156,0.3); border-radius: 20px;
            background: rgba(1,2,4,0.6); cursor: pointer; backdrop-filter: blur(5px);
            transition: all 0.3s;
        }
        .nav-btn:active { 
            background: rgba(139,168,156,0.2); 
            transform: scale(0.95); 
            opacity: 0.8; 
        }
        .nav-title {
            color: var(--gold-light); font-size: 1.1rem; letter-spacing: 4px; text-shadow: 0 0 10px rgba(243,229,171,0.3);
        }

        /* ════ SVG Global Styles ════ */
        .wire-white:not([fill]) { stroke: rgba(255, 255, 255, 0.9); stroke-width: 1.5; stroke-linejoin: round; fill: none; }
        .wire-white-thin:not([fill]) { stroke: rgba(255, 255, 255, 0.5); stroke-width: 1; stroke-linejoin: round; fill: none; }
        .wire-gold:not([fill]) { stroke: url(#pureGold); stroke-width: 2.5; stroke-linejoin: round; fill: none; }
        .wire-gold-thin:not([fill]) { stroke: url(#pureGold); stroke-width: 1; stroke-linecap: round; fill: none; }
        .edge-gold:not([fill]) { stroke: url(#pureGold); stroke-width: 4; stroke-linejoin: round; fill: none; }

        canvas { position: absolute; inset: 0; z-index: 0; pointer-events: none; }

        /* ════ Scene 1: Gacha / Bagua ════ */
        #draw-scene {
            position: absolute; inset: 0; z-index: 10;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .center-hint {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            color: var(--gold-light); font-size: 0.95rem; letter-spacing: 6px; text-indent: 6px;
            opacity: 0.8; text-align: center; line-height: 2; text-shadow: 0 0 15px rgba(212,175,55,0.4);
            transition: opacity 0.8s; pointer-events: none; z-index: 5;
        }

        .bagua-container { position: absolute; top: 50%; left: 50%; width: 0; height: 0; z-index: 10; }

/* ════ 新增：八卡呼吸與光芒動畫 (錯落律動與金光版) ════ */
@keyframes card-breathe {
    0%, 100% { scale: 1; }
    50% { scale: 1.04; }
}

@keyframes red-glow-pulse {
    0%, 100% { 
        box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.5), 
                    0 0 20px rgba(180, 60, 40, 0.2),   /* 沉穩暗紅 */
                    0 0 10px rgba(212, 175, 55, 0.1);  /* 隱約金光 */
        border-color: rgba(212, 175, 55, 0.2); 
    }
    50% { 
        box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.4), 
                    0 0 50px rgba(180, 60, 40, 0.4),   /* 柔和磚紅 */
                    0 0 25px rgba(212, 175, 55, 0.5);  /* 顯化金光 */
        border-color: rgba(212, 175, 55, 0.6); 
    }
}

@keyframes blue-glow-pulse {
    0%, 100% { 
        box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.5), 
                    0 0 20px rgba(40, 120, 150, 0.2),  /* 沉穩琉璃藍 */
                    0 0 10px rgba(212, 175, 55, 0.1);  /* 隱約金光 */
        border-color: rgba(212, 175, 55, 0.2); 
    }
    50% { 
        box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.4), 
                    0 0 50px rgba(40, 120, 150, 0.4),  /* 柔和琉璃 */
                    0 0 25px rgba(212, 175, 55, 0.5);  /* 顯化金光 */
        border-color: rgba(212, 175, 55, 0.6); 
    }
}

.card-wrapper {
    position: absolute; width: 150px; height: 255px; top: 0; left: 0;
    transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-120px) rotate(calc(-1 * var(--angle)));
    transition: all 0.6s cubic-bezier(0.2, 0.8, 0.2, 1);
    perspective: 1500px; cursor: pointer; z-index: 10;
    animation: card-breathe 4s ease-in-out infinite;
}

/* ════ 新增：利用負延遲時間產生錯落有致的陣法共鳴 ════ */
.card-wrapper:nth-child(1) { animation-delay: 0s; }
.card-wrapper:nth-child(2) { animation-delay: -0.5s; }
.card-wrapper:nth-child(3) { animation-delay: -1.0s; }
.card-wrapper:nth-child(4) { animation-delay: -1.5s; }
.card-wrapper:nth-child(5) { animation-delay: -2.0s; }
.card-wrapper:nth-child(6) { animation-delay: -2.5s; }
.card-wrapper:nth-child(7) { animation-delay: -3.0s; }
.card-wrapper:nth-child(8) { animation-delay: -3.5s; }

@media (hover: hover) { .card-wrapper:hover { z-index: 50; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-120px) rotate(calc(-1 * var(--angle))) scale(1.05); } }
.card-wrapper:active { z-index: 50; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-120px) rotate(calc(-1 * var(--angle))) scale(0.98); }

.card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1); box-shadow: 0 10px 40px rgba(0,0,0,0.9); border-radius: 14px; }
.card-wrapper.is-flipped .card-inner { transform: rotateY(180deg); }
.card-face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: inherit; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; }

/* 卡背：移除實體邊框，改用高雅的懸浮質感 */
.card-back {
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at 50% 50%, #1a1c22 0%, #010204 100%);
    box-shadow: inset 0 0 60px rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(212, 175, 55, 0.15); 
    transition: all 0.6s ease;
    overflow: hidden;
}

/* 當發光時，讓底色與光暈疊加 (動態呼吸) */
.card-back.red-glow {
    animation: red-glow-pulse 4s ease-in-out infinite;
}

.card-back.blue-glow {
    animation: blue-glow-pulse 4s ease-in-out infinite;
}

        
        .mandala-svg { 
            position: absolute; top: 50%; left: 50%; width: 90%; height: 90%;       
            transform: translate(-50%, -50%); 
            pointer-events: none; opacity: 0.85; 
            mix-blend-mode: screen; 
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.6));
        }

        /* Card Front */
        .card-front {
            background: radial-gradient(circle at 50% 40%, #1a233a 0%, #060912 100%);
            border: 1px solid rgba(212, 175, 55, 0.6); transform: rotateY(180deg);
            box-shadow: inset 0 0 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(212,175,55,0.1);
        }
        .treasure-glow {
            position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);
            width: 180px; height: 180px; background: radial-gradient(circle, var(--glow-color) 0%, transparent 65%);
            animation: var(--glow-anime) 4s ease-in-out infinite; z-index: 1; pointer-events: none;
        }

        /* 1. 圖片區塊 (更新) */
        .treasure-svg-box {
            position: absolute; top: 5%; width: 90%; height: 60%;
            display: flex; align-items: center; justify-content: center; z-index: 2; overflow: visible;
        }

        .treasure-svg-box svg { width: 100%; height: 100%; filter: drop-shadow(0 0 10px rgba(0,0,0,0.8)); animation: var(--treasure-anime) 4s ease-in-out infinite; }

        @keyframes float-swim { 0%, 100% { transform: scale(0.96) translateY(0); } 50% { transform: scale(1.05) translateY(-8px); } }
        @keyframes steady-rotate { from { transform: rotate(0deg) scale(0.98); } to { transform: rotate(360deg) scale(0.98); } }
        @keyframes float-knot { 0%, 100% { transform: scale(0.98) translateY(0); } 50% { transform: scale(1.03) translateY(-4px); } }
        @keyframes pulse-glow { 0%, 100% { opacity: 0.4; transform: translate(-50%, -50%) scale(0.9); } 50% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.15); } }

        /* 2. 文字區塊 (更新) */
        .treasure-info { 
            position: absolute; bottom: 5%; width: 100%; text-align: center; z-index: 3; 
            padding: 0 4px; 
        }
        
        /* 3. 名稱 (更新) */
        .t-name { 
            color: #efd07b; font-size: 0.75rem; letter-spacing: 1px; 
            text-shadow: 0 0 10px rgba(239, 208, 123, 0.4); 
            line-height: 1.1;
        }
        
        /* 4. 功德文字 (更新) */
        .t-merit { 
            color: var(--cyan-jade); font-size: 0.5rem; letter-spacing: 0.5px; 
            margin-top: 4px; opacity: 0.85; line-height: 1.1;
        }
        .card-wrapper.focused { transform: translate(-50%, -50%) scale(2.2); z-index: 100 !important; animation: none !important; }
.card-wrapper.scattered { opacity: 0; pointer-events: none; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-250px) scale(0); animation: none !important; }

/* ════ 核心效能優化：卡片翻轉後，強制停止背面光暈運算，釋放 CPU ════ */
.card-wrapper.is-flipped .card-back { animation: none !important; }

        .btn-action {
            position: absolute; bottom: 12%; left: 50%; transform: translateX(-50%);
            padding: 12px 35px; border-radius: 30px; border: 1px solid var(--gold-solid); 
            background: linear-gradient(to right, rgba(212,175,55,0.08), rgba(212,175,55,0.2));
            color: var(--gold-light); font-size: 0.85rem; letter-spacing: 4px; text-indent: 4px;
            cursor: pointer; opacity: 0; pointer-events: none;
            transition: all 0.8s cubic-bezier(0.2, 0.8, 0.2, 1); backdrop-filter: blur(8px); z-index: 200;
        }
        .btn-action.show { opacity: 1; pointer-events: auto; }

        /* ════ Scene 2: Gallery ════ */
        #gallery-scene {
            position: absolute; inset: 0; z-index: 5;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            opacity: 0; pointer-events: none; transition: opacity 1.5s cubic-bezier(0.4, 0, 0.2, 1); 
            padding: 90px 20px 50px 20px; overflow-y: auto; 
        }
        
        .gallery-grid {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 800px;
        }
        .gallery-grid > div:nth-child(7) { transform: translateX(53%); }
        .gallery-grid > div:nth-child(8) { transform: translateX(53%); }

        .grid-item {
            background: rgba(14, 18, 20, 0.95); border: 1px solid rgba(139, 168, 156, 0.3); border-radius: 12px;
            min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 15px 5px; position: relative; box-shadow: inset 0 0 30px rgba(0,0,0,0.8); transition: all 0.5s; cursor: pointer;
        }

        .grid-item.locked { background: rgba(8, 10, 12, 0.9); border-color: rgba(139, 168, 156, 0.15); opacity: 0.6; }
        .grid-item.unlocked { border-color: rgba(239, 208, 123, 0.5); box-shadow: inset 0 0 40px rgba(239, 208, 123, 0.1); }

        .grid-svg-container { width: 100%; height: 100px; display: flex; align-items: center; justify-content: center; overflow: hidden; }

        .grid-info { text-align: center; width: 100%; }
        .grid-name { font-size: 0.75rem; color: #fff; letter-spacing: 1px; margin-bottom: 8px; }
        .grid-item.locked .grid-name { color: #566461; }
        .grid-count-tag { font-size: 0.65rem; color: var(--gold-light); display: inline-block; border: 1px solid rgba(212, 175, 55, 0.3); padding: 4px 10px; border-radius: 8px; background: rgba(212, 175, 55, 0.08); }
        .grid-item.locked .grid-count-tag { color: #404a48; border-color: rgba(139,168,156,0.1); background: transparent; }

               @media (max-width: 768px) {
            .card-wrapper { width: 95px; height: 160px; transform: translate(-50%, -50%) rotate(var(--angle)) translateY(-90px) rotate(calc(-1 * var(--angle))); }
            .card-wrapper.focused { transform: translate(-50%, -50%) scale(2.5); animation: none !important; }
            .gallery-grid { gap: 10px; }
            .grid-item { min-height: 160px; }
            .grid-svg-container { height: 80px; }
        }


        /* ════ Dedication Effects ════ */
        .dust-particle {
            position: absolute;
            width: 3px; height: 3px;
            background: #8ba89c; 
            border-radius: 50%;
            pointer-events: none;
            animation: drift 2s ease-out forwards;
        }

        @keyframes drift {
            0% { transform: translate(0, 0); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)); opacity: 0; }
        }

        #confirm-layer {
            position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            display: none; opacity: 0; transition: opacity 0.5s;
            justify-content: center; align-items: center; z-index: 999;
        }

        .modal-overlay { 
            position: fixed; inset: 0; z-index: 999; background: rgba(1,2,4,0.85); backdrop-filter: blur(15px); 
            display: none; flex-direction: column; justify-content: center; align-items: center; 
            opacity: 0; transition: opacity 0.5s; 
        }
        .t-box { 
            background: radial-gradient(circle at 50% 50%, rgba(212,175,55,0.12) 0%, rgba(1,2,4,0.95) 100%); 
            border: 1px solid rgba(212,175,55,0.4); border-radius: 25px; padding: 40px; 
            display: flex; flex-direction: column; align-items: center; max-width: 85%; text-align: center; 
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }  
       
    </style>
</head>

                    <ellipse cx="145" cy="224" rx="38" ry="34" transform="rotate(-10 145 224)" fill="none" stroke="rgba(255,255,255,0.16)" stroke-width="3" />
                    <ellipse cx="145" cy="224" rx="18" ry="16" transform="rotate(-10 145 224)" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="2" />

    </svg>

    <script>
        // 1. Database Loading and Protection
        let db;
        try {
            db = JSON.parse(localStorage.getItem('PX_EN_V15.0'));
            if (!db || typeof db !== 'object') db = null;
            if (db && !db.dailyTasks) db.dailyTasks = [];
            if (db && !db.visitedRealms) db.visitedRealms = [];
            if (db && !db.treasures) {
                db.treasures = { sword: 0, vase: 0, jewel: 0, lotus_lamp: 0, dharma_wheel: 0, white_lotus: 0, indra_net: 0 };
            }
            if (db && !db.bodhiRecords) {
                db.bodhiRecords = [];
            }
            
            // Prajna Matrix
            if (db && db.lastMatrixDate === undefined) db.lastMatrixDate = "";
            if (db && db.totalCorrect === undefined) db.totalCorrect = 0;
            if (db && !db.clearedQ) db.clearedQ = [];
            if (db && !db.failedQ) db.failedQ = {};
            if (db && db.prajnaHints === undefined) db.prajnaHints = 0;
            if (db && db.lastHintDate === undefined) db.lastHintDate = "";
            
            // Dharma Water
            if (db && db.waterLevel === undefined) db.waterLevel = 1;
            if (db && db.waterLastDate === undefined) db.waterLastDate = "";
            if (db && db.tempBag === undefined) db.tempBag = 0;
            
            // Precepts Platform
            if (db && !db.preceptsData) db.preceptsData = { active: false, track: null, startTime: null, countA: 0, countB: 0, cycleStart: null, cycleCount: 0 };
            
            // Vision Array
            if (db && db.visionLevel === undefined) db.visionLevel = 1;
            if (db && db.visionLastFailed === undefined) db.visionLastFailed = "";
            if (db && db.visionLastDate === undefined) db.visionLastDate = ""; 

            // Bow to Amitabha
            if (db && !db.bowData) db.bowData = { streakCount: 0, lastLoginDate: "", lastRewardStreak: 0 };

            // Personal Room
            if (db && !db.personalRoom) db.personalRoom = { sessionCounts:{}, othList:{}, avatar:"", memo:"", loginDays:0, lastLogin:"", treasureClaimed:"" };
            
            // Samantabhadra Vows
            if (db && !db.puxianData) {
                db.puxianData = {
                    startDate: new Date().setHours(0,0,0,0), 
                    lastLogin: "", 
                    weekRecord: [false, false, false, false, false, false, false],
                    poolPoints: 0, totalDays365: 0, totalYears108: 0, totalPracticedDays: 0
                };
            }

            // Lunar Settle
            if (db && !db.mandalaVault) db.mandalaVault = [0, 0, 0, 0, 0];
            if (db && db.totalMerit === undefined) db.totalMerit = 0;
            if (db && db.lastSettledMonth === undefined) db.lastSettledMonth = "";
            if (db && (!db.lunar || !db.lunar.snapshot)) db.lunar = { snapshot: { bodhi: 0, puxian: 0, bow: 0 } };

            // 💡 Eight Treasures Vault Protection
            if (db && !db.eightTreasures) db.eightTreasures = [0, 0, 0, 0, 0, 0, 0, 0];
            if (db && db.treasureDrawnCount === undefined) db.treasureDrawnCount = 0;

        } catch(e) {
            console.error("Dharma data reading error", e);
        }

        // New Practitioner Default Values
        if (!db) {
            db = { 
                name: "Practitioner", totalNian: 0, points: 0, dailyTasks: [], todayCount: 0, lastDate: new Date().toLocaleDateString(),
                currentRank: "", streakDays: 0, lastNianDate: "",
                treasures: { sword: 0, vase: 0, jewel: 0, lotus_lamp: 0, dharma_wheel: 0, white_lotus: 0, indra_net: 0 },
                bodhiRecords: [],
                lastMatrixDate: "", totalCorrect: 0, clearedQ: [], failedQ: {}, prajnaHints: 0, lastHintDate: "",
                waterLevel: 1, waterLastDate: "", tempBag: 0,
                visionLevel: 1, visionLastFailed: "", visionLastDate: "",
                bowData: { streakCount: 0, lastLoginDate: "", lastRewardStreak: 0 },
                preceptsData: { active: false, track: null, startTime: null, countA: 0, countB: 0, cycleStart: null, cycleCount: 0 },
                puxianData: {
                    startDate: new Date().setHours(0,0,0,0), 
                    lastLogin: "", weekRecord: [false, false, false, false, false, false, false],
                    poolPoints: 0, totalDays365: 0, totalYears108: 0, totalPracticedDays: 0
                },
                personalRoom: { sessionCounts:{}, othList:{}, avatar:"", memo:"", loginDays:0, lastLogin:"", treasureClaimed:"" },
                mandalaVault: [0, 0, 0, 0, 0], totalMerit: 0, lastSettledMonth: "",
                lunar: { snapshot: { bodhi: 0, puxian: 0, bow: 0 } },
                eightTreasures: [0, 0, 0, 0, 0, 0, 0, 0],
                treasureDrawnCount: 0
            };
        }

        if (db.streakDays === undefined) db.streakDays = 0;
        if (db.lastNianDate === undefined) db.lastNianDate = "";
        if (db.musicList !== undefined) delete db.musicList;

        function saveDB() {
            localStorage.setItem('PX_EN_V15.0', JSON.stringify(db));
        }

        // Calculate available draws
        const totalEarnedDraws = Math.floor((db.totalNian || 0) / 1000000);
        let remainingDraws = totalEarnedDraws - db.treasureDrawnCount;
        if (remainingDraws < 0) remainingDraws = 0;

        // UI Initialization
        function initUI() {
            const nameDisplay = document.getElementById('display-name');
            if(nameDisplay) nameDisplay.innerText = `${db.name || 'Practitioner'} ‧ Vault`;
            
            const centerHint = document.getElementById('center-hint');
            if(centerHint) {
                if (remainingDraws > 0) {
                    centerHint.innerHTML = `Draws Available: ${remainingDraws}<br>Choose with your heart`;
                } else {
                    centerHint.innerHTML = `Millions gathered<br>Keep chanting diligently`;
                    centerHint.style.color = "rgba(139,168,156,0.8)"; 
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (db) {
                initUI();
            }
        });

        // --- Visual Script Framework ---
        
        const TREASURES = [
            { id: "banner", name: "Auspicious Banner", merit: "Subdue demons ‧ Supreme and unhindered", svgId: "treasure-banner", viewBox: "0 0 1000 1000", glow: "rgba(239, 208, 123, 0.45)", tAnime: "steady-rotate", gAnime: "pulse-glow" },
            { id: "fish", name: "Golden Fishes", merit: "Free & liberated ‧ Clear wisdom eyes", svgId: "treasure-fish", viewBox: "0 0 1000 562", glow: "rgba(255, 179, 0, 0.35)", tAnime: "float-swim", gAnime: "pulse-glow" },
            { id: "umbrella", name: "Precious Umbrella", merit: "Purify & protect ‧ Eliminate disasters", svgId: "treasure-umbrella", viewBox: "0 0 1000 800", glow: "rgba(74, 168, 255, 0.35)", tAnime: "float-knot", gAnime: "pulse-glow" }, 
            { id: "knot", name: "Endless Knot", merit: "Boundless compassion ‧ Continuous perfection", svgId: "treasure-knot", viewBox: "0 0 1000 900", glow: "rgba(217, 54, 54, 0.4)", tAnime: "float-knot", gAnime: "pulse-glow" },
            { id: "vase", name: "Treasure Vase", merit: "Perfect merit & wisdom ‧ Health & longevity", svgId: "treasure-vase", viewBox: "0 0 1000 800", glow: "rgba(128, 195, 255, 0.4)", tAnime: "float-knot", gAnime: "pulse-glow" },
            { id: "wheel", name: "Dharma Wheel", merit: "Everlasting Dharma ‧ Destroy ignorance", svgId: "treasure-wheel", viewBox: "0 0 1000 800", glow: "rgba(255, 153, 153, 0.4)", tAnime: "steady-rotate", gAnime: "pulse-glow" },
            { id: "lotus", name: "Sacred Lotus", merit: "Untainted by mud ‧ Pure Bodhi", svgId: "treasure-lotus", viewBox: "0 0 1000 900", glow: "rgba(252, 216, 115, 0.4)", tAnime: "float-swim", gAnime: "pulse-glow" },
            { id: "conch", name: "Turning Conch", merit: "Dharma sound spreads ‧ Awaken all beings", svgId: "treasure-conch", viewBox: "0 0 1000 800", glow: "rgba(255, 179, 179, 0.35)", tAnime: "float-swim", gAnime: "pulse-glow" }
        ];

        let hasDrawn = false;
        
        function drawGacha() {
            const rand = Math.random() * 100;
            if (rand <= 2) return 0;   
            if (rand <= 7) return 5;   
            if (rand <= 15) return 7;  
            if (rand <= 30) return 6;  
            if (rand <= 45) return 3;  
            if (rand <= 65) return 2;  
            if (rand <= 85) return 4;  
            return 1;                  
        }
        
        let drawnIndex = drawGacha();

        // ════ Star Dust Effects ════
        const canvas = document.getElementById('starCanvas');
        const ctx = canvas.getContext('2d');
        let width, height, stars = [];
        const starColors = ['rgba(243, 229, 171, ', 'rgba(255, 150, 150, ', 'rgba(150, 200, 255, ']; 

        function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
        window.addEventListener('resize', resize); resize();
        
        for(let i=0; i<800; i++) { 
            stars.push({ x: (Math.random()-0.5)*2000, y: (Math.random()-0.5)*2000, z: Math.random()*1000, s: Math.random()*3.5 + 0.5, colorType: Math.floor(Math.random() * 3) });
        }
        function drawStars() {
            ctx.clearRect(0, 0, width, height); 
            ctx.globalCompositeOperation = 'screen';
            stars.forEach(s => { 
                s.z -= 0.3; if(s.z <= 0) s.z = 1000; 
                let sc = 300 / (300 + s.z);
                ctx.beginPath(); ctx.arc(width/2 + s.x*sc, height/2 + s.y*sc, s.s*sc, 0, Math.PI*2); 
                ctx.fillStyle = starColors[s.colorType] + (sc * 3.0) + ')'; 
                ctx.fill(); 
            });
            requestAnimationFrame(drawStars);
        }
        drawStars();

        function initConchSpirals() {
            const container = document.getElementById('conch-spiral-container');
            if(!container) return;
            const SCX = 145, SCY = 224, MAX_R = 222, TURNS = 3.5, ARMS = 4, SEGS = 100;
            const colors = ['#FFB3B3', '#81D4FA', '#FFB3B3', '#81D4FA'];
            let html = '';
            for(let a=0; a<ARMS; a++) {
                let pts = [];
                for(let i=0; i<=SEGS; i++) {
                    const t = i/SEGS;
                    const r = MAX_R * Math.pow(t, 0.85);
                    const theta = t * Math.PI * 2 * TURNS + (Math.PI * 2 / ARMS) * a;
                    pts.push(`${SCX + r * Math.cos(theta)},${SCY + r * Math.sin(theta)}`);
                }
                let d = `M ${pts[0]} ` + pts.slice(1).map(p => `L ${p}`).join(' ');
                html += `<path d="${d}" fill="none" stroke="${colors[a]}" stroke-width="4.5" stroke-linecap="round" />`;
            }
            container.innerHTML = html;
        }
        initConchSpirals();

        function poly(n, r, rotDeg=0) {
            const pts=[], off = -Math.PI/2 + rotDeg*Math.PI/180;
            for(let k=0;k<n;k++) pts.push([r*Math.cos(2*Math.PI*k/n + off), r*Math.sin(2*Math.PI*k/n + off)]);
            return pts;
        }
        function ptStr(pts) { return pts.map(p=>p[0].toFixed(2)+','+p[1].toFixed(2)).join(' '); }
        function getWeb(pts, stroke, width, op) {
            let html = `<g stroke="${stroke}" stroke-width="${width}" opacity="${op}" fill="none">`;
            for(let i=0; i<pts.length; i++) for(let j=i+1; j<pts.length; j++) html += `<line x1="${pts[i][0]}" y1="${pts[i][1]}" x2="${pts[j][0]}" y2="${pts[j][1]}"/>`;
            return html + `</g>`;
        }
        function getMandala() {
            let html = `<svg class="mandala-svg" viewBox="-115 -115 230 230"><g><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>`;
            const p12 = poly(12, 102);
            html += `<polygon points="${ptStr(p12)}" fill="rgba(212,175,55,0.05)" stroke="#d4af37" stroke-width="1.2" opacity="0.8"/>` + getWeb(p12, '#d4af37', 0.6, 0.5);
            html += getWeb([...poly(8, 55, 0), ...poly(8, 55, 22.5)], '#f3e5ab', 0.8, 0.7);
            html += `<polygon points="${ptStr(poly(4, 20, 45))}" fill="rgba(243,229,171,0.1)" stroke="#f3e5ab" stroke-width="1.2" opacity="0.9"/><circle cx="0" cy="0" r="5" fill="#ffffff" opacity="0.9"/></g></svg>`;
            return html;
        }
        const bagua = document.getElementById('bagua-container');
        for(let i=0; i<8; i++) {
            const angle = i * 45;
            const card = document.createElement('div');
            card.className = 'card-wrapper';
            card.style.setProperty('--angle', `${angle}deg`);
            
            const glowClass = (i % 2 === 0) ? 'red-glow' : 'blue-glow';
            card.onclick = () => selectCard(i, card);

            const t = TREASURES[drawnIndex];
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-back card-face ${glowClass}">${getMandala()}</div>
                    <div class="card-front card-face">
                        <div class="treasure-glow" style="--glow-color: ${t.glow}; --glow-anime: ${t.gAnime};"></div>
                        <div class="treasure-svg-box">
                            <svg viewBox="${t.viewBox}" style="--treasure-anime: ${t.tAnime};">
                                <use href="#${t.svgId}"></use>
                            </svg>
                        </div>
                        <div class="treasure-info">
                            <div class="t-name">${t.name}</div>
                            <div class="t-merit">${t.merit}</div>
                        </div>
                    </div>
                </div>
            `;
            bagua.appendChild(card);
        }

        // 2. Gacha Logic
        function selectCard(selectedIndex, selectedCard) {
            if (hasDrawn) return;
            
            if (remainingDraws <= 0) {
                showCustomAlert("Conditions unmet: Accumulate 1 million chants (100 Dharma coins) to manifest a seal.");
                return;
            }

            hasDrawn = true;
            document.getElementById('center-hint').style.opacity = 0;
            
            drawnIndex = drawGacha(); 

            db.treasureDrawnCount = (db.treasureDrawnCount || 0) + 1;  
            db.eightTreasures[drawnIndex] = (db.eightTreasures[drawnIndex] || 0) + 1; 

            saveDB(); 

            remainingDraws--; 
            initUI();        

            const allCards = document.querySelectorAll('.card-wrapper');
            allCards.forEach((c, idx) => {
                if (idx === selectedIndex) {
                    c.classList.add('focused');
                    const t = TREASURES[drawnIndex];
                    const front = c.querySelector('.card-front');
                    front.innerHTML = `
                        <div class="treasure-glow" style="--glow-color: ${t.glow}; --glow-anime: ${t.gAnime};"></div>
                        <div class="treasure-svg-box">
                            <svg viewBox="${t.viewBox}" style="--treasure-anime: ${t.tAnime};"><use href="#${t.svgId}"></use></svg>
                        </div>
                        <div class="treasure-info">
                            <div class="t-name">${t.name}</div>
                            <div class="t-merit">${t.merit}</div>
                        </div>
                    `;
                    setTimeout(() => c.classList.add('is-flipped'), 1000);
                } else {
                    c.classList.add('scattered');
                }
            });
            setTimeout(() => document.getElementById('btn-collect').classList.add('show'), 2200);
        }

        function enterGallery() {
            document.getElementById('draw-scene').style.opacity = '0';
            document.getElementById('draw-scene').style.pointerEvents = 'none';
            setTimeout(() => {
                document.getElementById('gallery-scene').style.opacity = '1';
                document.getElementById('gallery-scene').style.pointerEvents = 'auto';
                buildGallery();
            }, 1000);
        }

        // 3. Gallery Generation
        function buildGallery() {
            const grid = document.getElementById('gallery-grid');
            if (grid.innerHTML !== "") return;

            let html = "";
            TREASURES.forEach((t, idx) => {
                const count = db.eightTreasures[idx]; 
                const isUnlocked = count > 0;
                const cls = isUnlocked ? "grid-item unlocked" : "grid-item locked";
                
                const svgContent = `<svg viewBox="${t.viewBox}" style="width:120%; height:120%; ${!isUnlocked ? 'opacity:0.2; filter:grayscale(100%) brightness(0.5);' : 'filter:drop-shadow(0 0 10px rgba(255,255,255,0.2));'}"><use href="#${t.svgId}"></use></svg>`; 

                html += `
                    <div class="${cls}" onclick="handleDedicateClick(${idx})">
                        <div class="grid-svg-container">${svgContent}</div>
                        <div class="grid-info">
                            <div class="grid-name">${t.name}</div>
                            <div class="grid-count-tag">${isUnlocked ? 'Acquired: ' + count : 'Not Yet Manifested'}</div>
                        </div>
                    </div>
                `;
            });
            grid.innerHTML = html;
        }

        function goHome() { 
            window.location.href = 'index_en.html?screen=3'; 
        }

        function toggleHelp() { 
            const helpContent = `
                <div style="text-align: center; margin-bottom: 15px; border-bottom: 1px solid rgba(212,175,55,0.2); padding-bottom: 10px;">
                    <span style="color: var(--gold-solid); font-size: 1.05rem; letter-spacing: 2px;">Eight Auspicious Symbols</span>
                </div>
                <div style="color: #ddd; font-size: 0.9rem; line-height: 1.8; text-align: justify; letter-spacing: 1px;">
                    Representing perfection, purity, and supreme merit and wisdom:<br>
                    <div style="color: var(--cyan-jade); text-align: center; margin: 10px 0; font-size: 0.95rem; letter-spacing: 2px;">
                        Umbrella, Fishes, Conch, Vase<br>Lotus, Knot, Banner, Wheel
                    </div>
                    
                    <div style="margin-top: 15px; color: var(--gold-light); font-size: 0.95rem;">[ A Million Merits ‧ Cosmic Resonance ]</div>
                    The Dharma Realm is true. For every <span style="color: var(--gold-solid); font-weight: bold;">1 million chants</span> accumulated, the universe resonates, manifesting a chance to acquire one of the Eight Treasures.
                    <br><br>
                    May practitioners cultivate diligently. Collecting all eight is a testament to perfect merit and wisdom on the Bodhi path.<br>
                    <span style="color: #aaa; font-size: 0.85rem;">Seek not outside, but chant Amitabha, awaiting the inner light.</span>
                </div>
            `;
            
            showCustomAlert(helpContent, "Eight Treasures Vault ‧ Guide"); 
        }

        let pendingDedicateIdx = -1;

        function handleDedicateClick(idx) {
            if (db.eightTreasures[idx] <= 0) return;
            pendingDedicateIdx = idx;
            
            const t = TREASURES[idx];
            document.getElementById('confirm-svg').innerHTML = `<svg viewBox="${t.viewBox}" style="width:100%; height:100%;"><use href="#${t.svgId}"></use></svg>`;
            document.getElementById('confirm-name').innerText = t.name;
            
            const m = document.getElementById('confirm-layer');
            m.style.display = 'flex';
            setTimeout(() => m.style.opacity = 1, 10);
        }

        function executeDedicate(idx) {
            document.getElementById('confirm-layer').style.opacity = 0;
            setTimeout(() => document.getElementById('confirm-layer').style.display = 'none', 500);

            db.eightTreasures[idx]--; 
            saveDB(); 
            
            const t = TREASURES[idx];
            const ov = document.getElementById('anim-overlay'), 
                  flash = document.getElementById('full-screen-flash'), 
                  txt = document.getElementById('anim-text'), 
                  btn = document.getElementById('close-anim-btn'),
                  svgCont = document.getElementById('anim-svg-container');

            ov.style.display = 'flex';
            svgCont.innerHTML = `<svg viewBox="${t.viewBox}" style="width:100%; height:100%; filter: drop-shadow(0 0 25px ${t.glow});"><use href="#${t.svgId}"></use></svg>`;
            txt.style.opacity = 0;
            btn.style.opacity = 0;
            btn.style.pointerEvents = 'none';

            setTimeout(() => ov.style.opacity = 1, 50);

            setTimeout(() => {
                flash.style.opacity = 1; 
                svgCont.innerHTML = ''; 
                
                for (let k = 0; k < 250; k++) {
                    let d = document.createElement('div');
                    d.className = 'dust-particle';
                    d.style.background = Math.random() > 0.5 ? '#f3e5ab' : '#FCF6D8'; 
                    d.style.width = Math.random() * 4 + 2 + 'px'; 
                    d.style.height = d.style.width;
                    d.style.position = 'absolute';
                    d.style.left = '50%'; d.style.top = '50%';
                    let a = Math.random() * Math.PI * 2, dist = 100 + Math.random() * 600;
                    d.style.setProperty('--dx', Math.cos(a) * dist + 'px');
                    d.style.setProperty('--dy', Math.sin(a) * dist + 'px');
                    d.style.animationDuration = (0.7 + Math.random() * 1.5) + 's';
                    ov.appendChild(d);
                }
                
                setTimeout(() => { 
                    flash.style.transition = 'opacity 1.5s ease-in'; 
                    flash.style.opacity = 0; 
                }, 1200); 

                txt.innerHTML = "[ Conditions Perfected ‧ Merit Dedicated ]<br><span style='font-size:0.95rem; color:var(--cyan-jade);'><br>The treasure has transformed into a flawless vajra beam, dedicated to the boundless Dharma Realm.</span>";
                txt.style.opacity = 1;
                
                setTimeout(() => { btn.style.opacity = 1; btn.style.pointerEvents = 'auto'; }, 2500);
            }, 1600);
        }

        function closeAnim() {
            const ov = document.getElementById('anim-overlay');
            ov.style.opacity = 0;
            setTimeout(() => {
                ov.style.display = 'none';
                document.querySelectorAll('#anim-overlay .dust-particle').forEach(d => d.remove());
                document.getElementById('gallery-grid').innerHTML = ""; 
                buildGallery();
            }, 500);
        }

        // Custom Alerts
        function showCustomAlert(msg, title = "Dharma Notice") {
            document.getElementById('custom-alert-title').innerText = title;
            document.getElementById('custom-alert-desc').innerHTML = msg;
            const m = document.getElementById('custom-alert-modal');
            m.style.display = 'flex';
            setTimeout(() => m.style.opacity = 1, 50);
        }
        function closeCustomAlert() {
            const m = document.getElementById('custom-alert-modal');
            m.style.opacity = 0;
            setTimeout(() => m.style.display = 'none', 500);
        }
    </script>

    <div id="confirm-layer" class="modal-overlay">
        <div class="t-box">
            <div style="color:var(--cyan-jade); font-size:1.1rem; margin-bottom:20px; letter-spacing:2px;">Dedicate to the Dharma Realm</div>
            <div id="confirm-svg" style="width:160px; height:160px; filter: drop-shadow(0 0 15px rgba(255,255,255,0.2));"></div>
            <div id="confirm-name" style="font-size:1.5rem; color:var(--gold-light); margin:20px 0; letter-spacing:2px;"></div>
            <div style="color:#ddd; font-size:0.9rem; margin-bottom:25px;">Dedicate this treasure, turning it into stardust for the universe?</div>
            <div style="display:flex; gap:15px;">
                <button class="nav-btn" onclick="document.getElementById('confirm-layer').style.display='none';">Keep it</button>
                <button class="nav-btn" style="border-color:var(--gold-solid); color:var(--gold-solid);" onclick="executeDedicate(pendingDedicateIdx)">Dedicate</button>
            </div>
        </div>
    </div>

    <div id="anim-overlay" class="modal-overlay" style="z-index: 1000;">
        <div id="full-screen-flash" style="position:absolute; inset:0; background:#f3e5ab; opacity:0; transition:opacity 0.1s ease-out; box-shadow:inset 0 0 100px 50px rgba(255,255,255,0.3);"></div>
        <div id="anim-svg-container" style="position:absolute; top:50%; left:50%; transform:translate(-50%, -50%); width:250px; height:250px; transition:transform 1.5s ease-in, filter 1s; z-index:20;"></div>
        <div id="anim-text" style="position:absolute; top:65%; left:50%; transform:translateX(-50%); width:90%; font-size:1.1rem; color:#fffce0; letter-spacing:2px; text-align:center; line-height:2.2; opacity:0; transition:1.5s; z-index:30;"></div>
        <button class="nav-btn" id="close-anim-btn" style="position:absolute; top:85%; left:50%; transform:translateX(-50%); z-index:40; opacity:0; pointer-events:none;" onclick="closeAnim()">Merit Perfected</button>
    </div>

    <div id="custom-alert-modal" class="modal-overlay" onclick="closeCustomAlert()">
        <div class="t-box" onclick="event.stopPropagation()">
            <div id="custom-alert-title" style="color:var(--gold-light); font-size:1.3rem; margin-bottom:20px; letter-spacing:2px;">Dharma Notice</div>
            <div id="custom-alert-desc" style="color:#ddd; font-size:0.95rem; line-height:2; text-align:justify; margin-bottom:25px; letter-spacing:1px;"></div>
            <button class="nav-btn" style="width:120px; font-size:0.85rem;" onclick="closeCustomAlert()">Confirm</button>
        </div>
    </div>

</body>
</html>
