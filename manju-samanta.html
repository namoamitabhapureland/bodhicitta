<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0d1117">
<link rel="manifest" href="manifest.json">

    <title>華嚴雙聖‧ 文殊普賢聖像</title>
    <style>
        :root {
            --bg-deep: #060a12;
            --gold-light: #f6d365;
            --gold-solid: #fda085;
            --cyan-glow: #80deea;
            --incense-blue: #00bcd4;
        }

        * {
            box-sizing: border-box;
            user-select: none;
            margin: 0;
            padding: 0;
            outline: none;
        }

        html, body {
            background-color: var(--bg-deep);
            width: 100%;
            height: 100%;
            overflow: hidden;
            touch-action: none;
        }

        body {
            background: radial-gradient(circle at 50% 45%, #121a29 0%, var(--bg-deep) 100%);
            font-family: "PingFang TC", "Microsoft JhengHei", serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

         /* 背景畫布 */
        canvas { position: absolute; inset: 0; }
        #starCanvas { z-index: 1; pointer-events: none; transition: filter 2s ease; }
        
        /* 🌟 修改點：平時常態下，水波紋完全顯現 */
        #waterCanvas { 
            z-index: 2; 
            mix-blend-mode: screen; 
            opacity: 0.6; 
            pointer-events: none; 
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1); /* 優化過渡時間至 1.2 秒 */
        }
        
/* 1. 為目標元素加入平滑淡出過渡效果 */
#starCanvas,
.dragon-banner-top,
.dragon-banner-bottom {
    transition: opacity 0.6s ease;
}

/* 2. 頂禮與燃香狀態時進行隱藏 */
body:is(.bow-left, .bow-right, .incense-on) :is(.dragon-banner-top, .dragon-banner-bottom) {
    opacity: 0 !important;
    pointer-events: none !important;
}



      
        /* 萬丈白毫願力淡綠光爆發層 */
    #burst-container { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 5; pointer-events: none; }
    
    .screen-flash {
        position: absolute; inset: 0; 
        background: radial-gradient(circle at 50% 45%, #ffffff 0%, #b9f6ca 45%, #69f0ae 70%, transparent 90%);
        opacity: 1; pointer-events: none; z-index: 100; mix-blend-mode: screen;
        animation: flash-fade 2s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }
    @keyframes flash-fade { 0% { opacity: 1; transform: scale(0.8); } 100% { opacity: 0; transform: scale(1.5); } }

    .gold-ray {
        position: absolute; width: 3px; height: 200vh;
        background: linear-gradient(to top, transparent, #69f0ae, #ffffff, #FF9224, transparent);
        box-shadow: 0 0 15px #FF9224, 0 0 5px #ffffff; opacity: 0; transform-origin: center center; will-change: transform, opacity;
    }
    @keyframes ray-burst { 
        0% { transform: scaleY(0.05) rotate(var(--rot)); opacity: 0; } 
        15% { opacity: 1; transform: scaleY(0.6) rotate(var(--rot)); } 
        100% { transform: scaleY(2.5) rotate(var(--rot)); opacity: 0; } 
    }

    .space-particle {
        position: absolute; width: 80px; height: 40px; background: #ffffff; border-radius: 70%;
        box-shadow: 0 0 12px #ffffff, 0 0 25px #69f0ae; opacity: 0; pointer-events: none; will-change: transform, opacity;
    }
    @keyframes particle-explode {
        0% { transform: translate(0, 0) scale(0.7); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(2.5); opacity: 0; }
    }

        #buddha-scene {
            position: absolute;
            inset: 0;
            z-index: 10;
            margin: 0 auto;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-origin: 50% 70%;
            transition: transform 3.5s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none;
            width: 100%;
            max-width: 1000px;
        }

 /* --------------------------------------------------
   預設狀態：兩尊都正常顯示，只控制動態 Transition
   -------------------------------------------------- */
#bow-anim-left,
#bow-anim-right {
    transition: transform 1.2s ease-in-out, 
                opacity 0.4s ease-in-out 1.3s;
}

/* --------------------------------------------------
   頂禮左尊（普賢）：文殊瞬間消失，普賢移至中央並放大
   -------------------------------------------------- */
body.bow-left #bow-anim-left {
    /* 移至中央的同時放大 1.25 倍（放大倍數可自由微調，如 1.2 或 1.3） */
    transform: translate(110px, 0px) scale(1.25) !important;
    opacity: 1 !important;
    transition: transform 1.2s ease-in-out !important;
}
body.bow-left #bow-anim-right {
    opacity: 0 !important;
    pointer-events: none;
    transition: opacity 0s !important; /* 文殊瞬間隱藏 */
}

/* --------------------------------------------------
   頂禮右尊（文殊）：普賢瞬間消失，文殊移至中央並放大
   -------------------------------------------------- */
body.bow-right #bow-anim-right {
    /* 移至中央的同時放大 1.25 倍 */
    transform: translate(-350px, 0px) scale(1.25) !important;
    opacity: 1 !important;
    transition: transform 1.2s ease-in-out !important;
}
body.bow-right #bow-anim-left {
    opacity: 0 !important;
    pointer-events: none;
    transition: opacity 0s !important; /* 普賢瞬間隱藏 */
}


        .buddha-breathe {
            width: 100%;
            height: auto;
            animation: floating 2s ease-in-out infinite alternate;
            position: relative;
        }

        @keyframes floating {
            0% { transform: translateY(-8px); filter: drop-shadow(0 5px 15px rgba(246,211,101,0.15)); }
            100% { transform: translateY(-20px); filter: drop-shadow(0 25px 40px rgba(246,211,101,0.35)); }
        }

        .halo-pulse {
            transform-origin: 500px 300px;
            animation: halo-anim 4s infinite alternate ease-in-out;
        }

        @keyframes halo-anim {
            0% { transform: scale(1); opacity: 0.65; }
            100% { transform: scale(1.1); opacity: 0.95; }
        }



      

/* 外層：負責濾鏡轉場，並鎖定變形中心點 */
.weapon-highlight {
    transition: filter 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    /* 確保縮放是以武器自己為中心，而不是整個 SVG 畫布的左上角 */
    transform-origin: center;
    transform-box: fill-box;
}

/* 武器激活狀態：觸發循環呼吸動畫 */
.weapon-active {
    filter: drop-shadow(0 0 30px #f6d365) drop-shadow(0 0 10px #ffffff) brightness(1.3) !important;
    animation: weaponBreath 2s ease-in-out infinite alternate !important;
}

/* 莊嚴呼吸律動動畫：改用獨立的 scale 與 rotate，保護原本的座標不跑掉 */
@keyframes weaponBreath {
    0% {
        scale: 0.99; /* 依照你測試的數值 */
        rotate: 0deg;
        filter: drop-shadow(0 0 25px #f6d365) drop-shadow(0 0 8px #ffffff) brightness(2);
    }
    100% {
        scale: 1.05; 
        rotate: 1deg; 
        filter: drop-shadow(0 0 100px #f6d365) drop-shadow(0 0 18px #a8ffb2) brightness(3);
    }
}




        #smoke-container { position: absolute; inset: 0; pointer-events: none; z-index: 15; overflow: hidden; }
        
        .smoke-fine { 
            position: absolute; 
            width: 6px; 
            height: 50px; 
            background: linear-gradient(to top, rgba(240, 230, 210, 0.25), transparent); 
            border-radius: 3px; 
            filter: blur(4px); 
            opacity: 0; 
            animation: smoke-rise-fine 4.5s cubic-bezier(0.4, 0.1, 0.4, 1) forwards; 
        }
        
        @keyframes smoke-rise-fine { 
            0% { transform: translateY(0) scaleX(1); opacity: 0; } 
            20% { opacity: 0.5; } 
            100% { transform: translateY(-45vh) scaleX(2.5) translateX(var(--drift)); opacity: 0; } 
        }

        .candle-flicker { transform-origin: center bottom; animation: flicker-anim 2.5s ease-in-out infinite alternate; }
        @keyframes flicker-anim { 0% { transform: scale(0.93) rotate(-1.2deg); opacity: 0.8; } 100% { transform: scale(1.04) rotate(1.2deg); opacity: 1; } }


        
        #blessing-text { 
            height: 30px; 
            margin-bottom: 20px; 
            color: var(--gold-light); 
            font-size: 1.2rem; 
            letter-spacing: 8px; 
            text-shadow: 0 0 20px rgba(246,211,101,0.9), 0 0 10px #fff; 
            opacity: 0; 
            pointer-events: none; 
            white-space: nowrap; 
        }
        
        @keyframes float-blessing { 
            0% { opacity: 0; transform: translateY(15px); } 
            20% { opacity: 1; transform: translateY(0); } 
            80% { opacity: 1; transform: translateY(-5px); } 
            100% { opacity: 0; transform: translateY(-15px); } 
        }

       .ritual-container { 
    position: absolute; 
    bottom: max(10px, env(safe-area-inset-bottom)); /* 移至螢幕可放的最低位置 */
    display: flex; 
    flex-direction: column; 
    align-items: center; 
    width: 100%; 
    z-index: 100; 
    padding: 0 10px; /* 避免極窄螢幕貼邊 */
    box-sizing: border-box;
}

/* 按鈕並排面板 */
.ritual-panel { 
    width: 100%;
    max-width: 480px; /* 限制最大寬度，保持平板與大螢幕的美感 */
    display: flex; 
    justify-content: center;
}

.btn-group-row { 
    display: flex; 
    gap: 8px; /* 縮小按鈕間距以容納三個按鈕 */
    width: 100%;
    justify-content: center;
    align-items: stretch; /* 讓長度折行的按鈕高度一致 */
}

/* 扁平精致按鈕設計 */
.ritual-btn { 
    flex: 1; /* 三個按鈕均分寬度 */
    min-width: 0; /* 允許 Flex 子項目縮小 */
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    
    color: var(--gold-light); 
    font-size: 0.85rem; /* 中日文微縮，保持一行放得下 */
    line-height: 1.2;
    letter-spacing: 2px; /* 降低字距避免擠壓 */
    
    cursor: pointer; 
    transition: all 0.4s; 
    padding: 10px 6px; /* 內距縮減，讓英文折行時按鈕優雅變高 */
    background: rgba(255,255,255,0.03); 
    border: 1px solid rgba(212,175,55,0.35); 
    border-radius: 20px; 
    backdrop-filter: blur(8px); 
    font-weight: bold; 
    text-shadow: 0 0 8px rgba(243,229,171,0.4); 
    
    word-break: break-word; /* 英文長單字折行支援 */
    hyphens: auto;
}

.ritual-btn:hover, .ritual-btn.active { 
    color: #fff; 
    text-shadow: 0 0 15px var(--gold-light); 
    border-color: rgba(212,175,55,0.85); 
    background: rgba(212,175,55,0.15); 
    box-shadow: 0 0 20px rgba(212,175,55,0.25); 
}

/* 底部提示文字 */
.chant-hint { 
    margin-top: 8px; 
    font-size: 0.75rem; 
    color: rgba(255,255,255,0.6); 
    letter-spacing: 2px; 
    pointer-events: none; 
    text-align: center;
}

/* 針對英文版的微調（可在 <html> 或 <body> 加上 lang="en"） */
:lang(en) .ritual-btn {
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    padding: 8px 4px;
}
        /* 預設隱藏時：停留在較低的位置 */
#censer-group { 
    opacity: 0; 
    transform: translateY(20px); 
    transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1); 
}

/* 顯示時：整體往上抬升（例如 -80px），避開文字重疊 */
body.incense-on #censer-group { 
    opacity: 1; 
    transform: translate(20px, -150px) scale(0.95); 
}

.incense-glow { 
    animation: glow-pulse 1.5s infinite alternate ease-in-out; 
}

@keyframes glow-pulse { 
    0% { r: 3px; opacity: 0.7; filter: drop-shadow(0 0 4px #ff4500); } 
    100% { r: 4.5px; opacity: 1; filter: drop-shadow(0 0 12px #ffaa00); } 
}

        .crown-body-left { fill: url(#crownJewelGradientLeft); fill-opacity: 0.9; }
        .crown-body-right { fill: url(#crownJewelGradientRight); fill-opacity: 0.9; }
            /* ── 模態框樣式 ── */
    .custom-modal {
        position: fixed; inset: 0; z-index: 4000;
        background: rgba(0,0,0,0.88);
        backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
        display: none; justify-content: center; align-items: center;
        opacity: 0; transition: opacity .35s;
    }
    .custom-modal.show { 
        display: flex; 
        opacity: 1; 
    }
    .modal-box {
        background: rgba(3,3,6,0.94);
        border: 1px solid rgba(212,175,55,0.38);
        border-radius: 20px; padding: 28px 22px;
        width: 88%; max-width: 340px; text-align: center;
        box-shadow: 0 0 55px rgba(212,175,55,0.13), inset 0 1px 0 rgba(255,255,255,0.06);
        max-height: 88vh; overflow-y: auto;
    }
    .modal-title {
        color: var(--solid, #d4af37); font-size: 15px; letter-spacing: 4px; margin-bottom: 20px;
        text-shadow: 0 0 20px rgba(212,175,55,0.55);
    }
    .gold-btn {
        width: 100%;
        background: linear-gradient(135deg, rgba(212,175,55,0.16), rgba(212,175,55,0.06));
        border: 1px solid rgba(212,175,55,0.62);
        color: var(--gold, #fbeba5); padding: 12px; border-radius: 10px;
        font-size: 13px; letter-spacing: 2px; cursor: pointer; transition: .22s;
        box-shadow: 0 2px 12px rgba(212,175,55,0.1), inset 0 1px 0 rgba(255,255,255,0.08);
        font-family: "PingFang TC", serif;
    }
    .gold-btn:active {
        background: rgba(212,175,55,0.32);
        box-shadow: 0 0 18px rgba(212,175,55,0.45);
        transform: scale(0.97);
    }
        /* ==================================================
   頂禮時菩薩白毫（眉間紅圈）放大與發光效果
   ================================================== */

/* 1. 設定白毫動畫與縮放中心 */
#left-buddha-face-features circle,
#right-buddha-face-features circle {
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1),
                filter 1.2s cubic-bezier(0.25, 1, 0.5, 1);
}

/* 2. 頂禮左尊（普賢菩薩）時：左尊白毫放大 */
body.bow-left #left-buddha-face-features circle {
    transform: scale(2) !important;
    filter: drop-shadow(0 0 10px #ff3333) drop-shadow(0 0 20px #ffffff) !important;
}

/* 3. 頂禮右尊（文殊菩薩）時：右尊白毫放大 */
body.bow-right #right-buddha-face-features circle {
    transform: scale(2) !important;
    filter: drop-shadow(0 0 10px #ff3333) drop-shadow(0 0 20px #ffffff) !important;
}
         /* ==================================================
   龍圖騰容器基本設定
   ================================================== */
.dragon-banner-top,
.dragon-banner-bottom {
    position: fixed;
    left: 0;
    bottom: 60px;
    width: 100vw;
    height: 300x;
    pointer-events: none;
    overflow: visible; /* 允許加長的龍身超出容器邊界 */
    will-change: transform, opacity;
}

.dragon-banner-top svg,
.dragon-banner-bottom svg {
    width: 100%;
    height: 100%;
    display: block;
    /* 關鍵：強制 SVG 不等比裁切，確保水平方向能完整顯示加長的身軀 */
    overflow: visible; 
}

/* ── 龍一（底層）：同步淡入 ➔ 原地大幅昂首 ➔ 衝刺往 2 點鐘方向飛升 ── */
.dragon-banner-bottom {
    z-index: 8;
    animation: dragonFadeSlideLTR 8s cubic-bezier(0.45, 0, 0.3, 1) infinite;
}

@keyframes dragonFadeSlideLTR {
    0%   { opacity: 0; transform: translate(0, 0) rotate(0deg); }
    10%  { opacity: 1; transform: translate(0, 0) rotate(0deg); }             /* 0~10%: 同步淡入 */
    60%  { opacity: 1; transform: translate(0, 0) rotate(0deg); }             /* 10~60%: 原地展示 */
    70%  { opacity: 1; transform: translate(5vw, -40px) rotate(-55deg); }     /* 60~70%: 【關鍵】原地向上拉起大幅角度（昂首蓄力） */
    85%  { opacity: 0; transform: translate(90vw, -300px) rotate(-35deg); }   /* 70~85%: 沿著仰角往 2 點鐘方向迅速飛升漸隱 */
    100% { opacity: 0; transform: translate(0, 0) rotate(0deg); }             /* 85~100%: 歸位等待下一輪 */
}

/* ── 龍二（頂層）：同步淡入 ➔ 原地大幅昂首 ➔ 衝刺往 11 點鐘方向飛升 ── */
.dragon-banner-top {
    z-index: 9;
    mix-blend-mode: screen;
    animation: dragonFadeSlideRTL 8s cubic-bezier(0.45, 0, 0.3, 1) infinite;
}

@keyframes dragonFadeSlideRTL {
    0%   { opacity: 0; transform: translate(0, 0) scaleX(-1) rotate(0deg); }
    10%  { opacity: 1; transform: translate(0, 0) scaleX(-1) rotate(0deg); }             /* 0~10%: 同步淡入 */
    60%  { opacity: 1; transform: translate(0, 0) scaleX(-1) rotate(0deg); }             /* 10~60%: 原地展示 */
    70%  { opacity: 1; transform: translate(-5vw, -40px) scaleX(-1) rotate(-55deg); }   /* 60~70%: 【關鍵】原地向上拉起大幅角度（昂首蓄力） */
    85%  { opacity: 0; transform: translate(-90vw, -300px) scaleX(-1) rotate(-35deg); } /* 70~85%: 沿著仰角往 11 點鐘方向迅速飛升漸隱 */
    100% { opacity: 0; transform: translate(0, 0) scaleX(-1) rotate(0deg); }             /* 85~100%: 歸位等待下一輪 */
}
            #chang-ji-guang-scene {
    position: absolute;
    inset: 0;
    margin: auto;
    z-index: 10; /* 確保高於 Canvas (z-index: 1, 2)，但不遮擋互動層 */
    pointer-events: none; /* 避免遮擋底下的點擊事件 */
    
    width: min(90vw, 650px);
    height: min(90vh, 900px);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* ─── 佛像與光芒整體呼吸律動 ─── */
.fashen-breathe-container {
    width: 100%;
    height: 100%;
    animation: fashenRespiration 10s infinite ease-in-out;
    transform-origin: 50% 50%;
    opacity: 1;
}

@keyframes fashenRespiration {
    0%, 100% { 
        transform: translateY(0px) scale(0.8); 
        opacity: 0.93;
    }
    50% { 
        transform: translateY(-8px) scale(1.23); 
        opacity: 1;
    }
}

/* ─── 常寂光光芒明暗脈動（大小跟隨父層，僅控制透明度流轉） ─── */
.chang-ji-guang-static {
    transform-origin: 500px 500px;
    animation: changJiGuangLuminousPulse 6s infinite alternate ease-in-out;
    will-change: opacity;
}

@keyframes changJiGuangLuminousPulse {
    0% {
        opacity: 0.5;
    }
    100% {
        opacity: 0.9;
    }
}

        /* 純金系光芒動態流轉 */
        .gold-flow-stop-0 { animation: goldFlow0 6s infinite ease-in-out alternate; }
        .gold-flow-stop-1 { animation: goldFlow1 6s infinite ease-in-out alternate; }
        .gold-flow-stop-2 { animation: goldFlow2 6s infinite ease-in-out alternate; }

        @keyframes goldFlow0 {
            0% { stop-color: #ffffff; stop-opacity: 0.95; }
            50% { stop-color: #fff8dc; stop-opacity: 0.9; }
            100% { stop-color: #ffeb3b; stop-opacity: 0.95; }
        }

        @keyframes goldFlow1 {
            0% { stop-color: #ffd700; stop-opacity: 0.8; }
            50% { stop-color: #f0e68c; stop-opacity: 0.85; }
            100% { stop-color: #ffb300; stop-opacity: 0.85; }
        }

        @keyframes goldFlow2 {
            0% { stop-color: #d4af37; stop-opacity: 0.5; }
            50% { stop-color: #e6c666; stop-opacity: 0.6; }
            100% { stop-color: #cd7f32; stop-opacity: 0.55; }
        }

            <div class="ritual-btn" id="btn-incense" onclick="toggleIncense()">燃燈燒香</div>
            <div class="ritual-btn" id="btn-manjusri" onclick="toggleAction('manjusri')">頂禮文殊</div>

  <script>
    function speakWords(text) {
        if (!('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = 'zh-TW';
        msg.rate = 0.82;
        msg.pitch = 0.85;
        window.speechSynthesis.speak(msg);
    }

    function showBlessing(text) {
        const el = document.getElementById('blessing-text');
        if(!el) return;
        el.innerText = text;
        el.style.animation = 'none';
        void el.offsetWidth;
        el.style.animation = 'float-blessing 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards';
    }

    function toggleAction(type) {
        const btn = document.getElementById(`btn-${type}`);
        if (!btn || btn.classList.contains('active')) return;

        btn.classList.add('active');
        document.getElementById('buddha-scene').classList.add('bowing');
        
        triggerGoldenBurst();

        if (type === 'samantabhadra') {
            document.body.classList.add('bow-left');
            document.body.classList.remove('bow-right');

            const weapon = document.getElementById('samantabhadra-weapon');
            if(weapon) weapon.classList.add('weapon-active');
            
            speakWords("願海廣大，十願無盡");
            showBlessing("普賢願海 ‧ 萬行菩提");
        } else if (type === 'manjusri') {
            document.body.classList.add('bow-right');
            document.body.classList.remove('bow-left');

            const weapon = document.getElementById('manjusri-weapon');
            if(weapon) weapon.classList.add('weapon-active');

            speakWords("波若智慧，斷除無明");
            showBlessing("文殊般若 ‧ 斷盡煩惱");
        }

        setTimeout(() => {
            document.getElementById('buddha-scene').classList.remove('bowing');
            btn.classList.remove('active');
            
            document.body.classList.remove('bow-left', 'bow-right');

            const w1 = document.getElementById('samantabhadra-weapon');
            const w2 = document.getElementById('manjusri-weapon');
            if(w1) w1.classList.remove('weapon-active');
            if(w2) w2.classList.remove('weapon-active');
        }, 3200);
    }

    // 萬丈淡綠光粒子特效
    function triggerGoldenBurst() {
        const container = document.getElementById('burst-container');
        if(!container) return;
        container.innerHTML = '';
        
        const flash = document.createElement('div');
        flash.className = 'screen-flash';
        container.appendChild(flash);
        
        for(let i=0; i<48; i++) {
            const angle = i * 7.5;
            const ray = document.createElement('div');
            ray.className = 'gold-ray';
            ray.style.setProperty('--rot', `${angle}deg`);
            ray.style.animation = `ray-burst 2.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards`;
            container.appendChild(ray);
            
            const particle = document.createElement('div');
            particle.className = 'space-particle';
            const distance = 70 + Math.random() * 50; 
            const rad = (angle * Math.PI) / 180;
            const tx = Math.cos(rad) * distance + "vw";
            const ty = Math.sin(rad) * distance + "vh";
            particle.style.setProperty('--tx', tx);
            particle.style.setProperty('--ty', ty);
            particle.style.animation = `particle-explode ${1.4 + Math.random() * 1}s cubic-bezier(0.1, 0.8, 0.3, 1) forwards`;
            container.appendChild(particle);
        }
    }

    // 燃香與蠟燭物理計時器
    let incenseTimer, smokeTimer, incenseProgress = 0;

    function toggleIncense() {
        const btn = document.getElementById('btn-incense');
        const isActive = document.body.classList.contains('incense-on');
        
        if (!isActive) {
            document.body.classList.add('incense-on');
            btn.classList.add('active');
            
            speakWords("智形合一，導歸極楽"); 
            showBlessing("智行合一 ‧ 導歸極樂");
            
            incenseProgress = 0;
            createThreeSmoke();
            
            let startTime = Date.now();
            function burn() {
                let elapsed = (Date.now() - startTime) / 1000;
                incenseProgress = Math.min(elapsed / 60, 1); // 60秒完全燃盡
                
                // 1. 三支願力香同步向下平穩燃燒
                document.getElementById('stick-center')?.setAttribute('y1', 1125 + (145 * incenseProgress));
                document.getElementById('glow-center')?.setAttribute('cy', 1125 + (145 * incenseProgress));
                
                document.getElementById('stick-left')?.setAttribute('y1', 1140 + (130 * incenseProgress));
                document.getElementById('glow-left')?.setAttribute('cy', 1140 + (130 * incenseProgress));
                
                document.getElementById('stick-right')?.setAttribute('y1', 1140 + (130 * incenseProgress));
                document.getElementById('glow-right')?.setAttribute('cy', 1140 + (130 * incenseProgress));
                
                // 2. 兩側實體蠟燭高度與火苗同步向下融化
                let meltAmount = 55 * incenseProgress;
                ['left', 'right'].forEach(side => {
                    const candleBody = document.getElementById(`candle-body-${side}`);
                    const candleWick = document.getElementById(`candle-wick-${side}`);
                    const flameMove = document.getElementById(`flame-move-${side}`);
                    
                    if(candleBody) {
                        candleBody.setAttribute('y', 1220 + meltAmount);
                        candleBody.setAttribute('height', 55 - meltAmount);
                    }
                    if(candleWick) {
                        candleWick.setAttribute('y1', 1215 + meltAmount);
                        candleWick.setAttribute('y2', 1220 + meltAmount);
                    }
                    if(flameMove) {
                        flameMove.style.transform = `translateY(${meltAmount}px)`;
                    }
                });
                
                if (incenseProgress < 1 && document.body.classList.contains('incense-on')) {
                    incenseTimer = requestAnimationFrame(burn);
                } else if (incenseProgress >= 1 && document.body.classList.contains('incense-on')) {
                    resetIncense();
                }
            }
            incenseTimer = requestAnimationFrame(burn);
        } else {
            resetIncense();
        }
    }

    function resetIncense() {
        cancelAnimationFrame(incenseTimer);
        clearTimeout(smokeTimer);
        document.body.classList.remove('incense-on');
        document.getElementById('btn-incense')?.classList.remove('active');
        setTimeout(restoreIncensePosition, 1200);
    }

    function restoreIncensePosition() {
        if(!document.body.classList.contains('incense-on')) {
            // 完美復原三支香與香頭
            document.getElementById('stick-center')?.setAttribute('y1', '1125');
            document.getElementById('glow-center')?.setAttribute('cy', '1125');
            document.getElementById('stick-left')?.setAttribute('y1', '1140');
            document.getElementById('glow-left')?.setAttribute('cy', '1140');
            document.getElementById('stick-right')?.setAttribute('y1', '1140');
            document.getElementById('glow-right')?.setAttribute('cy', '1140');
            
            // 完美復原兩側蠟燭與火苗
            ['left', 'right'].forEach(side => {
                const candleBody = document.getElementById(`candle-body-${side}`);
                const candleWick = document.getElementById(`candle-wick-${side}`);
                const flameMove = document.getElementById(`flame-move-${side}`);
                
                if(candleBody) {
                    candleBody.setAttribute('y', '1220');
                    candleBody.setAttribute('height', '55');
                }
                if(candleWick) {
                    candleWick.setAttribute('y1', '1215');
                    candleWick.setAttribute('y2', '1220');
                }
                if(flameMove) {
                    flameMove.style.transform = `translateY(0px)`;
                }
            });
        }
    }

    // 萬德莊嚴：三支香頭隨燃燒位置動態釋放裊裊清煙
    function createThreeSmoke() {
        if (!document.body.classList.contains('incense-on') || incenseProgress >= 1) return;
        const container = document.getElementById('smoke-container');
        if (!container) return;
        
        const targets = ['glow-left', 'glow-center', 'glow-right'];
        
        targets.forEach(id => {
            const glow = document.getElementById(id);
            if (!glow) return;
            const rect = glow.getBoundingClientRect(); 
            
            const puff = document.createElement('div');
            puff.className = 'smoke-fine';
            puff.style.setProperty('--drift', `${(Math.random() - 0.5) * 60}px`);
            puff.style.left = `${rect.left + rect.width / 2 - 3}px`; 
            puff.style.top = `${rect.top - 40}px`; 
            
            container.appendChild(puff);
            setTimeout(() => puff.remove(), 4500);
        });
        
        smokeTimer = setTimeout(createThreeSmoke, 450);
    }

    function closeM(id) { 
        document.getElementById(id).classList.remove('show'); 
    }

}

  // 星空與水波紋背景
    const canvas = document.getElementById('starCanvas'); 
    const ctx = canvas.getContext('2d'); 
    let width, height, stars = [], warpSpeed = 1.9, starScale = 1.2; 

    function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; } 
    window.addEventListener('resize', resize); resize(); 

    const STAR_COLORS = ['#8ba89c', '#53FF53', '#f3e5ab', '#ff9a9e', '#b2dfdb', '#C9A0DC', '#ffeb3b']; 
    for (let i = 0; i < 350; i++) { 
        stars.push({ x: (Math.random() - 0.5) * 2000, y: (Math.random() - 0.5) * 2000, z: Math.random() * 2000, color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)], s: Math.random() * 2.5 + 0.5 }); 
    } 

    function renderStars() { 
        ctx.fillStyle = 'rgba(1, 1, 3, 0.4)'; 
        ctx.fillRect(0, 0, width, height); 
        ctx.globalCompositeOperation = 'screen'; 
        stars.forEach(s => { 
            s.z -= warpSpeed; 
            if (s.z <= 0) { s.z = 2000; s.x = (Math.random() - 0.5) * 2000; s.y = (Math.random() - 0.5) * 2000; } 
            let sc = 400 / (400 + s.z); 
            let drawY = (height / 2) + s.y * sc; 
            if (drawY > height * 0.75) return; 
            ctx.beginPath(); 
            ctx.arc((width / 2) + s.x * sc, drawY, s.s * sc * starScale, 0, Math.PI * 2); 
            ctx.fillStyle = s.color; 
            ctx.globalAlpha = Math.min(1, sc * 2.5); 
            ctx.fill(); 
            ctx.globalAlpha = 1; 
        }); 
        ctx.globalCompositeOperation = 'source-over'; 
        requestAnimationFrame(renderStars); 
    } 
    renderStars();
