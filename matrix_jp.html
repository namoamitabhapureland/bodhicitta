<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest_jp.json">
    <title>華蔵荘厳世界海 ． 二十重マトリックス</title>
    <style>
        :root {
            --bg-deep: #010103; 
            --gold: #f3e5ab; 
            --solid-gold: #d4af37; 
            --cyan: #8ba89c; 
            --silver: #e0e0e0;
            --fire: #a83232;
            --text-main: #d0d0d0;
        }
        
        body { 
            margin: 0; background: var(--bg-deep); color: var(--text-main); 
            font-family: "PingFang TC", "Microsoft JhengHei", serif;
            overflow: hidden; touch-action: none; overscroll-behavior: none; user-select: none;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        .back-btn {
            position: absolute; top: 20px; left: 20px; z-index: 1000;
            color: var(--gold); text-decoration: none; font-size: 0.95rem; font-weight: bold;
            display: flex; align-items: center; gap: 8px; cursor: pointer;
            background: rgba(0,0,0,0.5); padding: 8px 15px; border-radius: 20px; border: 1px solid rgba(212,175,55,0.3);
            backdrop-filter: blur(5px); transition: all 0.3s;
        }
        .back-btn:active { transform: scale(0.95); background: rgba(212,175,55,0.2); }

        #status-panel {
            position: absolute; top: 70px; left: 5%; width: 90%; max-width: 340px;
            background: rgba(5,5,10,0.6); backdrop-filter: blur(10px);
            border-left: 3px solid rgba(212,175,55,0.8); 
            padding: 15px 20px; z-index: 100; transition: border-color 0.8s; pointer-events: none;
            border-radius: 0 15px 15px 0; box-shadow: 0 5px 20px rgba(0,0,0,0.5);
        }

        .title-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
        
        .status-title { font-size: 1.05rem; font-weight: bold; color: var(--gold); letter-spacing: 1px; text-shadow: 0 0 10px rgba(0,0,0,0.8); transition: color 0.8s; margin: 0; line-height: 1.3; }

        .status-buddha { font-size: 0.9rem; color: #fff; font-weight: bold; letter-spacing: 1px; margin-bottom: 8px; text-shadow: 0 0 5px rgba(255,255,255,0.5); }
        
        .status-shape { font-size: 0.75rem; color: var(--cyan); letter-spacing: 1px; border: 1px solid rgba(139,168,156,0.5); padding: 3px 10px; border-radius: 12px; background: rgba(139,168,156,0.1); margin: 0; white-space: nowrap; flex-shrink: 0; }

        .status-desc { font-size: 0.85rem; color: #ddd; line-height: 1.6; letter-spacing: 1px; }

        .matrix-section { position: absolute; inset: 0; background: #000; overflow: hidden; }
        canvas { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; }

        .ui-layer { position: absolute; bottom: 5%; width: 100%; display: flex; flex-direction: column; align-items: center; z-index: 10; gap: 15px; }
        #drag-hint { color:rgba(212,175,55,0.8); font-size:0.75rem; letter-spacing:2px; margin-bottom: 5px; text-shadow: 0 0 5px #000; }

        .realm-picker-container {
            width: 100%; overflow-x: auto; scroll-snap-type: x mandatory;
            display: flex; gap: 12px; padding: 10px 50%;
            scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
        }
        .realm-picker-container::-webkit-scrollbar { display: none; }

        .realm-item {
            flex: 0 0 auto; scroll-snap-align: center;
            width: 200px; 
            min-height: 75px; 
            justify-content: center; 
            text-align: center; 
            background: rgba(15,15,15,0.8); border: 1px solid rgba(255,255,255,0.2); 
            color: #888; padding: 10px 15px; border-radius: 25px; font-size: 0.95rem; font-weight: bold; letter-spacing: 1.5px;
            cursor: pointer; backdrop-filter: blur(10px); transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex; flex-direction: column; align-items: center; gap: 5px;
            white-space: pre-wrap; 
            line-height: 1.3;
        }

        .realm-item .r-num { font-size: 0.65rem; opacity: 0.6; letter-spacing: 1px; }
        
        .realm-item.active { transform: scale(1.1); background: rgba(20,20,20,0.95); border-color: var(--solid-gold); color: var(--gold); box-shadow: 0 5px 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(212,175,55,0.2); }
        .realm-item.active.cyan-mode { border-color: var(--cyan); color: var(--cyan); box-shadow: 0 5px 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(139,168,156,0.2); }
        .realm-item.active.silver-mode { border-color: var(--silver); color: var(--silver); box-shadow: 0 5px 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(224,224,224,0.2); }
        .realm-item.active.fire-mode { border-color: var(--fire); color: #ff8a8a; box-shadow: 0 5px 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(168,50,50,0.2); }

        #theory-btn { 
            width: 85%; max-width: 320px; justify-content: center;
            background: linear-gradient(135deg, rgba(5,10,15,0.9), rgba(5,5,5,0.95)); 
            border: 1px solid rgba(139,168,156,0.6); color: var(--cyan);
            padding: 12px 20px; border-radius: 30px; font-size: 0.9rem; font-weight: bold; letter-spacing: 2px;
            cursor: pointer; display: flex; align-items: center; gap: 10px; transition: 0.3s;
        }
        #theory-btn:active { transform: scale(0.95); }

        #theory-drawer { position: fixed; bottom: 0; left: 0; width: 100vw; height: 85vh; background: rgba(5, 5, 8, 0.96); backdrop-filter: blur(20px); border-top: 1.5px solid rgba(212,175,55,0.4); border-radius: 25px 25px 0 0; transform: translateY(100%); transition: transform 0.6s cubic-bezier(0.2, 0.8, 0.2, 1); z-index: 2000; overflow-y: auto; padding: 0 0 80px 0; touch-action: pan-y; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); }
        #theory-drawer.open { transform: translateY(0); }
        .drawer-header { position: sticky; top: 0; background: linear-gradient(to bottom, rgba(5,5,8,1), rgba(5,5,8,0.95)); padding: 15px; text-align: center; z-index: 10; border-bottom: 1px solid rgba(139,168,156,0.2); }
        .close-bar { width: 40px; height: 4px; background: rgba(212,175,55,0.4); border-radius: 2px; margin: 0 auto 10px; cursor: pointer; }
        .theory-container { padding: 30px 7% 20px; max-width: 720px; margin: 0 auto; }
        .main-title { color: var(--gold); font-size: 1.5rem; letter-spacing: 3px; text-align: center; margin-bottom: 50px; text-shadow: 0 0 15px rgba(212,175,55,0.3); }
        .main-title::after { content: ''; display: block; width: 50px; height: 1.5px; background: linear-gradient(90deg, transparent, var(--solid-gold), transparent); margin: 15px auto 0; }
        .paragraph { font-size: 0.95rem; color: #ccc; line-height: 1.9; letter-spacing: 1px; text-align: justify; margin-bottom: 20px; }
        .quote-box {
            margin-top: 30px;
            padding: 15px 20px;
            background: linear-gradient(to right, rgba(212,175,55,0.1), transparent);
            border-left: 3px solid var(--solid-gold);
            border-radius: 0 10px 10px 0;
            color: #e0e0e0;
            font-size: 0.95rem;
            line-height: 1.8;
            letter-spacing: 1.5px;
            text-align: justify;
        }
        .quote-author {
            color: var(--gold);
            font-weight: bold;
            margin-bottom: 8px;
            display: block;
            font-size: 0.85rem;
            letter-spacing: 2px;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="back-btn" onclick="window.location.href='index_jp.html?screen=3'">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        道場へ戻る
    </div>
    <div id="status-panel">
        <div class="title-row">
            <div class="status-title" id="s-title">システム起動中</div>
            <div class="status-shape" id="s-shape"></div>
        </div>
        <div class="status-buddha" id="s-buddha"></div>
        <div class="status-desc" id="s-desc">法界マトリックスを読み込み中...</div>
    </div>

    <section class="matrix-section">
        <canvas id="realmCanvas"></canvas>
        <div class="ui-layer" id="ui-layer">
            <div id="drag-hint">360° 全方位スワイプ ． 星の軌道を弾いて次元を切り替える</div>
            <div class="realm-picker-container" id="picker-container"></div>
            <button id="theory-btn" onclick="openTheoryDrawer()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                華蔵の法義を探求する
            </button>
        </div>
    </section>

    <div id="theory-drawer">
        <div class="drawer-header" onclick="closeTheoryDrawer()"><div class="close-bar"></div>
            <div style="display:flex; justify-content:space-between; align-items:center; padding: 0 5px;">
                <div style="color:var(--cyan); font-size:0.85rem; letter-spacing:2px; font-weight:bold; cursor:pointer;" onclick="closeTheoryDrawer()">法巻をしまう</div>
                <div id="tts-btn" onclick="event.stopPropagation(); toggleTheoryAudio()" style="color:var(--gold); font-size:0.85rem; font-weight:bold; cursor:pointer; display:flex; align-items:center; gap:6px; background:rgba(212,175,55,0.15); padding: 6px 12px; border-radius:20px; border: 1px solid rgba(212,175,55,0.4);">
                    <svg id="tts-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path></svg>
                    <span id="tts-text">法音を聴く</span>
                </div>
            </div>
        </div>
        <div class="theory-container" id="theory-content-box">
            <h1 class="main-title" id="theory-title">華蔵大世界</h1>
            <p class="paragraph" id="theory-desc">読み込み中...</p>
        </div>
    </div>

<script>
    const RealmMatrix = [
        { id: 1, name: "最勝光遍照", buddha: "微塵数諸仏", shape: "広大", theme: "gold", desc: "【体性】極致の宝厳、衰朽なし。<br>【衆生】光潔無瑕、海会同悲。", quote: { author: "清涼国師", text: "微塵刹海、交渉融通す。広狭無礙、一多相容る。" } },
        { id: 2, name: "種種香蓮華妙荘厳", buddha: "普照十方熾然光明仏", shape: "蓮華", theme: "cyan", desc: "【体性】妙香凝結し、気韻流転す。<br>【衆生】胎にあらず卵にあらず、香華に乗じて化生す。", quote: { author: "華厳経旨", text: "毘盧遮那仏は千葉の大蓮華台に座し、葉ごとに皆百億の化身あり。此の二十重の法界は、法身の本源より無尽に化生する大千の幻境の如し。法身は万有の根本であり、無量の荘厳を幻化す。" } },
        { id: 3, name: "一切宝荘厳普照光", buddha: "獅子吼雲音仏", shape: "宝月", theme: "silver", desc: "【体性】光と影が交錯し、幻の如く化の如し。<br>【衆生】形は意に随って転じ、聚散本来無礙。", quote: { author: "法蔵大師 ‧ 金獅子章", text: "金は唯一の本体であり、獅子の諸相は皆仮名なり。マトリックス万法の流転、その背後の明光は、殆ど不生不滅の「常寂光」なり。相は万殊なりとも、理体は唯一なり。" } },
        { id: 4, name: "種種光明華荘厳", buddha: "普照法界虚空雲仏", shape: "種種華", theme: "gold", desc: "【体性】純然たる明光、諸々の滞礙を離る。<br>【衆生】光を語とし、心で照らして宣めず。" },
        { id: 5, name: "普放妙華光", buddha: "普喜無量功徳仏", shape: "摩尼王", theme: "cyan", desc: "【体性】華蔵重重、極尽の荘厳。<br>【衆生】荘厳を食とし、妙相を見るを楽しむ。" },
        { id: 6, name: "浄妙光明", buddha: "無垢功徳遍照仏", shape: "宝壇", theme: "silver", desc: "【体性】宝焔熾然、浄妙無極。<br>【衆生】威徳具足し、一念にて凡聖を転ず。", quote: { author: "清涼国師", text: "浄心は即ち華蔵であり、悲智は乃ち荘厳と為す。" } },
        { id: 7, name: "衆華光荘厳", buddha: "華雲幢仏", shape: "華旋", theme: "cyan", desc: "【体性】流光溢彩、波揚すること無尽。<br>【衆生】色を観じて空に達し、十方に感通す。", quote: { author: "清涼国師", text: "理は事の変化に随い、一多縁起の無尽なり。事は理の融するを得て、千差渋入して無礙なり。" } },
        { id: 8, name: "出生威徳光", buddha: "清浄日光明仏", shape: "半月", theme: "gold", desc: "【体性】威光遠く被い、徹して淵微を照らす。<br>【衆生】寿量恒長、慧光不滅。", quote: { author: "華厳大意", text: "一切の諸仏の身は、唯だ是れ一法身なり。諸仏の名称は異なる根機の衆生に対する度化の方便として設けられたものなり。每一重の仏号は皆、その次元の清明澄澈を明らかにするものであり、実際に幾人かの真の仏が区別して存在しているわけではない。" } },
        { id: 9, name: "出妙音声", buddha: "獅子光仏", shape: "梵篋", theme: "gold", desc: "【体性】無相無形、唯だ法音を以て震動し界を成す。<br>【衆生】眼識を離れ、唯だ音声を以て仏事を為す。", quote: { author: "李通玄 (長者)", text: "十方の虚空は、是れ吾が一巻の経なり。" } },
        { id: 10, name: "金剛幢", buddha: "普照法界金剛雲仏", shape: "金剛幢", theme: "silver", desc: "【体性】堅固にして壊すこと能わず、金剛の本心の如し。<br>【衆生】定慧不動、魔怨傾かず。" },
        { id: 11, name: "恒出現帝青宝光明", buddha: "福徳雲大海仏", shape: "帝青宝", theme: "cyan", desc: "【体性】湛然として幽邃、常に瑠璃の青光を出す。<br>【衆生】深く微密を観じ、沈して法源を照らす。" },
        { id: 12, name: "光明照耀", buddha: "清浄華雲仏", shape: "宝冠", theme: "gold", desc: "【体性】重重の交網、帝釈の明珠の如し。<br>【衆生】一多相容れ、自他無礙。", quote: { author: "清涼国師", text: "事事無礙、網の孔の相交わるが如く、光と光の相照らすが如く、障礙有る事無し。" } },
        { id: 13, name: "娑婆と極楽", buddha: "毘盧遮那如来", shape: "平正", theme: "cyan", desc: "【体性】染浄同源、苦楽交集。<br>【衆生】濁世の剛強と浄土の化生が同処する、乃ち悲智双運の枢機。", quote: { author: "悲智双運 ‧ 李長者", text: "第十三重に釈迦と弥陀が並存するは、乃ち衆生の苦を円融するためなり。一者は濁世の紛擾の中で化導し、一者は純浄無染の帰途を指し示す。二仏の並現は、実に世間において具体的に接引する大方便なり。正に謂う所の、世間を離れずして法界に入り、五濁を捨てずして浄土を厳めるなり。" } },
        { id: 14, name: "寂静離塵光", buddha: "遍法界勝音仏", shape: "宝帯", theme: "silver", desc: "【体性】清涼に覆育し、諸々の塵喧を絶つ。<br>【衆生】言を離れ慮を絶ち、黙して真如に契う。" },
        { id: 15, name: "衆妙光明灯", buddha: "普照法界法海雲仏", shape: "蓮華", theme: "gold", desc: "【体性】明灯高く懸かり、幽として燭（てら）さざる無し。<br>【衆生】自性光を放ち、迷える者の為に眼と作（な）る。", quote: { author: "李通玄 (長者)", text: "一切の衆生は、皆諸仏の果海の中に在り、瓶中の水の如く、器中の空の如し。" } },
        { id: 16, name: "清浄光遍照", buddha: "普勝智光明仏", shape: "円満", theme: "cyan", desc: "【体性】十方に周遍し、欠けること無く余すこと無し。<br>【衆生】漏尽智円、常に大寂滅に安んず。", quote: { author: "清涼国師", text: "一塵才に挙がれば、大地全く収まる。華蔵の荘厳は、一念を離れず。" } },
        { id: 17, name: "宝荘厳", buddha: "普照法界智雲仏", shape: "妙好", theme: "fire", desc: "【体性】赤光赫奕、清浄にして塵を絶つ。<br>【衆生】大悲熾盛、誓って沈淪を抜く。" },
        { id: 18, name: "離塵", buddha: "普門光明雲仏", shape: "摩尼網", theme: "silver", desc: "【体性】微塵に刹を見、芥子須弥を納む。<br>【衆生】身は極めて微細、無辺の法界を遍く遊ぶ。" },
        { id: 19, name: "清浄光普照", buddha: "普照虚空智光明仏", shape: "法界", theme: "gold", desc: "【体性】真如遍満し、方所無し。<br>【衆生】円融徹悟、一念十方に遍く。", quote: { author: "李通玄 (長者)", text: "三世古今、終始当念を離れず。十方刹海、広狭一毫に礙らず。" } },
        { id: 20, name: "妙宝焰", buddha: "福徳普勝智光明仏", shape: "宝燄", theme: "fire", desc: "【体性】妙宝焔聚、最上無極。<br>【衆生】唯だ浄願を存し、念念生生に荘厳を締造す。", quote: { author: "李通玄 (長者)", text: "若し唯心を了せば、則ち華蔵無辺なるも、法界を出でず。若し自性を明らめば、則ち重重無尽なるも、皆是れ神用なり。" } }
    ];

    let currentRealmIndex = 12;

    const PastelColors = [
        { hsl: "350, 100%, 85%", hex: "#FFB7C5" }, 
        { hsl: "120, 100%, 85%", hex: "#98FB98" }, 
        { hsl: "210, 100%, 85%", hex: "#87CEFA" }, 
        { hsl: "30, 100%, 80%", hex: "#FFDAB9" },  
        { hsl: "0, 0%, 80%", hex: "#D3D3D3" },     
        { hsl: "270, 100%, 85%", hex: "#E6E6FA" }  
    ];
    function getRandomPastel() { return PastelColors[Math.floor(Math.random()*PastelColors.length)]; }

    const pickerContainer = document.getElementById('picker-container');
    function initPicker() {
        RealmMatrix.forEach((realm, index) => {
            let btn = document.createElement('div');
            btn.className = `realm-item ${realm.theme}-mode`;
            btn.id = `picker-${index}`;
            btn.innerHTML = `<span class="r-num">TIER ${realm.id}</span><span>${realm.name}</span>`;
            btn.onclick = () => { selectRealm(index); btn.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' }); };
            pickerContainer.appendChild(btn);
        });
    }

    function selectRealm(index) {
        if(currentRealmIndex === index && document.getElementById(`picker-${index}`).classList.contains('active')) return;
        currentRealmIndex = index;
        let data = RealmMatrix[index];

        document.querySelectorAll('.realm-item').forEach(el => el.classList.remove('active'));
        document.getElementById(`picker-${index}`).classList.add('active');

        document.getElementById('s-title').innerText = `第${data.id}重 ． ${data.name}`;
        document.getElementById('s-buddha').innerText = `[教主] ${data.buddha}`;
        document.getElementById('s-shape').innerText = `形状：${data.shape}`;
        document.getElementById('s-desc').innerHTML = data.desc;
        document.getElementById('theory-title').innerText = `第${data.id}重 ． ${data.name}`;
        
        let theoryHTML = `本層は華蔵世界海の第${data.id}重です。<br><br>【教主】${data.buddha}<br>【国土の形状】${data.shape}の相を呈しています。<br>${data.desc}`;
        
        if (data.quote) {
            theoryHTML += `<div class="quote-box"><span class="quote-author">【${data.quote.author} 云く】</span>${data.quote.text}</div>`;
        }
        
        document.getElementById('theory-desc').innerHTML = theoryHTML;

        let themeColor = data.theme;
        if(data.id === 16) themeColor = 'gold'; 

        let baseColor = themeColor === 'gold' ? '#f3e5ab' : (themeColor === 'cyan' ? '#8ba89c' : (themeColor === 'silver' ? '#e0e0e0' : '#ff8a8a'));
        let borderColor = themeColor === 'gold' ? 'rgba(212,175,55,0.8)' : (themeColor === 'cyan' ? 'rgba(139,168,156,0.8)' : (themeColor === 'silver' ? 'rgba(224,224,224,0.8)' : 'rgba(168,50,50,0.8)'));
        
        document.getElementById('s-title').style.color = baseColor; 
        document.getElementById('s-shape').style.color = baseColor; 
        document.getElementById('s-shape').style.borderColor = baseColor;
        document.getElementById('status-panel').style.borderLeftColor = borderColor;

        angleX = 0.3; angleY = 0; 
        initParticleEngines(); 
    }

    const canvas = document.getElementById('realmCanvas');
    const ctx = canvas.getContext('2d');
    let width, height, time = 0, stars = [], realmParticles = [];
    let angleX = 0.3, angleY = 0, isDragging = false, lastMouseX = 0, lastMouseY = 0;
    const FOV = 400; 

    function resize() { width = window.innerWidth; height = window.innerHeight; canvas.width = width; canvas.height = height; }
    window.addEventListener('resize', resize); resize();

    function project3D(x, y, z) {
        let cosX = Math.cos(angleX), sinX = Math.sin(angleX), cosY = Math.cos(angleY), sinY = Math.sin(angleY);
        let y1 = y*cosX - z*sinX, z1 = y*sinX + z*cosX;
        let x2 = x*cosY - z1*sinY, z2 = x*sinY + z1*cosY;
        if(z2 < -FOV+50) return null;
        let scale = FOV / (FOV + z2 + 100); 
        return { px: (width/2) + x2*scale, py: (height/2) - y1*scale + 20, scale: scale, pz: z2 };
    }

    function initParticleEngines() {
        if(stars.length === 0) {
            for (let i = 0; i < 1000; i++) {
                let starSize = Math.random() > 0.8 ? Math.random() * 2.5 + 1.5 : Math.random() * 1.2 + 0.3;
                stars.push({ 
                    x: (Math.random()-0.5)*3000, 
                    y: (Math.random()-0.5)*3000, 
                    z: Math.random()*2000, 
                    speed: Math.random()*2+0.5, 
                    color: Math.random()>0.5 ? '#8ba89c' : '#f3e5ab', 
                    size: starSize 
                });
            }
        }

        realmParticles = [];
        let id = RealmMatrix[currentRealmIndex].id;

        function addColorfulParticle(x, y, z, extra = {}) {
            let pastel = getRandomPastel();
            realmParticles.push({ x, y, z, ...extra, col: pastel });
        }

        if (id === 1) { 
            let N = 800, R = 180, goldenAngle = Math.PI * (3 - Math.sqrt(5)); 
            for(let i=0; i<N; i++) {
                let y = 1 - (i / (N - 1)) * 2, radius = Math.sqrt(1 - y*y), theta = goldenAngle * i;
                addColorfulParticle(Math.cos(theta)*radius*R, y*R, Math.sin(theta)*radius*R, { seed: Math.random()*Math.PI*2, type: 'mani' });
            }
        }
        else if (id === 2) { 
            for (let l = 0; l < 4; l++) {
                let pCount = [6, 8, 10, 12][l], rOut = 40 + l * 25, hUp = 20 + l * 20;  
                for (let p = 0; p < pCount; p++) {
                    let aC = (Math.PI * 2 / pCount) * p + (l * 0.3); 
                    for (let t = 0; t <= 1; t += 0.1) { 
                        for (let w = -1; w <= 1; w += 0.4) { 
                            let pW = Math.sin(t * Math.PI) * (15 + l * 5), cR = t * rOut, cY = -t * hUp + (w * w * 12); 
                            realmParticles.push({ x: cR * Math.cos(aC) - (w * pW) * Math.sin(aC), y: cY + 40, z: cR * Math.sin(aC) + (w * pW) * Math.cos(aC), type: 'lotus', l: l, t: t, col: {hsl: "139, 168, 156"} }); 
                        }
                    }
                }
            }
            for(let i=0; i<300; i++) addColorfulParticle((Math.random()-0.5)*300, Math.random()*200-50, (Math.random()-0.5)*300, { type: 'aroma', sy: Math.random()*0.8+0.3, seed: Math.random()*Math.PI*2 });
        }
        else if (id === 3) { 
            for(let b = 1; b < 16; b++) {
                let phi = (Math.PI / 16) * b;
                for(let s = 0; s < 32; s++) {
                    let theta = (Math.PI * 2 / 32) * s;
                    realmParticles.push({ x: 130 * Math.sin(phi) * Math.cos(theta), y: 130 * Math.cos(phi), z: 130 * Math.sin(phi) * Math.sin(theta), theta: theta, phi: phi, type: 'grid', col:{hsl:"0,0%,88%"} });
                }
            }
            for(let i = 0; i < 150; i++) {
                let t = Math.random() * Math.PI * 2, p = Math.acos((Math.random() * 2) - 1), r = Math.random() * 50; 
                realmParticles.push({ x: r*Math.sin(p)*Math.cos(t), y: r*Math.cos(p), z: r*Math.sin(p)*Math.sin(t), speed: Math.random()*0.05+0.02, type: 'core', col:{hsl:"0,0%,100%"} });
            }
        }
        else if (id === 4) { 
            for(let l = 1; l <= 6; l++) {
                let rL = l * 25, yO = Math.sin(l * 0.5) * 20;
                for(let p = 0; p < 12; p++) {
                    let ang = (Math.PI * 2 / 12) * p + (l * 0.2); 
                    for(let t = 0; t <= 1; t += 0.15) { 
                        realmParticles.push({ x: rL * t * Math.cos(ang), y: yO * t - (t * t * 40), z: rL * t * Math.sin(ang), l: l, p: p, t: t, type: 'net' }); 
                    }
                }
            }
        }
        else if (id === 5) { 
            for(let i=0; i<300; i++) {
                let t = Math.random() * Math.PI * 2, p = Math.acos((Math.random() * 2) - 1), r = Math.random() * 40; 
                addColorfulParticle(r*Math.sin(p)*Math.cos(t), r*Math.cos(p), r*Math.sin(p)*Math.sin(t), { type: 'mani-core' });
            }
            
            for(let i=0; i<12; i++) {
                let col = getRandomPastel();
                let bandAngle = (i / 12) * Math.PI * 2;
                for(let a=0; a<Math.PI*2; a+=0.1) {
                    realmParticles.push({
                        lineId:i, a:a, bandAng:bandAngle, col: col, type:'mani-cage'
                    });
                }
            }
        }

        else if (id === 6) { 
            let layers = 15; let segments = 120;
            for(let l = 0; l < layers; l++) {
                let zBase = (l - layers/2) * 25;
                let radiusBase = 120 * Math.sin((l/layers) * Math.PI) + 20;
                for(let i = 0; i < segments; i++) {
                    let theta = (i / segments) * Math.PI * 2;
                    let col = getRandomPastel();
                    realmParticles.push({ x: 0, y: 0, z: zBase, bR: radiusBase, th: theta, l: l, type: 'old9', col: col });
                }
            }
        }
        else if (id === 7) { 
            for(let i=0; i<1200; i++) {
                let t = i / 1200, a = t * Math.PI * 15, r = t * 160;
                let baseHue = (t * 360 * 3) % 360; 
                
                realmParticles.push({ x: r*Math.cos(a), y: (Math.random()-0.5)*30, z: r*Math.sin(a), hue: baseHue });
                realmParticles.push({ x: r*Math.cos(a+Math.PI), y: (Math.random()-0.5)*30, z: r*Math.sin(a+Math.PI), hue: (baseHue + 180) % 360 });
            }
        }

        else if (id === 8) { 
            for(let i=0; i<600; i++) {
                let t = Math.random() * Math.PI, p = Math.acos((Math.random() * 2) - 1);
                addColorfulParticle(140*Math.sin(p)*Math.cos(t), 140*Math.sin(p)*Math.sin(t), 140*Math.cos(p));
            }
        }
        else if (id === 9) { 
            let w = 120, h = 40, d = 160; 
            for(let x = -w; x <= w; x += 15) {
                for(let y = -h; y <= h; y += 15) {
                    for(let z = -d; z <= d; z += 15) {
                        if(Math.abs(x) === w || Math.abs(y) === h || Math.abs(z) === d) addColorfulParticle(x, y, z);
                    }
                }
            }
        }
        else if (id === 10) { 
            let size = 110;
            let v = [[-size,-size,-size],[size,-size,-size],[size,size,-size],[-size,size,-size],[-size,-size,size],[size,-size,size],[size,size,size],[-size,size,size]];
            v.forEach(pt => realmParticles.push({ x:pt[0], y:pt[1], z:pt[2], type:'vimo-v', col: PastelColors[4] })); 
            
            for(let i=0; i<1200; i++) {
                let col = getRandomPastel();
                let x = (Math.random()-0.5)*size*1.9, y = (Math.random()-0.5)*size*1.9, z = (Math.random()-0.5)*size*1.9;
                if(Math.random()>0.5) { x = (Math.random()>0.5?size:-size)*Math.random(); } else { z = (Math.random()>0.5?size:-size)*Math.random(); }
                realmParticles.push({ x, y, z, type:'vimo-line', col: col });
            }
        }
        else if (id === 11) { 
            for(let i=0; i<800; i++) {
                let t = Math.random()*Math.PI*2, p = Math.random()*Math.PI;
                let x = 140 * Math.pow(Math.abs(Math.cos(p)), 0.5) * Math.sign(Math.cos(p)) * Math.cos(t);
                let y = 140 * Math.pow(Math.abs(Math.sin(p)), 0.5) * Math.sign(Math.sin(p)) * Math.sin(t);
                addColorfulParticle(x, y, 140*Math.cos(t));
            }
        }
        else if (id === 12) { 
            for(let i=0; i<150; i++) {
                let pastel = getRandomPastel();
                realmParticles.push({
                    x: (Math.random()-0.5)*120, 
                    y: (Math.random()-0.5)*120,
                    z: (Math.random()-0.5)*120,
                    s: Math.random()*2+1, 
                    type: 'halo-core', col: pastel 
                });
            }
            for(let i=0; i<12; i++) {
                let params = {
                    fx: 2 + Math.random()*2, fy: 2 + Math.random()*2, fz: 2 + Math.random()*2,
                    ph: Math.random()*Math.PI*2, col: getRandomPastel()
                };
                for(let a=0; a<Math.PI*2; a+=0.05) { 
                    realmParticles.push({ lineId:i, a:a, ...params, type:'line-12chaotic' });
                }
            }
        }

        else if (id === 13) { 
            for(let i = 0; i < 300; i++) {
                let t = Math.random() * Math.PI * 2, p = Math.acos(Math.random()*2 - 1), r = Math.random() * 50 + 10;
                realmParticles.push({ x: r*Math.sin(p)*Math.cos(t), y: r*Math.cos(p), z: r*Math.sin(p)*Math.sin(t), s: Math.random()*2+1, type: 'saha' });
                
                t = Math.random() * Math.PI * 2; p = Math.acos(Math.random()*2 - 1); r = Math.random() * 50 + 10;
                realmParticles.push({ x: r*Math.sin(p)*Math.cos(t), y: r*Math.cos(p), z: r*Math.sin(p)*Math.sin(t), s: Math.random()*2+1.5, type: 'pure' });
            }
        }

        else if (id === 14) { 
            for(let band = 0; band < 14; band++) {
                let col = PastelColors[band % PastelColors.length];
                let angleOffset = (band / 14) * Math.PI * 2; 
                
                for(let i = 0; i < 60; i++) { 
                    let t = (i / 60) * Math.PI * 2;
                    realmParticles.push({
                        x: 0, y: 0, z: 0, 
                        tOffset: t,        
                        angOff: angleOffset, 
                        band: band,        
                        col: col, 
                        type: 'ribbon-14'
                    });
                }
            }
        }

        else if (id === 15) { 
            for(let i = 0; i < 15; i++) {
                let centerAng = (i / 15) * Math.PI * 2;
                let cx = 60 * Math.cos(centerAng);
                let cy = 60 * Math.sin(centerAng);
                let cz = Math.sin(i * 1.5) * 20; 
                
                let col = PastelColors[Math.floor(Math.random() * PastelColors.length)];

                for(let a = 0; a < Math.PI * 2; a += 0.1) {
                    realmParticles.push({
                        cx: cx, cy: cy, cz: cz, 
                        ang: a,                 
                        col: col,               
                        type: 'lotus-15'
                    });
                }
            }
        }

        else if (id === 16) { 
            for(let i=0; i<1000; i++) {
                let p = Math.acos(1 - 2*i/1000), t = Math.PI * (1 + Math.sqrt(5)) * i;
                realmParticles.push({ x: 140*Math.sin(p)*Math.cos(t), y: 140*Math.cos(p), z: 140*Math.sin(p)*Math.sin(t), col:{hsl:"48, 100%, 65%"}, glow: "#d4af37" });
            }
        }
        else if (id === 17) { 
            for(let i=0; i<17; i++) {
                let col = getRandomPastel();
                let rX = Math.random()*Math.PI*2, rY = Math.random()*Math.PI*2, rZ = Math.random()*Math.PI*2;
                for(let a=0; a<Math.PI*2; a+=0.1) {
                    realmParticles.push({ x:0, y:0, z:0, a:a, rX:rX, rY:rY, rZ:rZ, col:col, type:'knot-17' });
                }
            }
        }
        else if (id === 18) { 
            for(let i=0; i<800; i++) { addColorfulParticle((Math.random()-0.5)*260, (Math.random()-0.5)*260, (Math.random()-0.5)*260, { hueOffset: Math.random()*360 }); }
        }
        else if (id === 19) { 
            for(let i=0; i<800; i++) {
                let u = Math.random()*Math.PI*2, v = Math.random()*Math.PI*2;
                let x = (100 + 40*Math.cos(v)) * Math.cos(u);
                let y = (100 + 40*Math.cos(v)) * Math.sin(u);
                let z = 40 * Math.sin(v);
                realmParticles.push({ x, y, z, col: {hsl: "48, 100%, 65%"}, hex: "#d4af37", type: 'dharma-19' });
            }
        }

        else if (id === 20) { 
            for(let i=0; i<1200; i++) {
                let t = Math.random()*Math.PI*2, p = Math.acos((Math.random()*2)-1);
                let noise = Math.sin(t*6)*20 + Math.cos(p*4)*25;
                let isC = Math.random()>0.85; 
                realmParticles.push({ x:0,y:0,z:0, baseR:80+noise+Math.random()*15, t, p, isC, oS:isC?Math.random()*0.08+0.03:0, hue:30+Math.random()*40, s:isC?Math.random()*3+2:Math.random()*1.5+0.5 });
            }
        }
    }

    function renderWorld() {
        let projected = [];
        let data = RealmMatrix[currentRealmIndex];
        let id = data.id;

        if(!isDragging && id !== 9 && id !== 13) angleY += 0.003; 
        if(!isDragging && id === 9) { angleY += 0.005; angleX = Math.sin(time*0.5)*0.3; } 

        realmParticles.forEach(p => {
            let wx = p.x, wy = p.y, wz = p.z;
            let a = 0.7, s = 1.5, isGlow = true;
            
            let pastel = p.col ? p.col : getRandomPastel();
            let c = `rgba(${pastel.hsl},`;
            let glowC = pastel.hex ? pastel.hex : `hsl(${pastel.hsl.split(',')[0]}, 100%, 75%)`;

            if (id === 1) { 
                let breath = 1 + Math.sin(time*1.5 + p.seed)*0.03; wx *= breath; wy *= breath; wz *= breath;
                let isBright = Math.sin(time*4 + p.seed) > 0.85; a = isBright ? 1 : 0.4; s = isBright ? 2.5 : 1.2;
            }
            else if (id === 2) { 
                if (p.type === 'lotus') {
                    let breath = 1 + Math.sin(time*2 + p.l)*0.06*p.t; wx *= breath; wy += Math.sin(time*1.5)*5; wz *= breath;
                    a = 0.2 + (p.t*0.6); isGlow = p.t > 0.8;
                } else {
                    wy -= p.sy; if (wy < -200) wy = 150; p.y = wy;
                    wx += Math.sin(wy*0.02 + time + p.seed)*20; wz += Math.cos(wy*0.02 + time + p.seed)*20;
                    a = (Math.sin(time*3 + p.seed)+1)/2 * 0.8;
                }
            }
            else if (id === 3) { 
                if (p.type === 'grid') {
                    let wave = 1 + Math.sin(time*3 + p.theta*4 + p.phi*2)*0.05; wx *= wave; wy *= wave; wz *= wave; a = 0.3 + Math.sin(p.phi)*0.6;
                } else {
                    let pulseR = 1 + Math.sin(time*5 + p.speed*100)*0.5; let rotA = time * p.speed * 10;
                    wx = (p.x*Math.cos(rotA) - p.z*Math.sin(rotA)) * pulseR; wz = (p.x*Math.sin(rotA) + p.z*Math.cos(rotA)) * pulseR; wy *= pulseR; a = 1; s = 2.5;
                }
            }
            else if (id === 4) { 
                let breath = 1 + Math.sin(time*2 + p.l)*0.1; wx *= breath; wy *= breath; wz *= breath;
                let hue = (p.l*40 + p.p*20 + time*40) % 360; c = `hsla(${hue}, 100%, 75%,`; glowC = `hsl(${hue}, 100%, 75%)`; a = 0.4 + p.t*0.6; s = 1.8;
            }
            else if (id === 5) { 
                if(p.type === 'mani-core') {
                    let pulse = 1 + Math.sin(time*10)*0.1;
                    wx = p.x * pulse; wy = p.y * pulse; wz = p.z * pulse;
                    c = `rgba(255,255,255,`; glowC = "#fff"; a = 0.9 + Math.sin(time*15)*0.1; s = 2.5; isGlow = true;
                } else {
                    let radius = 130; 
                    let rotX = time*0.5 + p.lineId*0.3; 
                    let orbitY = time * 0.3 + p.bandAng;

                    let bx = radius * Math.cos(p.a);
                    let by = radius * Math.sin(p.a);
                    let bz = 0;
                    
                    let x1 = bx * Math.cos(p.bandAng) - bz * Math.sin(p.bandAng);
                    let y1 = by;
                    let z1 = bx * Math.sin(p.bandAng) + bz * Math.cos(p.bandAng);
                    
                    let rotY = time * 0.2;
                    wx = x1*Math.cos(rotY) - z1*Math.sin(rotY); wy = y1; wz = x1*Math.sin(rotY) + z1*Math.cos(rotY);
                    
                    let breathe = 1 + Math.sin(time*1.5 + wy*0.01)*0.08;
                    wx*=breathe; wy*=breathe; wz*=breathe;

                    c = `rgba(${p.col.hsl},`; glowC = p.col.hex; a = 0.8; s = 1.8; isGlow = true;
                }
            }

            else if (id === 6) { 
                let f1 = 8, a1 = 15 * Math.sin(time*2 + p.l*0.5);
                let f2 = 24, a2 = 5 * Math.cos(time*3);
                let r = p.bR + a1 * Math.sin(f1 * p.th) + a2 * Math.cos(f2 * p.th);
                wx = r * Math.cos(p.th + time*0.5);
                wz = r * Math.sin(p.th + time*0.5);
                wy = p.z; 
                a = 0.3 + (p.l / 15) * 0.7;
            }
            else if (id === 7) { 
                let rot = time * (1.5 + p.x / 200); 
                wx = p.x * Math.cos(rot) - p.z * Math.sin(rot); 
                wz = p.x * Math.sin(rot) + p.z * Math.cos(rot);
                
                let currentHue = (p.hue + time * 40) % 360;
                c = `hsla(${currentHue}, 90%, 65%,`; 
                glowC = `hsl(${currentHue}, 90%, 65%)`; 
                a = 0.8;
                s = 1.8;
            }

            else if (id === 9) { 
                let jump = Math.abs(Math.sin(p.x * 0.08 + time * 6) * Math.cos(p.z * 0.08 + time * 4));
                
                if (Math.abs(p.y) >= 40) {
                    wy += (p.y > 0 ? 1 : -1) * jump * 35;
                } else {
                    wx += Math.sin(time * 10 + p.y * 0.1) * 4;
                    wz += Math.cos(time * 10 + p.y * 0.1) * 4;
                }

                wy += Math.sin(time * 3 + p.x * 0.05) * 10;
                
                a = 0.4 + jump * 0.6;
                s = 1.2 + jump * 2.5; 
            }

            else if (id === 10) { 
                if(p.type==='vimo-net') {
                    wx += Math.sin(time*2 + wz)*2; wy += Math.cos(time*2 + wx)*2; wz += Math.sin(time*2 + wy)*2;
                    if(wx>110)wx=-110; if(wx<-110)wx=110; if(wy>110)wy=-110; if(wy<-110)wy=110; if(wz>110)wz=-110; if(wz<-110)wz=110;
                    p.x=wx; p.y=wy; p.z=wz;
                }
                s = p.type==='vimo-v'?4:1.2; a = p.type==='vimo-v'?1:0.7;
            }
            else if (id === 12) { 
                if(p.type === 'halo-core') {
                    let breathe = 1 + Math.sin(time*2)*0.1;
                    wx = p.x * breathe + Math.sin(time*5+p.x)*2; 
                    wy = p.y * breathe; wz = p.z * breathe;
                    a = 0.5 + Math.sin(time*4)*0.2; s = p.s;
                } else {
                    let baseR = 120;
                    let amp = 1 + Math.sin(time*2 + p.lineId)*0.2;
                    
                    wx = baseR * Math.cos(p.a * p.fx + time*1.5) * amp;
                    wy = baseR * Math.sin(p.a * p.fy + time*1.3) * amp;
                    wz = baseR * Math.sin(p.a * p.fz + time + p.ph) * amp;

                    wx += Math.sin(p.a*15 + time*8)*6; wy += Math.cos(p.a*15 + time*8)*6;

                    a = 0.9; s = 2.0; 
                }
                c = `rgba(${p.col.hsl},`; glowC = p.col.hex;
            }

            else if (id === 13) { 
                let ob = time * 0.8;
                let cx = 120 * Math.cos(p.type === 'saha' ? ob : ob + Math.PI);
                let cz = 120 * Math.sin(p.type === 'saha' ? ob : ob + Math.PI);
                let cyOffset = Math.sin(time * 2 + (p.type === 'saha' ? 0 : Math.PI)) * 20;
                
                wx = p.x + cx; 
                wy = p.y + cyOffset; 
                wz = p.z + cz;
                
                if (p.type === 'saha') {
                    c = 'rgba(139,168,156,'; glowC = '#8ba89c'; a = 0.8;
                } else {
                    c = 'rgba(243,229,171,'; glowC = '#d4af37'; a = 0.9;
                }
                s = p.s;
            }

            else if (id === 14) { 
                let flow = p.tOffset + time * 1.5; 
                
                let bx = (90 + 30 * Math.cos(flow / 2)) * Math.cos(flow);
                let by = (90 + 30 * Math.cos(flow / 2)) * Math.sin(flow);
                let bz = 40 * Math.sin(flow / 2);
                
                wx = bx * Math.cos(p.angOff) - bz * Math.sin(p.angOff);
                wy = by;
                wz = bx * Math.sin(p.angOff) + bz * Math.cos(p.angOff);
                
                let breath = 1 + Math.sin(time * 2 + p.band) * 0.05;
                wx *= breath; wy *= breath; wz *= breath;
                
                a = 0.8; s = 1.8;
            }

            else if (id === 15) { 
                let r = 80; 
                
                let flowAng = p.ang + time * 3;
                let localX = r * Math.cos(flowAng);
                let localY = r * Math.sin(flowAng);
                
                wx = p.cx + localX;
                wy = p.cy + localY;
                wz = p.cz + Math.sin(p.ang * 3) * 15; 
                
                c = `rgba(${p.col.hsl},`;
                glowC = p.col.hex;
                a = 0.8; 
                s = 1.5;
            }

            else if (id === 16) { 
                c = `rgba(212,175,55,`; glowC = "#fff"; s = 1.8; a = 0.8;
            }
            else if (id === 17) { 
                let r = 130;
                let bx = r * Math.cos(p.a);
                let by = r * Math.sin(p.a);
                let bz = 0;
                let y1 = by*Math.cos(p.rX) - bz*Math.sin(p.rX), z1 = by*Math.sin(p.rX) + bz*Math.cos(p.rX);
                let x2 = bx*Math.cos(p.rY) - z1*Math.sin(p.rY), z2 = bx*Math.sin(p.rY) + z1*Math.cos(p.rY);
                wx = x2*Math.cos(p.rZ) - y1*Math.sin(p.rZ); wy = x2*Math.sin(p.rZ) + y1*Math.cos(p.rZ); wz = z2;
                a = 0.8;
            }
            else if (id === 18) { 
                let hue = (time * 60 + p.hueOffset) % 360; c = `hsla(${hue}, 90%, 70%,`; glowC = `hsl(${hue}, 90%, 70%)`; s = 2.5;
            }
            else if (id === 19) { 
                wy += Math.sin(time * 2 + wx * 0.02) * 10; 
                wz += Math.cos(time * 2 + wy * 0.02) * 10;
                c = `rgba(212,175,55,`; 
                glowC = "#fff"; 
                a = 0.8; 
                s = 1.8;
            }

            else if (id === 20) { 
                if(p.isC) { p.t += p.oS; p.p += p.oS * 0.5; }
                let breath = 1 + Math.sin(time*3 + p.t)*0.1; let r = p.baseR * breath;
                wx = r*Math.sin(p.p)*Math.cos(p.t); wy = r*Math.cos(p.p) - 20; wz = r*Math.sin(p.p)*Math.sin(p.t);
                let hue = p.isC ? 60 : (p.hue + time*20)%360; let lgt = p.isC ? 85 : 65;
                c = `hsla(${hue}, 100%, ${lgt}%,`; glowC = `hsl(${hue}, 100%, ${lgt}%)`; s = p.s; a = p.isC?1:0.4+Math.sin(time*5+p.t)*0.3;
            }

            let proj = project3D(wx, wy, wz);
            if(proj) { projected.push({ x: proj.px, y: proj.py, z: proj.pz, sc: proj.scale, a: a, c: c, s: s, isGlow: isGlow, glowC: glowC }); }
        });

        if(id === 13) {
            let cx1 = 120*Math.cos(time*0.8), cz1 = 120*Math.sin(time*0.8);
            let cx2 = 120*Math.cos(time*0.8+Math.PI), cz2 = 120*Math.sin(time*0.8+Math.PI);
            let p1 = project3D(cx1, Math.sin(time*2)*20, cz1); let p2 = project3D(cx2, Math.sin(time*2+Math.PI)*20, cz2);
            if(p1 && p2) { ctx.beginPath(); ctx.moveTo(p1.px, p1.py); ctx.lineTo(p2.px, p2.py); ctx.strokeStyle = `rgba(212,175,55,0.2)`; ctx.lineWidth = 2*p1.scale; ctx.stroke(); }
        }

        projected.sort((a,b) => b.z - a.z);
        ctx.globalCompositeOperation = 'screen';
        projected.forEach(p => {
            ctx.beginPath(); ctx.arc(p.x, p.y, Math.max(0.1, p.s * p.sc), 0, Math.PI*2);
            ctx.fillStyle = p.c.includes('hsla') ? p.c + p.a + ')' : p.c + p.a + ')';
            
            if(p.isGlow) { 
                let glowFactor = (id === 12) ? 2.5 : 1.0;
                ctx.shadowBlur = 12 * p.sc * glowFactor; 
                ctx.shadowColor = p.glowC; 
            } else { 
                ctx.shadowBlur = 0; 
            }
            
            ctx.fill();
        });
        ctx.shadowBlur = 0; ctx.globalCompositeOperation = 'source-over';
    }

    function animate() {
        ctx.fillStyle = 'rgba(1, 1, 3, 0.6)'; 
        ctx.fillRect(0, 0, width, height);
        time += 0.015;

        ctx.globalCompositeOperation = 'screen';
        stars.forEach(s => {
            s.z -= s.speed; if (s.z <= 0) { s.z = 2000; s.x = (Math.random()-0.5)*3000; s.y = (Math.random()-0.5)*3000; }
            let sc = FOV / (FOV + s.z); let sx = (width/2) + s.x*sc; let sy = (height/2) + s.y*sc - 50;
            ctx.beginPath(); ctx.arc(sx, sy, Math.max(0.1, s.size*sc), 0, Math.PI*2);
            ctx.fillStyle = s.color === '#f3e5ab' ? `rgba(255,183,197, ${Math.min(1, sc*2)})` : `rgba(135,206,250, ${Math.min(1, sc*2)})`; ctx.fill();
        });
        ctx.globalCompositeOperation = 'source-over';

        renderWorld();
        requestAnimationFrame(animate);
    }

    function onDown(e) { if(e.target.closest('.ui-layer') || e.target.closest('#theory-drawer')) return; isDragging = true; lastMouseX = e.touches?e.touches[0].clientX:e.clientX; lastMouseY = e.touches?e.touches[0].clientY:e.clientY; }
    function onMove(e) { if (!isDragging) return; let curX = e.touches?e.touches[0].clientX:e.clientX; let curY = e.touches?e.touches[0].clientY:e.clientY; angleY += (curX-lastMouseX)*0.01; angleX += (curY-lastMouseY)*0.01; angleX = Math.max(-Math.PI/2, Math.min(Math.PI/2, angleX)); lastMouseX=curX; lastMouseY=curY; }
    function onUp() { isDragging = false; }
    canvas.addEventListener('pointerdown', onDown); canvas.addEventListener('pointermove', onMove); window.addEventListener('pointerup', onUp); canvas.addEventListener('pointercancel', onUp);
    
    function openTheoryDrawer() { document.getElementById('theory-drawer').classList.add('open'); }
    function closeTheoryDrawer() { document.getElementById('theory-drawer').classList.remove('open'); }
    document.getElementById('theory-drawer').addEventListener('pointerdown', (e) => e.stopPropagation());
    
    let isPlayingTheory = false; let theoryUtterance = null; 
    function toggleTheoryAudio() {
        if (!window.speechSynthesis) return; const btnText = document.getElementById('tts-text'), btnIcon = document.getElementById('tts-icon');
        if (isPlayingTheory) { window.speechSynthesis.cancel(); isPlayingTheory = false; btnText.innerText = "法音を聴く"; btnIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>';
        } else {
            let textToRead = Array.from(document.querySelectorAll('#theory-content-box .main-title, #theory-content-box .paragraph')).map(n => n.textContent.trim()).join('。');
            let isAndroid = /Android/i.test(navigator.userAgent); 
            theoryUtterance = new SpeechSynthesisUtterance(textToRead); theoryUtterance.lang = 'ja-JP'; theoryUtterance.rate = 0.85; 
            if (isAndroid) { 
                window.sysUtterances.push(theoryUtterance); 
                let voices = window.speechSynthesis.getVoices(); 
                if (voices.length > 0) { 
                    let jaVoice = voices.find(v => v.lang === 'ja-JP' && v.name.includes('Google')) || voices.find(v => v.lang.includes('ja')); 
                    if (jaVoice) theoryUtterance.voice = jaVoice; 
                } 
            } else {
                let voices = window.speechSynthesis.getVoices();
                if (voices.length > 0) {
                    let jaVoice = voices.find(v => v.lang === 'ja-JP');
                    if (jaVoice) theoryUtterance.voice = jaVoice;
                }
            }
            theoryUtterance.onend = () => { isPlayingTheory = false; btnText.innerText = "法音を聴く"; btnIcon.innerHTML = '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>'; if(isAndroid) window.sysUtterances = window.sysUtterances.filter(u => u !== theoryUtterance); };
            setTimeout(() => { window.speechSynthesis.speak(theoryUtterance); }, isAndroid ? 150 : 50); isPlayingTheory = true; btnText.innerText = "聴くのをやめる"; btnIcon.innerHTML = '<rect x="6" y="6" width="12" height="12"></rect>';
        }
    }
    const originalCloseTheoryDrawer = closeTheoryDrawer; closeTheoryDrawer = function() { if (isPlayingTheory) toggleTheoryAudio(); originalCloseTheoryDrawer(); }

    initPicker(); selectRealm(currentRealmIndex); 
    setTimeout(() => { document.getElementById(`picker-${currentRealmIndex}`).scrollIntoView({ inline: 'center' }); }, 100);
    animate();
</script>
