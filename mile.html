<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#020204">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <title>彌勒法界 ‧ 大慈歡喜瞻禮道場</title>
    <style>
        :root {
            --bg-deep: #0a0b0d; 
            --gold-light: #fbeba5; 
            --gold-solid: #d4af37; 
            --amber: #ffbf00; 
        }
        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; outline: none; }

        html, body { 
            background-color: var(--bg-deep); 
            width: 100%; height: 100%; overflow: hidden; touch-action: none;
        }
        body { 
            background: radial-gradient(circle at 50% 45%, #181b22 0%, var(--bg-deep) 100%); 
            font-family: "PingFang TC", "Microsoft JhengHei", serif;
            display: flex; flex-direction: column; justify-content: center; align-items: center; color: #fff;
            transition: background 2s ease;
        }

      /* 背景畫布 */
        canvas { position: absolute; inset: 0; }
        #starCanvas { z-index: 1; pointer-events: none; transition: filter 2s ease; }
        
        /* 🌟 修改點：平時常態下，水波紋完全顯現 */
        #waterCanvas { 
            z-index: 2; 
            mix-blend-mode: screen; 
            opacity: 0.6; 
            pointer-events: none; 
            transition: opacity 1.2s cubic-bezier(0.25, 1, 0.5, 1); /* 優化過渡時間至 1.2 秒 */
        }
        
        /* 🌟 新增：當頂禮（bowing-active）或燒香（incense-on）觸發時，水波紋瞬間優雅淡出隱藏 */
        body.bowing-active #waterCanvas,
        body.incense-on #waterCanvas { 
            opacity: 0 !important; 
        }

        /* 頂部導航與護持資訊 */
        .nav-top { position: absolute; top: max(20px, env(safe-area-inset-top)); left: 15px; z-index: 1000; display: flex; gap: 6px; }
        .nav-btn { 
            color: var(--gold-light); display: flex; align-items: center; gap: 6px; 
            cursor: pointer; background: rgba(0,0,0,0.5); padding: 6px 12px; 
            border-radius: 20px; border: 1px solid rgba(212,175,55,0.2); 
            backdrop-filter: blur(5px); font-size: 0.75rem; letter-spacing: 1px; 
            transition: 0.4s; opacity: 0.8; white-space: nowrap;
        }
        .nav-btn:hover { opacity: 1; border-color: var(--gold-solid); }

        /* 聖像主體層 */
        #buddha-scene {
            position: absolute; inset: 0; z-index: 10; margin: 0 auto;
            display: flex; justify-content: center; align-items: center;
            transform-origin: 50% 75%; transition: transform 4s cubic-bezier(0.25, 1, 0.5, 1);
            pointer-events: none; width: 100%; max-width: 680px; 
        }
        #buddha-scene.bowing { transform: scale(1.2) translateY(10%); }

        /* 萬丈白毫願力淡綠光爆發層 */
    #burst-container { position: absolute; inset: 0; display: flex; justify-content: center; align-items: center; z-index: 5; pointer-events: none; }
    
    .screen-flash {
        position: absolute; inset: 0; 
        background: radial-gradient(circle at 50% 45%, #ffffff 0%, #b9f6ca 45%, #69f0ae 70%, transparent 90%);
        opacity: 1; pointer-events: none; z-index: 100; mix-blend-mode: screen;
        animation: flash-fade 2.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }
    @keyframes flash-fade { 0% { opacity: 1; transform: scale(0.8); } 100% { opacity: 0; transform: scale(1.5); } }

    .gold-ray {
        position: absolute; width: 3px; height: 200vh;
        background: linear-gradient(to top, transparent, #69f0ae, #ffffff, #b9f6ca, transparent);
        box-shadow: 0 0 15px #b9f6ca, 0 0 5px #ffffff; opacity: 0; transform-origin: center center; will-change: transform, opacity;
    }
    @keyframes ray-burst { 
        0% { transform: scaleY(0.05) rotate(var(--rot)); opacity: 0; } 
        15% { opacity: 1; transform: scaleY(0.6) rotate(var(--rot)); } 
        100% { transform: scaleY(2.5) rotate(var(--rot)); opacity: 0; } 
    }

    .space-particle {
        position: absolute; width: 60px; height: 40px; background: #ffffff; border-radius: 70%;
        box-shadow: 0 0 12px #ffffff, 0 0 25px #69f0ae; opacity: 0; pointer-events: none; will-change: transform, opacity;
    }
    @keyframes particle-explode {
        0% { transform: translate(0, 0) scale(0.5); opacity: 1; }
        100% { transform: translate(var(--tx), var(--ty)) scale(2.5); opacity: 0; }
    }

        /* 菩薩優雅凌空飄浮層 */
        .buddha-breathe { width: 100%; height: auto; animation: floating 7s ease-in-out infinite alternate; position: relative; }
        @keyframes floating {
            0% { transform: translateY(0px); filter: drop-shadow(0 5px 15px rgba(212,175,55,0.15)); }
            100% { transform: translateY(-40px); filter: drop-shadow(0 25px 40px rgba(212,175,55,0.35)); }
        }
            /* 光相呼吸 */
        .halo-pulse { transform-origin: 500px 300px; animation: halo-anim 4s infinite alternate ease-in-out; }
        @keyframes halo-anim { 0% { transform: scale(1); opacity: 0.5; } 100% { transform: scale(1.03); opacity: 0.9; } }


        /* 香煙霧系統 */
        #smoke-container { position: absolute; inset: 0; pointer-events: none; z-index: 15; overflow: hidden; }
        .smoke-fine { position: absolute; width: 6px; height: 50px; background: linear-gradient(to top, rgba(240, 230, 210, 0.25), transparent); border-radius: 3px; filter: blur(4px); opacity: 0; animation: smoke-rise-fine 4.5s cubic-bezier(0.4, 0.1, 0.4, 1) forwards; }
        @keyframes smoke-rise-fine { 0% { transform: translateY(0) scaleX(1); opacity: 0; } 20% { opacity: 0.5; } 100% { transform: translateY(-45vh) scaleX(2.5) translateX(var(--drift)); opacity: 0; } }

        /* 🕯️ 燭火微動態 */
        .candle-flicker { transform-origin: center bottom; animation: flicker-anim 2.5s ease-in-out infinite alternate; }
        @keyframes flicker-anim { 0% { transform: scale(0.93) rotate(-1.2deg); opacity: 0.8; } 100% { transform: scale(1.04) rotate(1.2deg); opacity: 1; } }

        /* 底部控制面板 */
        .ritual-container { position: absolute; bottom: max(30px, env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; width: 100%; z-index: 100; }
        #blessing-text { height: 25px; margin-bottom: 20px; color: var(--gold-light); font-size: 1.1rem; letter-spacing: 8px; text-shadow: 0 0 20px rgba(255,191,0,0.9), 0 0 10px #fff; opacity: 0; pointer-events: none; white-space: nowrap; }
        @keyframes float-blessing { 0% { opacity: 0; transform: translateY(15px); } 20% { opacity: 1; transform: translateY(0); } 80% { opacity: 1; transform: translateY(-5px); } 100% { opacity: 0; transform: translateY(-15px); } }

        .ritual-panel { display: flex; gap: 40px; }
        .ritual-btn { color: var(--gold-light); font-size: 1rem; letter-spacing: 6px; cursor: pointer; transition: all 0.4s; padding: 12px 24px; background: rgba(255,255,255,0.03); border: 1px solid rgba(212,175,55,0.35); border-radius: 25px; backdrop-filter: blur(8px); font-weight: bold; text-shadow: 0 0 8px rgba(243,229,171,0.4); }
        .ritual-btn:hover, .ritual-btn.active { color: #fff; text-shadow: 0 0 15px var(--gold-light); border-color: rgba(212,175,55,0.85); background: rgba(212,175,55,0.15); box-shadow: 0 0 20px rgba(212,175,55,0.25); }
        .chant-hint { margin-top: 18px; font-size: 0.8rem; color: rgba(255,255,255,0.6); letter-spacing: 4px; pointer-events: none; }

        /* 供桌與香爐控制 */
        body.incense-on #censer-group { opacity: 1; transform: translateY(0); }
        #censer-group { opacity: 0; transform: translateY(15px); transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1); }
        .incense-glow { animation: glow-pulse 1.5s infinite alternate ease-in-out; }
        @keyframes glow-pulse { 0% { r: 3px; opacity: 0.7; filter: drop-shadow(0 0 4px #ff4500); } 100% { r: 4.5px; opacity: 1; filter: drop-shadow(0 0 12px #ffaa00); } }

        /* 觀想導引彈窗 */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(12px); z-index: 10000; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
        .modal-overlay.show { display: flex !important; opacity: 1 !important; pointer-events: auto !important; }
        .modal-box { width: 85%; max-width: 350px; max-height: 80vh; overflow-y: auto; background: linear-gradient(135deg, #141822, #07090e); border: 1px solid var(--gold-solid); border-radius: 20px; padding: 35px 25px; text-align: center; box-shadow: 0 0 50px rgba(212,175,55,0.2); transform: scale(0.9); transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .m-title { color: var(--gold-light); font-size: 1.2rem; letter-spacing: 5px; margin-bottom: 15px; font-weight: bold; }
        .m-text { font-size: 0.95rem; line-height: 1.8; margin-bottom: 30px; letter-spacing: 2px; color: #ccc; text-align: left; }
        .m-btn-prime { background: rgba(212,175,55,0.1); border: 1px solid var(--gold-solid); color: var(--gold-light); padding: 12px; border-radius: 20px; font-size: 0.95rem; cursor: pointer; width: 100%; letter-spacing: 3px; }

        /* --- 白毫金色頂禮特殊變形 --- */
        #buddha-urna {
            transition: all 1.2s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: 500px 190px;
            fill: #ffd700 !important;
        }
        .bowing #buddha-urna {
            r: 10px;
            filter: drop-shadow(0 0 15px #ffd700) drop-shadow(0 0 35px #ffbf00);
        }
           /* ── 模態框樣式 ── */
    .custom-modal {
        position: fixed; inset: 0; z-index: 4000;
        background: rgba(0,0,0,0.88);
        backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
        display: none; justify-content: center; align-items: center;
        opacity: 0; transition: opacity .35s;
    }
    .custom-modal.show { 
        display: flex; 
        opacity: 1; 
    }
    .modal-box {
        background: rgba(3,3,6,0.94);
        border: 1px solid rgba(212,175,55,0.38);
        border-radius: 20px; padding: 28px 22px;
        width: 88%; max-width: 340px; text-align: center;
        box-shadow: 0 0 55px rgba(212,175,55,0.13), inset 0 1px 0 rgba(255,255,255,0.06);
        max-height: 88vh; overflow-y: auto;
    }
    .modal-title {
        color: var(--solid, #d4af37); font-size: 15px; letter-spacing: 4px; margin-bottom: 20px;
        text-shadow: 0 0 20px rgba(212,175,55,0.55);
    }
    .gold-btn {
        width: 100%;
        background: linear-gradient(135deg, rgba(212,175,55,0.16), rgba(212,175,55,0.06));
        border: 1px solid rgba(212,175,55,0.62);
        color: var(--gold, #fbeba5); padding: 12px; border-radius: 10px;
        font-size: 13px; letter-spacing: 2px; cursor: pointer; transition: .22s;
        box-shadow: 0 2px 12px rgba(212,175,55,0.1), inset 0 1px 0 rgba(255,255,255,0.08);
        font-family: "PingFang TC", serif;
    }
    .gold-btn:active {
        background: rgba(212,175,55,0.32);
        box-shadow: 0 0 18px rgba(212,175,55,0.45);
        transform: scale(0.97);
    }
        /* =========================================================
   佛珠與中央大母珠 特效 CSS
   ========================================================= */

/* 1. 所有小佛珠基本平滑過渡 */
.mala-bead {
    transform-origin: var(--cx) var(--cy);
    transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), filter 1.2s ease;
}

/* 2. 中央圓滿大佛珠（母珠）常態金色呼吸脈動與發光 */
.master-bead {
    transform-origin: 500px 604px;
    transition: transform 1.2s cubic-bezier(0.25, 1, 0.5, 1), filter 1.2s ease;
    animation: masterBeadPulse 4s infinite ease-in-out;
}

/* 母珠常態金色呼吸動畫 */
@keyframes masterBeadPulse {
    0%, 100% {
        transform: scale(1);
        filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.4));
    }
    50% {
        transform: scale(1.12); /* 放大12% */
        filter: drop-shadow(0 0 12px rgba(255, 215, 0, 0.95)) drop-shadow(0 0 20px rgba(255, 191, 0, 0.6));
    }
}

/* ---------------------------------------------------------
   頂禮狀態特效 (.bowing 觸發時)
   --------------------------------------------------------- */

/* A. 頂禮時整串佛珠微微放亮與溫和放大 */
.bowing .mala-bead {
    transform: scale(1.08);
    filter: drop-shadow(0 0 6px rgba(255, 215, 0, 0.6));
}

/* B. 頂禮時中央母珠極致放大發亮 */
.bowing .master-bead {
    animation: none; /* 暫停常態呼吸，進入頂禮爆發狀態 */
    transform: scale(2.35); /* 放大 35% */
    filter: drop-shadow(0 0 18px #ffd700) drop-shadow(0 0 35px #ffbf00);
} 

      /* ===== 獨立層容器 (unchanged names) ===== */
#maitreya-treasure-standalone {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 20;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.3s ease;
}

body.bowing-active #maitreya-treasure-standalone,
#maitreya-treasure-standalone.active {
    opacity: 1;
}

.wealth-rain-container {
    position: relative;
    width: 100%;
    height: 100%;
}

.wealth-item {
    position: absolute;
    top: -60px;
    opacity: 0;
    will-change: transform, opacity;
}

/* 尺寸與陰影 */
.p-sm { width: 28px; filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.4)); }
.p-md { width: 42px; filter: drop-shadow(0 0 8px rgba(255, 215, 0, 0.7)); }
.p-lg { width: 58px; filter: drop-shadow(0 0 12px #ffd700); }

/* 動畫觸發：散花飄落 */
body.bowing-active #maitreya-treasure-standalone .wealth-item,
#maitreya-treasure-standalone.active .wealth-item {
    animation: petalScatterFall 6.4s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
}

/* 錯開飄落時間與左右擺盪量 */
.d-1 { animation-delay: 0.05s !important; --drift: -35px; --rot: 45deg; }
.d-2 { animation-delay: 0.22s !important; --drift: 45px; --rot: -60deg; }
.d-3 { animation-delay: 0.12s !important; --drift: -20px; --rot: 30deg; }
.d-4 { animation-delay: 0.35s !important; --drift: 30px; --rot: -45deg; }
.d-5 { animation-delay: 0.18s !important; --drift: -50px; --rot: 90deg; }
.d-6 { animation-delay: 0.40s !important; --drift: 20px; --rot: -30deg; }

@keyframes petalScatterFall {
    0% {
        top: -40px;
        transform: translateX(0) scale(0.3) rotate(0deg);
        opacity: 0;
    }
    15% {
        opacity: 1;
    }
    50% {
        transform: translateX(var(--drift, 20px)) scale(0.85) rotate(var(--rot, 30deg));
        opacity: 0.95;
    }
    85% {
        opacity: 0.85;
    }
    100% {
        top: 85%;
        transform: translateX(calc(var(--drift, 20px) * 1.5)) scale(1.1) rotate(calc(var(--rot, 30deg) * 2));
        opacity: 0;
    }
}



    </style>

    <script>
        // 莊嚴語音與法語
        function speakWords(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'zh-TW'; msg.rate = 0.82; msg.pitch = 0.85; 
            window.speechSynthesis.speak(msg);
        }

        function showBlessing(text) {
            const el = document.getElementById('blessing-text');
            if(!el) return;
            el.innerText = text;
            el.style.animation = 'none';
            void el.offsetWidth;
            el.style.animation = 'float-blessing 3.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards';
        }

              // 頂禮核心邏輯
        function toggleAction(action) {
            const btn = document.getElementById(`btn-${action}`);
            if (!btn || btn.classList.contains('active')) return;

            btn.classList.add('active');
            document.body.classList.add('bowing-active');
            document.getElementById('buddha-scene').classList.add('bowing');
            
            // 觸發獨立彌勒寶袋降金特效
            const treasure = document.getElementById('maitreya-treasure-standalone');
            if (treasure) treasure.classList.add('active');

            triggerGoldenBurst();
            speakWords("心生歡喜，禮敬彌勒");
            showBlessing("歡喜彌勒 ‧ 龍華三會");
            
            // 頂禮結束：恢復初始狀態
            setTimeout(() => { 
                document.getElementById('buddha-scene').classList.remove('bowing');
                btn.classList.remove('active'); 
                document.body.classList.remove('bowing-active');
                if (treasure) treasure.classList.remove('active');
            }, 3000);
        }


         // 萬丈淡綠光粒子特效
    function triggerGoldenBurst() {
        const container = document.getElementById('burst-container');
        if(!container) return;
        container.innerHTML = '';
        
        const flash = document.createElement('div');
        flash.className = 'screen-flash';
        container.appendChild(flash);
        
        for(let i=0; i<48; i++) {
            const angle = i * 7.5;
            const ray = document.createElement('div');
            ray.className = 'gold-ray';
            ray.style.setProperty('--rot', `${angle}deg`);
            ray.style.animation = `ray-burst 2.5s cubic-bezier(0.1, 0.9, 0.2, 1) forwards`;
            container.appendChild(ray);
            
            const particle = document.createElement('div');
            particle.className = 'space-particle';
            const distance = 70 + Math.random() * 50; 
            const rad = (angle * Math.PI) / 180;
            const tx = Math.cos(rad) * distance + "vw";
            const ty = Math.sin(rad) * distance + "vh";
            particle.style.setProperty('--tx', tx);
            particle.style.setProperty('--ty', ty);
            particle.style.animation = `particle-explode ${1.4 + Math.random() * 1}s cubic-bezier(0.1, 0.8, 0.3, 1) forwards`;
            container.appendChild(particle);
        }
    }

            function burn() {
                let elapsed = (Date.now() - startTime) / 1000;
                incenseProgress = Math.min(elapsed / 60, 1); // 60秒完全燃盡
                
                // 1. 三支願力香同步向下平穩燃燒 (起點依序下降至香爐口 1270)
                document.getElementById('stick-center').setAttribute('y1', 1125 + (145 * incenseProgress));
                document.getElementById('glow-center').setAttribute('cy', 1125 + (145 * incenseProgress));
                
                document.getElementById('stick-left').setAttribute('y1', 1140 + (130 * incenseProgress));
                document.getElementById('glow-left').setAttribute('cy', 1140 + (130 * incenseProgress));
                
                document.getElementById('stick-right').setAttribute('y1', 1140 + (130 * incenseProgress));
                document.getElementById('glow-right').setAttribute('cy', 1140 + (130 * incenseProgress));
                
                // 2. 兩側實體蠟燭高度與火苗同步向下融化 (新版高度 55)
                let meltAmount = 55 * incenseProgress;
                ['left', 'right'].forEach(side => {
                    const candleBody = document.getElementById(`candle-body-${side}`);
                    const candleWick = document.getElementById(`candle-wick-${side}`);
                    const flameMove = document.getElementById(`flame-move-${side}`);
                    
                    if(candleBody) {
                        candleBody.setAttribute('y', 1220 + meltAmount);
                        candleBody.setAttribute('height', 55 - meltAmount);
                    }
                    if(candleWick) {
                        candleWick.setAttribute('y1', 1215 + meltAmount);
                        candleWick.setAttribute('y2', 1220 + meltAmount);
                    }
                    if(flameMove) {
                        flameMove.style.transform = `translateY(${meltAmount}px)`;
                    }
                });
                
                if (incenseProgress < 1 && document.body.classList.contains('incense-on')) {
                    incenseTimer = requestAnimationFrame(burn);
                } else if (incenseProgress >= 1 && document.body.classList.contains('incense-on')) {
                    resetIncense();
                }
            }
            incenseTimer = requestAnimationFrame(burn);
        } else {
            resetIncense();
        }
    }

    function resetIncense() {
        cancelAnimationFrame(incenseTimer);
        clearTimeout(smokeTimer);
        document.body.classList.remove('incense-on');
        document.getElementById('btn-incense').classList.remove('active');
        setTimeout(restoreIncensePosition, 1200);
    }

    function restoreIncensePosition() {
        if(!document.body.classList.contains('incense-on')) {
            // 完美復原三支香與香頭
            document.getElementById('stick-center').setAttribute('y1', '1125');
            document.getElementById('glow-center').setAttribute('cy', '1125');
            document.getElementById('stick-left').setAttribute('y1', '1140');
            document.getElementById('glow-left').setAttribute('cy', '1140');
            document.getElementById('stick-right').setAttribute('y1', '1140');
            document.getElementById('glow-right').setAttribute('cy', '1140');
            
            // 完美復原兩側蠟燭與火苗
            ['left', 'right'].forEach(side => {
                const candleBody = document.getElementById(`candle-body-${side}`);
                const candleWick = document.getElementById(`candle-wick-${side}`);
                const flameMove = document.getElementById(`flame-move-${side}`);
                
                if(candleBody) {
                    candleBody.setAttribute('y', '1220');
                    candleBody.setAttribute('height', '55');
                }
                if(candleWick) {
                    candleWick.setAttribute('y1', '1215');
                    candleWick.setAttribute('y2', '1220');
                }
                if(flameMove) {
                    flameMove.style.transform = `translateY(0px)`;
                }
            });
        }
    }

    // 萬德莊嚴：三支香頭隨燃燒位置動態釋放裊裊清煙
    function createThreeSmoke() {
        if (!document.body.classList.contains('incense-on') || incenseProgress >= 1) return;
        const container = document.getElementById('smoke-container');
        if (!container) return;
        
        // 分別抓取左、中、右三個香頭的實時位置
        const targets = ['glow-left', 'glow-center', 'glow-right'];
        
        targets.forEach(id => {
            const glow = document.getElementById(id);
            if (!glow) return;
            const rect = glow.getBoundingClientRect(); 
            
            const puff = document.createElement('div');
            puff.className = 'smoke-fine';
            puff.style.setProperty('--drift', `${(Math.random() - 0.5) * 60}px`);
            // 讓煙霧精準從各自的香頭正上方升起
            puff.style.left = `${rect.left + rect.width / 2 - 3}px`; 
            puff.style.top = `${rect.top - 40}px`; 
            
            container.appendChild(puff);
            setTimeout(() => puff.remove(), 4500);
        });
        
        // 每 450 毫秒循環產生下一波清煙
        smokeTimer = setTimeout(createThreeSmoke, 450);
    }

const canvas = document.getElementById('starCanvas'); 
const ctx = canvas.getContext('2d'); 
let width, height, stars = [], warpSpeed = 1.8, starScale = 0.8; 

function resize() { 
    width = window.innerWidth; 
    height = window.innerHeight; 
    canvas.width = width; 
    canvas.height = height; 
} 
window.addEventListener('resize', resize); 
resize(); 


const STAR_COLORS = ['#28FF28', '#28FF28', '#82D900', '#EAC100', '#EAC100', '#DFFFDF', '#82D900']; 
for (let i = 0; i < 260; i++) { 
    stars.push({ 
        x: (Math.random() - 0.5) * 2000, 
        y: (Math.random() - 0.5) * 2000, 
        z: Math.random() * 2000, 
        color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)], 
        s: Math.random() * 2.2 + 0.5 
    }); 
} 

function renderStars() { 
   
    ctx.fillStyle = 'rgba(5, 2, 4, 0.35)'; 
    ctx.fillRect(0, 0, width, height); 
    ctx.globalCompositeOperation = 'screen'; 
    
    stars.forEach(s => { 
        s.z -= warpSpeed; 
        if (s.z <= 0) { 
            s.z = 2000; 
            s.x = (Math.random() - 0.5) * 2000; 
            s.y = (Math.random() - 0.5) * 2000; 
        } 
        let sc = 400 / (400 + s.z); 
        let drawY = (height / 2) + s.y * sc; 
        
     
        if (drawY > height * 0.72) return; 
        
        ctx.beginPath(); 
        ctx.arc((width / 2) + s.x * sc, drawY, s.s * sc * starScale, 0, Math.PI * 2); 
        ctx.fillStyle = s.color; 
        ctx.globalAlpha = Math.min(0.85, sc * 2.2); 
        ctx.fill(); 
        ctx.globalAlpha = 1; 
    }); 
    
    ctx.globalCompositeOperation = 'source-over'; 
    requestAnimationFrame(renderStars); 
} 
renderStars();


const wCvs = document.getElementById('waterCanvas'), wCtx = wCvs.getContext('2d'); 
let ww, wh, wTime = 0; 

function resW() { 
    ww = wCvs.width = window.innerWidth; 
    wh = wCvs.height = window.innerHeight; 
} 
window.addEventListener('resize', resW); 
resW(); 

const SeaThemes = [
    { h: 22, s: 22, l: 22 }, 
    { h: 22,  s: 18, l: 15 }, 
    { h: 100,  s: 223, l: 11 }  
];

function drawW() { 
    wCtx.clearRect(0, 0, ww, wh); 
    wTime += 0.001; // 速度略為提升，展現動能

    for (let i = 0; i < 3; i++) { 
        wCtx.beginPath(); 
        let shift = i * 1; 
        let grad = wCtx.createLinearGradient(0, wh * 0.1, 0, wh); 
        let t = SeaThemes[i]; 
        

// 樣板字串改為：
grad.addColorStop(0,   `hsla(${t.h}, ${t.s}%, ${t.l}%, 0.15)`); 
grad.addColorStop(0.4, `hsla(${t.h}, ${t.s}%, ${t.l}%, 0.45)`); 
grad.addColorStop(1,   `hsla(${t.h}, ${t.s}%, ${t.l}%, 0.85)`); 

        
        wCtx.fillStyle = grad; 
        
        // 海多重正弦波計算
        for (let x = 0; x <= ww; x += 5) { 
            let y = Math.sin(x * 113+ wTime + shift) * 2
                  + Math.sin(x * 0.005- wTime * 1.5) * 100 
                  + (wh * 0.99) 
                  + Math.cos(wTime * 0.3 + i) * 22; 
                  
            if (x === 0) wCtx.moveTo(x, y); 
            else wCtx.lineTo(x, y); 
        } 
        
        wCtx.lineTo(ww, wh); 
        wCtx.lineTo(0, wh); 
        wCtx.fill(); 
    } 
    requestAnimationFrame(drawW); 
} 
drawW();
