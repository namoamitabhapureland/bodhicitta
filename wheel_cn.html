<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">

    <title>华藏调频 ‧ 转法轮枢纽</title>
    <style>
        /* ✨  --cyan 换成明亮玉石色 (#9fdfc8)，彻底解决暗沉问题 ✨ */
        :root { --gold: #f3e5ab; --solid-gold: #d4af37; --gold-dark: #b8860b; --cyan: #9fdfc8; --bg-deep: #020202; }
        body { margin: 0; padding: 0; height: 100vh; background: var(--bg-deep); color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: "PingFang SC", "Microsoft YaHei", serif; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }

        /* ✨ 换页黑幕 ✨ */
        #page-curtain { position: fixed; inset: 0; background: #000; z-index: 999999; pointer-events: none; transition: opacity 0.8s ease-in-out; opacity: 1; }

        /* ✨ 左右对称：高级玻璃金框导航按钮 ✨ */
        .top-nav-btn {
            position: absolute; top: 20px; 
            background: rgba(0, 0, 0, 0.6); /* 透明黑底 */
            border: 1px solid rgba(212,175,55,0.6); /* 统一实线金框 */
            color: var(--gold); /* 统一明亮金字 */
            padding: 8px 16px; border-radius: 25px; font-size: 0.85rem; font-weight: bold; letter-spacing: 1px; 
            display: flex; align-items: center; gap: 6px; z-index: 100; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(212,175,55,0.15); 
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        .top-nav-btn:active { transform: scale(0.95); background: rgba(212,175,55,0.25); border-color: var(--solid-gold); box-shadow: 0 0 20px rgba(212,175,55,0.5); }
        
        #back-btn { left: 20px; }
        #huayan-btn { right: 20px; }
        .mini-earth { width: 16px; height: 16px; filter: drop-shadow(0 0 4px rgba(243,229,171,0.5)); }

        /* ======= 法轮本体 ======= */
        #wheel-container { position: relative; width: 340px; height: 340px; cursor: pointer; filter: drop-shadow(0 0 15px rgba(212,175,55,0.25)); transition: filter 0.3s ease, opacity 1s, transform 1s; }
        #wheel-container:active { filter: drop-shadow(0 0 35px rgba(243,229,171,0.7)); }
        #dharma-wheel { width: 100%; height: 100%; transform-origin: center; transition: transform 2.8s cubic-bezier(0.1, 0.9, 0.2, 1); will-change: transform; }
        .spinning-glow { animation: wheel-glow 2.8s ease-out; }
        @keyframes wheel-glow { 0% { filter: drop-shadow(0 0 70px var(--solid-gold)) brightness(1.2); } 100% { filter: drop-shadow(0 0 15px rgba(212,175,55,0.25)); brightness(1); } }

        /* ======= 文字引导区 ======= */
        #instruction-text { margin-top: 40px; font-size: 1.15rem; color: var(--gold); letter-spacing: 5px; text-align: center; height: 65px; transition: opacity 0.5s; text-shadow: 0 0 10px rgba(212,175,55,0.5); }
        .sub-text { font-size: 0.85rem; color: var(--cyan); letter-spacing: 2px; margin-top: 8px; opacity: 0.8; }

        /* ======= 结果区排版 ======= */
        #result-layout { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 94%; max-width: 420px; display: flex; align-items: stretch; justify-content: center; gap: 12px; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; z-index: 100; }
        #result-layout.show { opacity: 1; pointer-events: auto; }

        /* 金刚能量法棒 */
        #energy-bar-wrap { height: 320px; width: 75px; position: relative; display: flex; justify-content: center; flex-shrink: 0; }
        .floating-score { position: absolute; left: 62px; color: #fff; font-size: 0.85rem; font-weight: bold; letter-spacing: 1px; text-shadow: 0 0 10px var(--solid-gold); transition: top 2s cubic-bezier(0.2, 0.8, 0.2, 1), color 1s; white-space: nowrap; }

        /* 心理学签诗卡片 */
        #hwkins-card { flex: 1; min-width: 0; background: rgba(8,8,8,0.96); border-radius: 16px; padding: 25px 15px; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 1s; max-height: 80vh; overflow-y: auto; scrollbar-width: none; }
        .hwkins-title { font-size: clamp(1rem, 4vw, 1.15rem); letter-spacing: 3px; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; width: 100%; font-weight: bold; }
        .hwkins-desc { color: #ddd; font-size: clamp(0.85rem, 3.5vw, 0.95rem); line-height: 1.6; text-align: justify; margin-bottom: 15px; word-wrap: break-word; }
        .hwkins-action { font-weight: bold; letter-spacing: 1px; font-size: clamp(0.85rem, 3.5vw, 0.9rem); padding: 12px 10px; background: rgba(255,255,255,0.05); border-radius: 8px; width: 100%; text-align: left; word-wrap: break-word; }
        
        #close-btn { margin-top: 15px; padding: 10px 25px; background: transparent; border: 1px solid var(--cyan); color: var(--cyan); border-radius: 25px; cursor: pointer; letter-spacing: 3px; font-size: 0.85rem; transition: 0.3s; flex-shrink: 0; }
        #close-btn:active { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }

        /* 挡客法语 */
        #wheel-blocked-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--gold); font-size: 1.2rem; letter-spacing: 4px; line-height: 2.5; text-align: center; opacity: 0; transition: 1.5s; text-shadow: 0 0 15px var(--solid-gold); pointer-events: none; display: none; }

        /* 碎片动画层 */
        #fragment-theater { position: fixed; inset: 0; background: #000; z-index: 99999; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
        .frag-zen-text { position: absolute; top: 50%; width: 100%; text-align: center; color: var(--gold); font-size: 1.3rem; letter-spacing: 6px; opacity: 0; transition: opacity 3s; text-shadow: 0 0 20px var(--solid-gold); transform: translateY(-50%); }
        .f-bodhi { position: absolute; width: 12px; height: 12px; background: var(--gold); border-radius: 50%; opacity: 0; transform: scale(0.5); }
        .f-ring { position: absolute; width: 40vmin; height: 40vmin; border-radius: 50%; border: 2px solid rgba(243,229,171,0.8); box-shadow: 0 0 75px rgba(212,175,55,0.7), inset 0 0 45px rgba(212,175,55,0.5); opacity: 0; transform: scale(0.5); }
        .f-pillar { position: absolute; width: 6px; height: 50vmin; background: linear-gradient(to top, rgba(255,255,255,0.6) 0%, rgba(212,175,55,1) 40%, rgba(100,50,0,0.9) 100%); box-shadow: 0 0 50px var(--solid-gold); opacity: 0; transform: scale(0.5); }
    </style>
</head>
<body>

    <div id="page-curtain"></div>

    <div id="back-btn" class="top-nav-btn" onclick="navigateTo('index_cn.html?screen=3')">

    <script>
        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
        
        window.onload = () => {
            document.getElementById('page-curtain').style.opacity = '0';
            buildWheelSVG();
            checkDailyStatus();
        };

        function navigateTo(url) {
            document.getElementById('page-curtain').style.opacity = '1';
            setTimeout(() => { window.location.href = url; }, 800);
        }

        let db;
        try { db = JSON.parse(localStorage.getItem('PX_CN_V15.0')); } catch(e) {}
        if (!db || typeof db !== 'object') db = {}; 
        if (db.hwkinsEnergyTotal === undefined) db.hwkinsEnergyTotal = 0;
        if (db.dailyWheelCount === undefined) db.dailyWheelCount = 0;
        if (db.lastWheelDate === undefined) db.lastWheelDate = "";
        
        function save() { localStorage.setItem('PX_CN_V15.0', JSON.stringify(db)); }

        function checkDailyStatus() {
            const today = new Date().toLocaleDateString();
            if (db.lastWheelDate !== today) {
                db.dailyWheelCount = 0; db.lastWheelDate = today; save();
            }
            if (db.dailyWheelCount >= 1) {
                document.getElementById('wheel-container').style.display = 'none';
                document.getElementById('instruction-text').style.display = 'none';
                document.getElementById('wheel-blocked-msg').style.display = 'block';
                setTimeout(()=> { document.getElementById('wheel-blocked-msg').style.opacity = '1'; }, 100);
            }
        }

        let audioCtx;
        function initAudio() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playTick() {
            if(!audioCtx) return;
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(120, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }

        function buildWheelSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const spokesG = document.getElementById('spokes-layer'); spokesG.innerHTML="";
            for(let i=0; i<8; i++) {
                const g = document.createElementNS(svgNS, "g"); g.setAttribute("transform", `rotate(${(360/8)*i})`);
                const beam = document.createElementNS(svgNS, "rect"); beam.setAttribute("x", "-7"); beam.setAttribute("y", "-110"); beam.setAttribute("width", "14"); beam.setAttribute("height", "76"); beam.setAttribute("fill", "url(#gold-grad)"); beam.setAttribute("rx", "3"); 
                const pattern = document.createElementNS(svgNS, "rect"); pattern.setAttribute("x", "-7"); pattern.setAttribute("y", "-110"); pattern.setAttribute("width", "14"); pattern.setAttribute("height", "76"); pattern.setAttribute("fill", "url(#petal-pattern)");
                g.appendChild(beam); g.appendChild(pattern); spokesG.appendChild(g);
            }
            const bumpsG = document.getElementById('outer-bumps'); bumpsG.innerHTML="";
            for(let i=0; i<8; i++) {
                const g = document.createElementNS(svgNS, "g"); g.setAttribute("transform", `rotate(${(360/8)*i}) translate(0, -110)`);
                const orn = document.createElementNS(svgNS, "path"); orn.setAttribute("fill", "url(#gold-grad)");
                if(i % 2 === 0) orn.setAttribute("d", "M -18,0 C -18,-8 -12,-10 -8,-7 C -5,-16 5,-16 8,-7 C 12,-10 18,-8 18,0 Z"); else orn.setAttribute("d", "M -14,0 C -14,-10 -6,-15 0,-16 C 6,-15 14,-10 14,0 Z");
                g.appendChild(orn); bumpsG.appendChild(g);
            }
            const centerG = document.getElementById('center-mandala'); centerG.innerHTML="";
            for(let j=0; j<8; j++) {
                const path = document.createElementNS(svgNS, "path"); path.setAttribute("d", `M0 -26 C 13 -17.8, 13 7.8, 0 26 C -13 7.8, -13 -17.8, 0 -26`);
                path.setAttribute("transform", `rotate(${(360/8)*j})`); path.setAttribute("stroke", "rgba(212,175,55,0.7)"); path.setAttribute("fill", "rgba(243,229,171,0.15)"); centerG.appendChild(path);
            }
        }

                // ✨ 升级版：霍金斯能量 x 法界观照资料库 (共 80条 - 无绝对相版) ✨
        const hwkinsDB = [
            // ==========================================
            // 【第一阶：0 - 200 Hz】 
            // ==========================================
            { 
                min: 0, max: 200, color: "rgba(160, 40, 40, 0.9)", border: "#ff4d4d", 
                contents: [
                    { desc: "法界之镜映照出一丝隐微的波动。今日在某个瞬间，您的潜意识或许会升起不易察觉的急躁或担忧。若逢此境，可能正是绝佳的觉察契机。", action: "【今日处方】当情绪即将涌现时，请试著深呼吸三次，延迟五秒开口。放过别人，或许就有机会放过自己。" },
                    { desc: "系统捕捉到您的心频似乎正承载著些许压力。大脑可能正在为「还未发生」的未来感到恐惧，这或许会无形中消耗您的生命动能。", action: "【今日处方】请试著在觉得焦虑时，把注意力轻轻拉回「脚下的这一步」。看看能否只专注做好眼前正在做的这件小事。" },
                    { desc: "今日您的潜意识中，或许隐藏著一丝对外在事物的攀比或不平。在法界看来，这可能是一团暂时遮蔽清明的虚妄云雾。", action: "【今日处方】请试著在心中找出一件「自己目前拥有、且值得感恩」的微小事物。将心念定锚於此，云雾或许便能自散。" },
                    { desc: "法界之镜微光闪烁，提醒您今日的心场或许较容易与周遭产生摩擦。一点小事可能就会挑动您内在的防御机制。", action: "【今日处方】若今日遇到不顺眼的人事物，请试著在心中默念三声佛号，喝一杯温水，暂时离开现场，或许能避免恶缘结成。" },
                    { desc: "今日的您，或许在精神或身体上感到有些疲惫与无力。过度勉强支撑，有时可能反而会让心频持续下降。", action: "【今日处方】请允许自己今天「暂时什么都不做」。找个空档闭目养神十分钟，试著把这十分钟当作纯粹的放下。" },
                    { desc: "能量仪表显示，您今日似乎对过去的某个遗憾或错误感到懊悔。这份无形的重量，或许正拖著您的频率往下沉。", action: "【今日处方】请试著对镜子里的自己说一句：「我愿意试著原谅你。」过去的心不可得，或许从此刻重新选择即可。" },
                    { desc: "您的频率中似乎夹杂著一丝对他人的掌控欲或过度期待。求而不得，可能便是痛苦滋生的来源。", action: "【今日处方】请在今日练习「不干涉」。看见他人做事的方法与您不同时，试著静静观察而不插手，看看会有什么变化。" },
                    { desc: "系统侦测到一丝隐藏的委屈感。您或许觉得自己付出了很多，却似乎没有得到预期的回报或重视。", action: "【今日处方】达摩祖师云：「实无功德。」请试著将今日的付出视为理所当然的本分，放下对回报的期盼，心或许会更自由。" },       
                    { desc: "系统观察到，您今日的身体或呼吸似乎带著些许紧绷。这可能是潜意识正在抗拒某些未知的改变。", action: "【今日处方】请试著花两分钟，从头到脚扫描一下自己的身体。发现紧绷的地方，轻轻地将呼吸送过去，或许能得到舒缓。" },
                    { desc: "法界之镜显示，您的频率中似乎隐含著一种『匮乏感』。这容易让人觉得时间、金钱或爱永远不够用。", action: "【今日处方】请试著在今日真诚地赞美一位朋友的优点。透过『给予』赞美，或许能打破内在匮乏的错觉。" },
                    { desc: "您今日的心念似乎容易陷入对过去某段记忆的反覆咀嚼。这可能让您的能量卡在过去，无法流入当下。", action: "【今日处方】洗手或洗澡时，请试著观想清净的水流正在洗涤这些陈旧的念头。水流走，执念或许也能跟著流走。" },
                    { desc: "今日的您，或许会对大量的资讯或外界的声音感到心烦意乱。这是系统在提醒您：内存可能快满了。", action: "【今日处方】若条件允许，请试著关闭手机网路一小时。给自己一段纯粹的『资讯断食』，或许能让心频重置。" },
                    { desc: "您的频率中可能正升起一种『受害者』的委屈感，觉得环境或他人对您不公。", action: "【今日处方】请试著把注意力从『他为什么这样对我』，转移到『我现在能为自己做什么』。拿回选择权，或许力量就会回归。" },
                    { desc: "法界微光闪烁，您今日似乎对自己有较高的批判与不满。这份自责，可能正在无形中耗损您的灵光。", action: "【今日处方】请试著像对待一个受伤的孩子般对待自己。对自己说：『即使不完美，我也愿意试著接纳当下的我。』" },
                    { desc: "今日您的防备心似乎较重，可能会把别人的无心之言解读为攻击。", action: "【今日处方】在准备反击或辩解之前，请试著在心里默数三秒。这三秒的空白，或许能让您看清那只是一个没有恶意的投射。" },
                    { desc: "系统侦测到一丝拖延或逃避的能量。面对某些该做的事，您或许感到一阵沉重与无力。", action: "【今日处方】请试著告诉自己：『我只做五分钟就好。』降低启动的门槛，或许只要跨出第一步，沉重感就会消散。" },
                    { desc: "您的频率似乎陷入了某种『非黑即白』的二元对立中。不是对就是错，这可能会让您感到孤立无援。", action: "【今日处方】请试著在今天寻找事物的『灰色地带』。看见对立面背後的苦衷，或许能让紧绷的心场稍微松动。" },
                    { desc: "今日的您或许觉得自己被周遭忽视了。这份失落感，可能源自於向外寻求认同的惯性。", action: "【今日处方】请试著成为自己的点灯人。今天为自己做一件微小但开心的事（例如吃一块喜欢的点心），不需依赖外界的看见。" },
                    { desc: "今日您的心智似乎容易陷入「证明自己是对的」的执念中。这可能会形成一道无形的墙，阻碍善缘的流动。", action: "【今日处方】若今日与人发生意见分歧，请试著在心里想：「他或许也有他的道理。」轻轻放下身段，或许能海阔天空。" },
                    { desc: "今日您的意识边缘，似乎徘徊著些许难以名状的失落。这可能源於对某个无法掌握的人事物的微细执著。", action: "【今日处方】请试著将双手轻放在腹部，感受三次深长的呼吸。或许，承认自己无法掌控一切，正是重获力量的开始。" },
    { desc: "系统微光闪烁，反映出您此刻的心念可能正被未知的担忧所牵引。大脑或许正在为尚未发生的剧本消耗能量。", action: "【今日处方】若察觉到恐惧升起，请试著在心中轻问自己：「这件事现在发生了吗？」将念头拉回当下，或许能截断焦虑的回路。" },
    { desc: "您的能量场似乎带著一丝自我怀疑的沉重感。这可能是过去的某个挫折，正在潜意识里悄悄重播。", action: "【今日处方】请试著在心里对那个受挫的自己说：「你当时已经尽力了。」或许，一点微小的自我理解，就能化解深层的自责。" },
    { desc: "法界之镜显示，您的频率中或许隐藏著对周遭环境的轻微抗拒。这份不满意，可能正在无形中锁住您的生命力。", action: "【今日处方】今日若遇到不顺心的情境，请试著先不急著改变它。只是静静观察这份「不舒服」，看看它会在身体停留多久。" },
    { desc: "您今日的心场似乎较容易与他人的负面情绪产生共振。这可能会让您感到莫名其妙的疲惫或烦躁。", action: "【今日处方】请试著在心中画一道无形的界线。告诉自己：「那是他的课题，不是我的。」或许能让交叠的能量场重新清明。" },
    { desc: "系统侦测到一丝对未来的急迫感。您或许觉得时间不够用，或是进度不如预期，这可能让心跳在不自觉中加快。", action: "【今日处方】请试著刻意放慢脚步，无论是走路还是进食。告诉自己：「一切或许都有其最合适的时间表。」" },
    { desc: "今日您的潜意识中，可能生起了些微的嫉妒或比较心。这或许是人性渴望被看见的某种投射。", action: "【今日处方】请试著在心中默默祝福那个让您产生比较心的人。将对立转为随喜，或许能让紧缩的心轮再次舒展。" },
    { desc: "您的频率似乎陷入了某种难以挣脱的无力感。面对庞杂的事物，可能暂时找不到前进的动力。", action: "【今日处方】请允许自己今天只做「最微小且必要」的一件事。或许完成一个极小的动作，就能重新启动能量的流动。" },
    { desc: "法界能量流显示，您或许对某段失去的关系或机会感到隐隐作痛。不愿放手，可能让心灵的空间变得拥挤。", action: "【今日处方】请试著想像双手正紧握著一把沙子，然後慢慢松开手指。或许，放开手，才能腾出空间迎接新的因缘。" },
    { desc: "今日的您，似乎较容易对他人的言辞产生防卫反应。这可能源於内在某个尚未被抚平的脆弱角落。", action: "【今日处方】当想要反驳的冲动升起时，请试著先吞下一口口水。留给自己两秒钟的空白，或许就能看见防卫背後的虚弱。" },
    { desc: "系统观察到，您的心念可能正在对「不完美」进行严厉的批判。这份苛求，或许正在耗损您的清净心。", action: "【今日处方】请试著在今天寻找事物中的「残缺之美」。或许，正是这些微小的不完美，构成了娑婆世界的真实。" },
    { desc: "您的频率中似乎带著一股压抑的愤怒。这可能是多次妥协後，内在真实声音未被聆听的抗议。", action: "【今日处方】请试著找一个无人的空间，轻轻叹几口气，或将这份情绪写在纸上然後撕碎。让能量有出口，或许就不会反噬自身。" },
    { desc: "法界之镜映照出，您今日或许对某个责任感到异常沉重。这份压迫感，可能让您暂时忘记了呼吸的轻盈。", action: "【今日处方】请试著将肩膀向上耸起，紧绷三秒後彻底放下。透过身体的放松，或许能提醒心智：重担也可以暂时卸下。" },
    { desc: "您的心场似乎被某种「不被理解」的孤独感所笼罩。向外寻求共鸣未果，可能会加深这份失落。", action: "【今日处方】请试著成为自己最忠实的聆听者。在心里对自己说：「我懂你的辛苦。」或许，自我的看见胜过外界的千言万语。" },
    { desc: "今日您的能量似乎呈现出一种停滞的浑沌状态。可能不是痛苦，但也没有喜悦，彷佛被困在迷雾中。", action: "【今日处方】请试著去洗一把冷水脸，或是喝一杯微温的白开水。用最纯粹的物理感官刺激，或许能唤醒沉睡的觉知。" },
    { desc: "系统侦测到一丝微弱的报复心或不甘心。这可能是觉得受到了不公平对待後，自我保护机制的反弹。", action: "【今日处方】请试著回想一句熟悉的法语或箴言。将注意力转移到更高维度的智慧上，或许能化解这份低频的纠缠。" },
    { desc: "您今日的频率似乎容易被过去的遗憾所牵引。如果当时...，这样的念头可能正在消磨当下的力量。", action: "【今日处方】请试著对著空气轻声说：「过去的都已经过去了。」切断对幻象的眷恋，或许就能把能量收回到此刻。" },
    { desc: "法界微光显示，您可能正陷入某种自我设限的框架中。觉得「我做不到」或「我不值得」，这或许只是一场错觉。", action: "【今日处方】请试著在今天做一件平常不会做的小事，例如换一条路线回家。打破微小的惯性，或许能松动内在的死结。" },
    { desc: "您的心念似乎对某个即将到来的结果患得患失。过度关注结果，可能会让过程变得充满煎熬。", action: "【今日处方】请试著告诉自己：「尽人事，听天命。」将专注力放在眼前的每一个步骤，结果或许自然会水到渠成。" },
    { desc: "今日的您，似乎对周遭的声音感到特别敏感且容易烦躁。这可能是内在空间已经被杂念挤满的警讯。", action: "【今日处方】请试著戴上耳机听一段没有人声的纯音乐，或是享受十分钟的绝对安静。给心灵一点留白，或许能恢复弹性。" },
    { desc: "系统观察到，您的频率中隐含著一种讨好他人的倾向。过度在乎别人的眼光，可能会让自己失去重心。", action: "【今日处方】今日做决定时，请试著先问自己：「这是我真心想要的吗？」把自己的感受放在第一位，或许并不等於自私。" },
    { desc: "您的能量场似乎带有一丝冷漠与疏离。这可能是为了避免受伤，而暂时关闭了与外界连结的通道。", action: "【今日处方】请试著去触摸一件有温度的物品，例如热茶杯或毛毯。透过微小的温暖，或许能慢慢融化内心的防护罩。" },
    { desc: "法界之镜反映出，您可能正在为别人的错误惩罚自己。这份代人受过的沉重，或许并不属於您。", action: "【今日处方】请试著在心里默默将那个责任还给对方：「这是你的功课，我交还给你。」或许卸下不属於您的重担，心会轻盈许多。" },
    { desc: "今日您的潜意识似乎生起了一种「被剥夺感」。觉得自己应得的没有得到，这可能会引发隐微的愤懑。", action: "【今日处方】请试著环顾四周，找出一件自己不用努力就能拥有的事物（如空气、阳光）。感恩这些不费吹灰之力的存在，或许能转化匮乏。" },
    { desc: "您的心念可能陷入了某个固执的盲点，反覆打转却找不到出口。这或许是因为视角过於单一。", action: "【今日处方】请试著从第三者的角度来看待您目前的困境。想像一位智者会如何看待这件事？或许距离能带来新的洞见。" },
    { desc: "系统侦测到一丝隐藏的悲伤。这份悲伤可能没有明确的理由，只是灵魂在某个瞬间感到了娑婆的无常。", action: "【今日处方】请允许这份悲伤存在，不需要急著赶走它。试著静静陪伴自己，或许这份情绪流动过後，会留下更深的平静。" },
    { desc: "您今日的频率似乎容易对未知的变化感到抗拒。渴望维持现状的安全感，可能会阻碍生命自然的流动。", action: "【今日处方】请试著对自己说：「我愿意向未知的可能性敞开。」或许，放下对确定性的执著，才能看见法界的安排。" },
    { desc: "法界能量流显示，您或许正处於一种过度分析的状态中。试图用头脑解决所有问题，可能会让心智过热。", action: "【今日处方】请试著放下思考，转移注意力去进行一项重复性的劳动（如洗碗、扫地）。让身体动起来，或许能让头脑休息。" },
    { desc: "您的心场似乎被某种无形的羞愧感所束缚。觉得自己某些地方不够好，这可能是一道阻碍光进入的墙。", action: "【今日处方】请试著接受自己「此时此刻就是这个样子」。不再试图掩饰，或许全然的接纳，才是真正的疗愈之始。" },
    { desc: "今日您的能量似乎极度向外发散，难以收摄。这可能会让您在一天的结束时感到异常虚耗。", action: "【今日处方】请试著闭上眼睛，想像自己是一棵树，将根深深地扎入地底。透过观想收摄心神，或许能找回内在的定海神针。" },
        { desc: "您的能量场显得有些涣散或冷漠。这通常可能是对生活暂时失去热情，或是过度消耗後产生的自我保护机制。", action: "【今日处方】请试著去接触一点大自然。摸摸树叶、看看天空，或是为自己泡一杯热茶。用微小的感官体验，或许能唤醒觉知。" },
            { desc: "系统微光闪烁，您此刻可能被些许烦躁或沉滞感包围。这时不需要强求大彻大悟，只需要一个微小的物理转变。", action: "【今日处方】请试著走到镜子前，对著自己露出一个为期三秒的微笑。即便带点勉强，牵动脸部肌肉的微小动作，或许就能松动僵硬的心场。" },
    { desc: "您的频率中似乎带著一丝对物质或金钱的隐微焦虑。匮乏感往往源自於不敢给予。", action: "【今日处方】今日若有消费，请试著将一张电子发票捐赠给慈善机构。透过毫不费力的微小布施，向潜意识宣告：您是丰盛且有余裕的。" },
    { desc: "法界能量流显示，您的身体可能正承载著潜意识的紧绷，导致呼吸变得短促。", action: "【今日处方】请试著放下手边的事物，慢慢喝下一杯温热的白开水。感受温水流经食道、进入胃部的过程，用最纯粹的物理温暖来安抚内在。" },
    { desc: "今日的您，或许对周遭的环境感到有些杂乱与不耐。外在的熵增，往往会连带影响内在的频率。", action: "【今日处方】请试著随手捡起地上的一片纸屑，或将桌面上一件不在原位的物品归位。一个微小的秩序重建，能带来不可思议的平静。" },
    { desc: "您的心念似乎陷入了某种重复的负面回圈中。大脑正在消耗不必要的能量去预演那些不会发生的事。", action: "【今日处方】请试著深呼吸，然後用力握紧双拳三秒钟，接著彻底松开。将无形的焦虑转化为有形的肌肉张力再释放掉。" },
    { desc: "系统侦测到一丝拖延带来的微小罪恶感。面对待办事项，沉重的感觉让您难以启齿或启动。", action: "【今日处方】请试著只做「一分钟」的整理。例如只洗一个碗，或只回覆一句讯息。打破静摩擦力，能量就会开始流动。" },
    { desc: "您今日的频率似乎较容易放大他人的缺点。这是一面反映自身疲惫的镜子。", action: "【今日处方】请试著在今天刻意寻找并说出一句「好话」。哪怕只是称赞店员「谢谢，您很有效率」，这句话会先温暖您自己的听觉。" },
    { desc: "法界之镜反映出，您的肩膀或颈部可能正处於无意识的防御状态。这是在抵御某种无形的压力。", action: "【今日处方】请试著轻轻拍打自己的双肩三下，告诉自己：「辛苦了，现在暂时安全了。」解除身体的武装，心才能透气。" },
    { desc: "今日您的意识似乎有些涣散，容易在无意义的数位资讯中迷失，导致能量流失。", action: "【今日处方】请试著关闭萤幕，走到窗边或室外，抬头看著天空三十秒。将视线从近处的虚拟拉向远方的真实，让脑波重置。" },
    { desc: "您的能量场似乎带著一点对过去的懊恼。这个结，其实只需要一个非常轻微的转念就能解开。", action: "【今日处方】请试著拿出一张废纸，把那个懊恼的念头写下来，然後平静地将它揉成一团丢进垃圾桶。具象化您的放下。" },
    { desc: "系统观察到，您对自身似乎缺乏了一点柔软。过度的自我要求，让频率变得刚硬易折。", action: "【今日处方】请在洗手时，试著放慢动作，感受水流滑过肌肤的触感。将这个日常动作视为一种微小的净化仪式。" },
    { desc: "您今日的心场可能正被某个未解的琐事轻微干扰著，像背景杂音一样消耗著系统资源。", action: "【今日处方】请试著写下一张极简的清单，只列出今天「绝对必须完成」的一件事。将注意力收束於一点，杂音便会自然减弱。" },
    { desc: "法界微光闪烁，您似乎对某个擦肩而过的人或事产生了微小的反感。", action: "【今日处方】请试著在心中将对方想像成一个也会疲惫、也有烦恼的普通人。看见彼此同在娑婆的无奈，反感或许就能化为平淡。" },
    { desc: "您的频率中隐含著一种被困住的感觉。可能是实体空间的局限，也可能是思维的死角。", action: "【今日处方】请试著去打开一扇窗户，或是稍微调整一下座位的角度。引入一点新鲜的空气或新的视角，打破物理上的僵局。" },
    { desc: "今日的您，或许觉得自己处於一种孤立无援的状态，与周遭的连结感变得薄弱。", action: "【今日处方】请试著去触摸一盆植物的叶片，或是轻抚一件木制家具的纹理。与自然材质进行微小的接触，能重新建立与大地的连结。" },
    { desc: "系统侦测到一丝潜在的急躁。脚步变快、呼吸变浅，可能正赶著去完成某个目标。", action: "【今日处方】请试著在接下来的十步里，刻意放慢步伐，感受脚底板接触地面的重量。把注意力从「目的地」收回到「正在走」的这双脚上。" },
    { desc: "您的能量似乎有些停滞，像是未经流通的死水。这需要一点点外力的扰动来恢复生机。", action: "【今日处方】请试著伸个大懒腰，并发出轻微的叹息声。不要压抑身体想要舒展的本能，让浊气随著叹息排出。" },
    { desc: "法界之镜显示，您今日的心念可能较容易停留在「我不够好」的低频震动中。", action: "【今日处方】请试著回想一件您今天已经顺利完成的小事，哪怕只是「准时起床」或「好好吃了一顿饭」。认可自己最基本的生存努力。" },
    { desc: "您今日的频率似乎对声音特别敏感，容易将环境音转化为内在的烦躁。", action: "【今日处方】请试著闭上眼睛，将注意力集中在寻找环境中最远、最微弱的一个声音。从抗拒噪音转为主动聆听，频率就会改变。" },
    { desc: "系统观察到，您的心场正处於一种防御性的收缩状态，可能在拒绝某种微小的不确定性。", action: "【今日处方】请试著用非惯用手（例如右撇子改用左手）去开门或拿杯子。透过这个笨拙的微小改变，打破潜意识的绝对控制欲。" },
        { desc: "系统侦测到一丝隐微的疲顿。当意识过度聚焦於眼前的烦恼时，能量容易陷入停滞。", action: "【今日处方】请试著给自己五分钟的「绝对放空」。找一张舒适的椅子坐下，什么都不想，什么都不做，允许自己暂时无所事事。" },
    { desc: "您的频率中似乎累积了些许无以名状的沉重。这可能是日常琐碎带来的无形熵增。", action: "【今日处方】请试著去为自己泡一杯温热的茶或咖啡。在等待水滚、看著热气上升的过程中，将心念安放於这份简单的宁静里。" },

    { desc: "您今日的能量场似乎对环境的杂乱较为敏感。外在的无序，容易引发内在的微小焦虑。", action: "【今日处方】请试著整理家中一个极小的区块，例如一个抽屉或一张桌面。透过外在物理空间的秩序重建，找回内心的安定。" },

    { desc: "您的身体似乎在无意识中维持著某种防御姿态，导致呼吸变得短促且局限。", action: "【今日处方】请试著站起身，用力伸一个深长的大懒腰，并深深吐出一口气。让身体的舒展，带动阻塞能量的重新流动。" },
    { desc: "今日的您，或许觉得生活缺乏新鲜的活水，一切显得有些单调与乏味。", action: "【今日处方】请试著换上一套您觉得最柔软、最舒适的居家服。透过改变布料与肌肤的触感，给予身体一个微小而确定的安慰。" },
    { desc: "系统观察到，您的心念似乎容易停留在对未来的担忧上，大脑正消耗能量预演著未发生的困难。", action: "【今日处方】请试著将注意力转移到「咀嚼」上。今日的一餐，试著每一口都咀嚼二十次以上。将意识完全收束於当下的味觉。" },

    { desc: "法界微光闪烁，您似乎对自己某个微小的失误感到不满意。", action: "【今日处方】请试著走到镜子前，看著自己的眼睛，在心里默默说一句：「没关系，这样已经足够了。」给予自己最基本的宽容。" },

    { desc: "系统侦测到一丝隐藏的匮乏感，觉得某些东西（时间、精神或物质）似乎不够用。", action: "【今日处方】请试著环顾四周，找出三件您「目前拥有且实用」的物品（如一张好坐的椅子、一个好用的杯子），在心中确认这份拥有的踏实感。" },
    { desc: "您的心场可能正被某首负面的心智背景音乐干扰，反覆播送著不愉快的记忆。", action: "【今日处方】请试著播放一首您觉得最平静、没有歌词的轻音乐或大自然白噪音。用高频的声波去覆盖低频的杂音。" },
    { desc: "今日的您，或许对周遭的人事有一点过度解读的倾向，容易将中性的事件视为针对。", action: "【今日处方】请试著在心中默念：「这一切或许都与我无关。」退一步，将自己从事件的中心抽离，单纯作为一个旁观者。" },
    { desc: "您的频率中似乎带著一股僵硬的固执，不愿轻易改变原有的计画或想法。", action: "【今日处方】请试著在今天刻意打破一个无伤大雅的小习惯。例如换一个杯子喝水，或是换一张椅子坐。用微小的改变松动僵化。" },
    { desc: "法界能量流显示，您可能正处於一种「等待事情过去」的煎熬感中。", action: "【今日处方】请试著将双手搓热，然後轻轻敷在双眼或後颈上。透过掌心的温度，安抚焦躁的神经，告诉自己一切都会过去。" },
    { desc: "您的心念似乎对某个无法掌控的现状感到无力，这份抗拒正在消耗您的灵光。", action: "【今日处方】请试著把注意力转向您可以掌控的微小事物。例如去把床单铺平，或是把鞋子摆正。在微小处找回主导权。" },
    { desc: "今日的您，可能觉得自己与这个世界有些脱节，产生了一种难以言喻的孤立感。", action: "【今日处方】请试著走到窗边，观察外面的一棵树或一片云。意识到您与这棵树、这片云共享著同一片天空与空气。" },
    { desc: "系统观察到，您的身体可能因为久坐或姿势不良，积累了局部的不适与低频。", action: "【今日处方】请试著进行三分钟的简单拉筋，或是轻轻转动脖子和手腕。将卡在关节处的浊气释放出来。" },
    { desc: "您的频率中似乎隐含著一种想要逃离现状的冲动。", action: "【今日处方】请试著不要对抗这份冲动。允许自己今天暂时做一个「不那么努力」的人。接纳自己的低潮，往往是反弹的开始。" }

                    { desc: "法界能量流显示，您今日或许拥有化解旧有误会的契机。理智与勇气的结合，能融化坚冰。", action: "【今日处方】如果您心里有一直想说开的结，今日或许是个传送温和讯息的好时机。不求结果，只求心安。" },
                    { desc: "今日您的心场似乎充满了『发现微小美好』的能力。这种感知力，能让平淡的日常闪闪发光。", action: "【今日处方】请试著在回家的路上，寻找三件美好的小事（一朵花、一个微笑、一阵微风），并在心里默默感恩。" },

                    { desc: "系统显示，您今日对於『不完美』似乎有了更深的包容。这份宽心，能大幅减少内耗。", action: "【今日处方】今天若事情没有按计画进行，或是自己犯了小错，请试著轻轻一笑带过。或许残缺中也藏著圆满的安排。" },
                    { desc: "您今日的行动力似乎正在苏醒。不再只是空想，而是愿意踏出实践的步伐。", action: "【今日处方】请试著把一个繁杂的目标拆解成最简单的第一步，并在今天内完成它。行动，或许就是最好的定心丸。" },
                    { desc: "您今日的频率似乎酝酿著「愿意思考与解决问题」的弹性。过往觉得困难的事，今天看来或许会有不同的转机。", action: "【今日处方】请试著把握这份动能，将一个搁置已久的小问题，在今日动手处理看看，或许会比想像中顺利。" },
                    { desc: "法界映照出您今日的心念中，可能正带著一股温暖的宽容。这或许正是菩萨「无缘大慈」的微小火苗。", action: "【今日处方】今日若有人对您犯了无心的小过错，请试著用一个微笑化解。您的宽容有机会成为彼此善缘的开端。" },

                    { desc: "今日您的心场似乎十分稳健，具备了承担的力量。这股频率或许能让周遭的人无形中感到安心。", action: "【今日处方】若今日遇到突发的工作或繁琐的家务，请试著不带抱怨地去面对它。这或许正是练习忍辱与精进的好道场。" },
                    { desc: "系统显示，您对眼前的某些纷扰，似乎展现出了一种不随之起舞的淡定。这可能是不被境转的良好契机。", action: "【今日处方】请试著保持这份旁观者的清明。别人急，您不急；别人气，您缓缓。以静制动，或许会有意想不到的结果。" },
                    { desc: "您今日的思维逻辑似乎特别清晰。这或许有助於您看穿事物表象的纠葛，触及问题的核心。", action: "【今日处方】请试著将这份理智用於内观。当有情绪时，先不急著发作，而是理智地观察它从何而来、往何处去。" },
                    { desc: "您的心念中似乎生起了对他人处境的理解与同理。您可能开始意识到，每个人或许都有自己难言的苦衷。", action: "【今日处方】若今日遇到脾气暴躁的人，请试著在心里想：「他现在可能很痛苦，才会如此。」以此或许能长养慈悲心。" },

                    { desc: "法界能量流显示，您今日或许非常适合进行「清理」与「舍弃」。无论是实体的物品，还是心里的某些执念。", action: "【今日处方】请试著在今日整理一件早就用不到的杂物，或者删除无用的资讯。外在的清空，有机会带动内在的轻盈。" },

    { desc: "您的心场似乎正处於一种「不卑不亢」的平衡之中。既不需要贬低自己，也不需要讨好他人。", action: "【今日处方】请试著带著这份自信与人交流。平等的对话，或许能让您看见人与人之间最纯粹的连结。" },

    { desc: "您今日的频率似乎非常适合进行自我对话。内在的声音可能比平时更加清晰，且带著温和的理智。", action: "【今日处方】请试著花一点时间写下最近的心情或灵感。这些文字或许会成为您未来迷惘时的重要指引。" },

    { desc: "法界能量流显示，您今日或许能从平淡无奇的日常中，提炼出一丝会心的趣味。这是心量扩展的徵兆。", action: "【今日处方】请试著在走路或通勤时，观察路人的表情或云朵的形状。在平凡中发现不平凡，或许能持续提升您的频率。" },
    { desc: "您的频率中似乎带著一股愿意承担责任的厚重。这不是被迫的压力，而是一种成熟的选择。", action: "【今日处方】请试著用这份稳重去安抚身边焦躁的人。您的存在本身，或许就能成为周遭环境的稳定器。" },
    { desc: "今日您的心场似乎较为通透，能看见他人的长处而不觉得受威胁。这种欣赏他人的能力，是极佳的正向循环。", action: "【今日处方】请试著具体地赞美一位同事或家人的某个优点。透过语言将这份欣赏表达出来，或许能强化彼此的善缘。" },
    { desc: "系统观察到，您对於「未知」的态度似乎从恐惧转向了好奇。这种心态的转变，可能为您打开新的维度。", action: "【今日处方】若今日遇到不熟悉的领域或知识，请试著保持探索的心态去了解一点皮毛。或许，这就是未来某个契机的种子。" },
    { desc: "您今日的能量似乎非常适合进行沟通与协调。您的语气中可能自然带有安抚与说服的力量。", action: "【今日处方】若有需要协商的事情，今日或许是个好时机。带著诚意与弹性去表达，或许能顺利达成共识。" },
    { desc: "法界之镜反映出，您对自己似乎有了更深一层的包容。允许自己偶尔犯错，这份柔软能大幅降低内耗。", action: "【今日处方】若今天不小心搞砸了一点小事，请试著对自己幽默一笑。或许不把错误看得太严重，反而能更快修正。" },
    { desc: "您的频率中似乎隐含著一种「愿意原谅」的空间。这不仅是原谅他人，可能也包含了原谅过去的自己。", action: "【今日处方】请试著在心中轻轻解开一个纠结已久的结。告诉自己：「为了我的平静，我选择放下。」或许，原谅是给自己的礼物。" },
    { desc: "今日您的心念似乎较能安住於当下的步骤，而不急著眺望终点。这种步步为营的踏实，是非常好的定力。", action: "【今日处方】请试著将注意力完全集中在眼前正在做的工作上。享受过程本身，或许效率会比焦虑结果来得更好。" },
    { desc: "系统侦测到，您似乎对世俗的得失产生了一点微小的疏离感。这份不过度入戏的心态，能让您进退有度。", action: "【今日处方】今日若获得了什么好处，或失去了什么利益，请试著保持平常心。或许将一切视为法界的流动，能让心更自由。" },
    { desc: "您的心场中似乎生起了一种温和的秩序感。杂乱的事物在您的梳理下，可能逐渐展现出清晰的脉络。", action: "【今日处方】请试著动手整理一下您的办公桌或数位桌面。外在空间的井然有序，或许能进一步反馈给您的内在频率。" },
    { desc: "法界能量流显示，您今日或许拥有极佳的同理基础。您不只听见别人说的话，似乎也能听懂他们没说出口的弦外之音。", action: "【今日处方】若有人向您倾诉，请试著多给予眼神的肯定，少给予指导。有时候，全然的倾听或许就是最好的疗愈。" },
    { desc: "您今日的频率似乎非常适宜发起善愿。一个微小的起心动念，可能都会在法界中产生正向的涟漪。", action: "【今日处方】请试著在出门前，默默在心里发愿：「愿我今日的言行，不带给他人烦恼。」这份善护念，或许能护持您一整天。" },
    { desc: "今日的您，似乎对「等待」有了更多的耐心。不再焦躁於时间的流逝，而是能安然处於过程之中。", action: "【今日处方】若遇到塞车或排队，请试著不滑手机，只是静静地感受周遭。把等待视为一种休息，或许频率就能维持在平稳的区间。" },
    { desc: "系统观察到，您的心念中似乎少了一分计较，多了一分随顺。对於吃亏与否，可能不再看得那么重。", action: "【今日处方】今日若遇到需要些微退让的场合，请试著欣然接受。或许吃一点无伤大雅的小亏，能换来心灵的宽阔。" },
    { desc: "您的频率似乎正在与某种「感恩的基础」共振。您可能开始意识到，平凡安稳的日子本身就是一种福报。", action: "【今日处方】请试著在睡前回顾今天的三餐，感恩那些默默成就您温饱的无名因缘。这份心念，或许能长养您的福德。" },
    { desc: "法界之镜映照出，您今日或许有能力将负面语言转化为中性资讯。别人的抱怨，似乎不易在您心里留下痕迹。", action: "【今日处方】请试著保持这份资讯过滤的清明。像一块不吸水的海绵，让别人的情绪流过，而不内化为自己的压力。" },
    { desc: "您今日的能量似乎带著一股清新的学习力。对於不同领域的知识，可能都抱持著虚心求教的态度。", action: "【今日处方】请试著向身边不同年龄层的人请教一个小问题。或许放下身段的交流，能为您带来意想不到的启发。" },
    { desc: "今日您的心场似乎较为独立，不需要过度依赖外界的认同来支撑自我价值。", action: "【今日处方】请试著独自完成一件事，或独自享受一顿饭。在独处中品味那份自给自足的安然，或许能让频率更加坚实。" },
    { desc: "系统侦测到，您对生命中的「顺其自然」似乎有了更深的体会。不再强求每件事都要照著剧本走。", action: "【今日处方】请试著在今天对一个意外的变更说「好」。顺流而下，或许您会发现法界的安排往往比小我的计划更巧妙。" },
    { desc: "您的频率中似乎蕴含著一种愿意与他人分享的慷慨。无论是物质还是经验，您可能都乐於给予。", action: "【今日处方】请试著分享一篇有益的文章，或是一句温暖的话语给需要的人。善意的流通，或许能让您的能量场更加丰沛。" },
        { desc: "法界之镜映照出您今日的频率十分平稳且带有动力。这是积累微小善法资粮的极佳时机。", action: "【今日处方】请试著在进出公共场所时，为身後的人多留三秒钟的门。这微不足道的体贴，便是在日常中展现的菩萨行。" },
    { desc: "您的心念中似乎蕴含著愿意给予的弹性。这份慷慨不一定需要物质，言语的布施同样具有强大能量。", action: "【今日处方】请试著在今天对共事者或家人说一句具体的肯定语，例如「你今天处理得真好」。说好话，就是最直接的调频法器。" },
    { desc: "今日您的能量场呈现出敞开的状态，对於未知的善意有著良好的接收与发送能力。", action: "【今日处方】若有机会，请试著对为您服务的陌生人（如清洁员、公车司机）点头致意并说声谢谢。善意流通，频率自然提升。" },
    { desc: "系统侦测到，您对周遭的环境有著温和的观察力。这份观察力可以轻易转化为行动的道场。", action: "【今日处方】请试著在离开一个空间（如会议室、洗手间）时，顺手将桌面擦拭一下或将椅子靠拢。让环境因为您的存在而变得更好。" },
    { desc: "您的频率中带著一股清晰的理智与包容。面对不同的意见，您似乎有了更多回旋的空间。", action: "【今日处方】今日若参与讨论，请试著先完全听完对方的话，停顿两秒後再作回应。这两秒的留白，是修养，也是智慧。" },
    { desc: "法界微光显示，您今日具备了主动化解微小阻碍的动能。不再等待别人解决，而是愿意自己挽起袖子。", action: "【今日处方】请试著去处理一件大家都嫌麻烦但很容易的小事，例如替办公室的植物浇水，或补充影印纸。默默承担，不求人知。" },
    { desc: "您今日的心场似乎充满了对资源的珍惜。这份惜福的心念，能与宇宙的丰盛法则产生共鸣。", action: "【今日处方】请试著在今天实践一次微小的节能。随手关掉一盏不必要的灯，或节约用水。珍惜法界资源，即是长养自身福德。" },
    { desc: "系统观察到，您的频率正处於一种「愿意成就他人」的良善状态中。", action: "【今日处方】请试著在网路上看见一篇有益的文章或影片时，不吝啬地按个赞或留下正向评论。随喜赞叹，能迅速扩张心量。" },
    { desc: "今日的您，似乎对秩序感有一种温和的需求。将外在的杂乱理清，有助於内在逻辑的稳固。", action: "【今日处方】请试著将钱包里的发票、收据整理平整。如果您有云端载具，也可顺手设定一张发票捐赠给弱势团体。理财即是理心。" },
    { desc: "您的能量场中带著一种不求回报的轻盈感。这非常适合进行无相的微小布施。", action: "【今日处方】走在路上若看见挡路的碎石或树枝，请试著顺手将其移至路边，以免後人绊倒。行无言之善，心自坦荡。" },
    { desc: "法界之镜反映出，您对时间的流逝似乎不再那么焦躁，多了一分从容与等待的耐心。", action: "【今日处方】今日若在排队结帐或等车时，请试著主动让比您更急迫的人先走。用您的时间余裕，去布施给焦虑的人。" },
    { desc: "您今日的心念似乎较能看见事物的光明面。这份正向的诠释能力，是转化境界的关键。", action: "【今日处方】请试著将一句平时习惯用的负面词汇替换掉。例如把「这太麻烦了」改成「这需要一点耐心」。言辞改变，心境即转。" },
    { desc: "系统侦测到，您具备了良好的界线感与同理心。既能保护自己，也能体恤他人。", action: "【今日处方】若今日有人向您推销或提出请求，请试著用最温和但坚定的语气婉拒。不需要带有不耐烦，只是平静地陈述立场。" },
    { desc: "您的频率中似乎生起了一种「和合」的力量。您可能会成为周遭气氛的调和剂。", action: "【今日处方】若身边有两人发生微小的争执，请试著用幽默或中立的话语轻轻带过，转移焦点。化解干戈，即是创造净土。" },
    { desc: "今日您的意识似乎对实体世界的连结有了更深的体会，愿意用双手去创造或修复。", action: "【今日处方】请试著亲手为自己或家人准备一份简单的食物，或者清洗一件物品。在动作中灌注专注与善意，物品也会回馈高频。" },
    { desc: "法界能量流显示，您今日的学习力与开放性极佳。这份谦卑能让您像海绵一样吸收法益。", action: "【今日处方】请试著向身边的人请教一件您不懂的小事，并真诚地道谢。放下身段去学习，能让自我的边界变得更加柔和。" },
    { desc: "您的心场中似乎有一股稳定的专注力，不再轻易被外界的杂音牵著鼻子走。", action: "【今日处方】请试著在今天选择一段时间，完全不查看手机通知，专注於眼前的工作或对话。把注意力当作最珍贵的礼物送给当下。" },
    { desc: "系统观察到，您对生命的规律有一种理性的顺从。遇到小挫折，能迅速调整心态。", action: "【今日处方】若今日不小心打破了东西或弄脏了衣服，请试著在三秒内接受这件事。不抱怨，只是平静地清理善後。" },
    { desc: "您今日的频率非常适合去建立长远的善因缘。不急功近利，只问耕耘。", action: "【今日处方】请试著传一则简单的讯息，关心一位许久未联络的长辈或朋友。不为任何目的，只是单纯的问候与善意。" },
    { desc: "法界之镜映照出，您对自身拥有的事物产生了一种踏实的珍惜感。", action: "【今日处方】请试著在今天使用任何物品（如电脑、笔、餐具）时，动作稍微放轻一点。温柔对待万物，万物亦将温柔待您。" },
        { desc: "法界之镜映照出您今日的心念十分平稳。这份从容，非常适合用来品味生活中的微小艺术。", action: "【今日处方】请试著挑选一部您一直想看但未看的电影，或是静下心来阅读几页好书。让优质的作品滋养您的意识频率。" },
    { desc: "您的能量场中蕴含著一股愿意付出与照顾的温柔。这份善意若能流动，将会产生极佳的共振。", action: "【今日处方】请试著为同住的家人，或是刚好见面的亲友，主动倒一杯温水或准备一份小点心。不需言语，用微小的行动传递关怀。" },
    { desc: "今日您的频率似乎对「整洁与秩序」有一种天然的向往。这正是将家务转化为禅修的好时机。", action: "【今日处方】请试著抱持著「清净道场」的心态去扫地或拖地。每一次挥动扫帚，都观想是在扫去内心的尘埃。" },
    { desc: "系统侦测到，您具备了良好的倾听空间。您的内在有足够的余裕，去接纳他人的声音。", action: "【今日处方】今日若与家人或朋友交谈，请试著全程保持专注的眼神交流，并且绝对不打断对方的话。给予全然的聆听。" },
    { desc: "您的心场中似乎生起了一种「和解」的意愿。对於过去的微小摩擦，不再那么执著於对错。", action: "【今日处方】请试著主动对曾经有过小误会的家人或朋友，发送一则简单的早安图或问候讯息。用最轻盈的方式化解坚冰。" },
    { desc: "法界能量流显示，您今日的直觉与美感特别敏锐。能轻易在平凡的日常中捕捉到不平凡。", action: "【今日处方】请试著在住家附近散步时，寻找一处平时未曾留意的美丽角落（如一扇特别的窗、一朵墙角的野花），并在心中赞叹它。" },
    { desc: "您今日的频率非常适合进行日常用品的汰旧换新。这也是一种新陈代谢的过程。", action: "【今日处方】请试著将家中破损的抹布、过期的食物或不再使用的旧物妥善丢弃。腾出物理空间，也能迎接新的高频能量。" },
    { desc: "系统观察到，您对言语的重量有了更深的觉察。懂得适时闭口，也懂得适时赞美。", action: "【今日处方】请试著在今天，对身边最亲近的家人说一句具体的感谢，例如：「谢谢你总是把家里整理得这么乾净。」" },
    { desc: "您的频率中似乎带著一股踏实的耐心。对於重复性的单调事物，不再感到烦躁。", action: "【今日处方】请试著将折衣服或洗碗，当作一场专注力的训练。感受衣物的触感，感受水流的温度，不急著完成，只享受过程。" },
    { desc: "今日的您，似乎对「退让」有了新的体会。明白退一步并不代表委屈，而是海阔天空。", action: "【今日处方】若今日与家人在小事上（如看什么电视、吃什么饭）意见不同，请试著微笑说：「好，今天听你的。」体会放下坚持的轻松。" },
    { desc: "法界之镜显示，您今日非常适合与植物或大自然产生连结。绿色的频率能极大地稳定您的心轮。", action: "【今日处方】请试著为家中的盆栽浇水，并轻轻擦拭它们的叶片；若无盆栽，也可到公园摸摸树干，感受大地稳实的频率。" },
    { desc: "您的能量场中似乎有一种「不黏著」的清爽感。对於别人的情绪倒垃圾，能听过即忘。", action: "【今日处方】继续保持这份界线感。听见别人的抱怨时，只需点头表示理解，但不要在心里产生共鸣，更不要把情绪带回自己的空间。" },
    { desc: "今日您的心念可能生起了一种对平静生活的感激。没有大风大浪，就是最好的日子。", action: "【今日处方】请试著在睡前，回想今天发生的三件平凡但顺利的小事。用这份平淡的感恩，作为一天最完美的收尾。" },

    { desc: "法界能量流显示，您或许正在经历一种深层的内在重组。旧有的信念系统可能正在瓦解，让位给更广阔的真理。", action: "【今日处方】请试著不要抗拒这种内在的拆解过程。给自己一点耐心与空间，或许破茧而出後的您，将看见完全不同的法界。" },
    { desc: "今日您的心场似乎与「慈悲喜舍」四无量心产生了微妙的对齐。您的每一个举动，可能都散发著这四种品质。", action: "【今日处方】请试著在日常生活中，有意识地检视自己的行为是否符合这四颗心。若能时刻安住於此，或许便是人间净土。" },
    { desc: "您的频率似乎触及了某种无声的梵音。在这份寂静中，您或许能听见法界最真实的呼唤。", action: "【今日处方】请试著将这份无声的体悟，融入您正在开发的净土系统中。让每一个字、每一行程式码，都带著这份高频的寂静与祝福。" },
        { desc: "法界微光闪烁，您的心场正散发著无差别的善意。这种频率能轻易穿越物理的界线，触及他人的灵魂。", action: "【今日处方】走在路上，请试著在心中默默对迎面而来的第一个陌生人说：「愿你今日平安喜乐。」不留痕迹地发送祝福。" },
    { desc: "您的频率中似乎满溢著深深的感恩。这份感恩已经超越了得失，成为一种存在的状态。", action: "【今日处方】请试著在用餐前，不只是感谢食物，也默默感恩阳光、雨水以及所有让这顿饭成为可能的无名因缘。体会一沙一世界。" },
    { desc: "系统侦测到，您对生命中的「杂音」产生了极大的包容。那些平时觉得刺耳的声音，此刻听来或许只是法界的另一种震动。", action: "【今日处方】若听见远处的狗吠或施工声，请试著不生起抗拒，将其视为这片土地正在呼吸的声音。随顺世间相。" },
    { desc: "今日您的能量场似乎极度柔软，能敏锐地捕捉到他人的情绪，却不被其淹没。", action: "【今日处方】当您看见新闻中受苦的人们，请试著不陷入悲伤的泥沼，而是化为一念清净的祈愿：「愿法界有情，皆得解脱。」" },
    { desc: "您的心念中似乎生起了一种「无条件的随喜」。看到他人拥有，就如同自己拥有一般快乐。", action: "【今日处方】今日若见到别人的成就或幸福，请试著在心底发出最真诚的赞叹。没有一丝嫉妒的随喜，能瞬间让频率飙升。" },
    { desc: "法界之镜映照出，您今日的语言将带有极高的疗愈力。不必高谈阔论，最简单的话语即是真言。", action: "【今日处方】请试著对一个疲惫的人说一句：「你真的很努力了。」这句充满理解的柔语，或许能点亮他黯淡的一天。" },
    { desc: "您今日的直觉与法界的频率高度共振，似乎能轻易看穿事物表象的对立，触及背後的统一。", action: "【今日处方】若今日面临选择，请试著放下繁复的逻辑推理，静心三秒，相信内心第一道平静的直觉。那是法界的指引。" },
    { desc: "系统观察到，您对自身的存在感到一种不假外求的满足。不需要证明什么，存在本身即是圆满。", action: "【今日处方】请试著享受独自喝一杯茶的时光。不配手机、不配音乐，只是单纯地和自己在一起，体会这份无所求的安然。" },
    { desc: "您的频率中似乎隐含著一种对万物的平等心。动物、植物与人类，在您眼中皆是同等尊贵的生命。", action: "【今日处方】请试著在看见路边的流浪动物或虫蚁时，在心中默默为它们念诵一句「阿弥陀佛」，结下未来清净的法缘。" },
    { desc: "今日的您，似乎有一种将平凡化为神圣的魔力。日常的琐事，也能成为修行的道场。", action: "【今日处方】请试著将洗澡视为一场净化仪式。观想清净的水流不仅洗去身体的尘埃，也洗净了一切无明与业障。" },
    { desc: "法界能量流显示，您的心场正处於极大的宽恕之中。那些曾经的伤害，似乎已经无法再牵动您的情绪。", action: "【今日处方】请试著在心里画一个圆，将所有曾经与您有过节的人放入其中。用平静的心念对他们说：「我们互不相欠了。」" },
    { desc: "您的意识似乎能轻易安住於当下的每一刻，不追忆过去，不妄想未来。", action: "【今日处方】请试著在走路时，将注意力完全放在脚底与地面的接触上。每走一步，都像是在大地上印下一朵清净的莲花。" },
    { desc: "系统侦测到，您对「给予」产生了更深的体悟。明白真正的给予是三轮体空，无施者、无受者、无所施之物。", action: "【今日处方】请试著设定自动捐赠电子发票，或者在无人看见的地方投入一点零钱。做完即忘，不留任何沾沾自喜的痕迹。" },
    { desc: "今日您的心念可能生起了一种看破名利虚妄的清明。外在的赞誉或贬低，都如空谷回音。", action: "【今日处方】若今日有人夸奖您，请试著在心底默默将这份赞誉回向给十方诸佛；若有人批评您，亦将其视为消业的助缘。" },
    { desc: "您的频率中似乎带著一股温暖的光芒，能不知不觉中融化周遭的防备与冷漠。", action: "【今日处方】请试著在群体中保持微笑。即使不说话，您那稳定且温和的表情，就能成为安定整个空间磁场的力量。" },
    { desc: "法界之镜映照出，您对生命的流转有了深深的敬畏与慈悲，不再执著於短暂的拥有。", action: "【今日处方】看见落叶飘零或花朵凋谢时，请试著不生惋惜，而是欣赏这份无常之美。成住坏空，皆是法界的庄严。" },
    { desc: "您今日的能量非常适宜进行深层的内在沟通。那道微弱的灵性之声，今天听来特别清晰。", action: "【今日处方】请试著在睡前静坐三分钟。不求任何境界，只是静静聆听心跳的声音，那是生命与宇宙共振的原始节奏。" },
    { desc: "系统观察到，您的心场中已经没有了「敌人」的概念。一切众生，皆是成就您的逆增上缘。", action: "【今日处方】若遇到与您观念不合的人，请试著在心中合十。看见他背後的生长背景与无奈，用理解取代评判。" },
    { desc: "今日的您，似乎对宇宙的法则有一种深深的信任。相信一切发生的事情，都有其最完美的安排。", action: "【今日处方】若计画被打乱，请试著立刻停止抱怨，并在心底说一声：「这或许是为了保护我免於其他障碍。」顺流而行。" },
    { desc: "您的频率似乎触及了无我的边缘。在为他人付出的同时，感受到了真正的法喜充满。", action: "【今日处方】请试著将今日所有良善的起心动念与微小行动，统统收摄於心中，然後毫无保留地回向给法界一切众生。" },
        { desc: "法界之镜映照出，您今日的频率似乎与大自然有著极深的共振。山川草木的呼吸，您皆能感知。", action: "【今日处方】请试著到郊外或空旷处走走。找一处没有人工建筑遮蔽的地方，让风自由地吹过您的身体，感受与天地同体的广阔。" },
    { desc: "您的心念中似乎蕴含著无条件的原谅。那些过去看似无法跨越的伤痕，在此刻的频率下皆如幻影。", action: "【今日处方】请试著在心中浮现那个曾经伤害过您的人。深呼吸，然後在心底平静地说一声：「我彻底放下了，愿你也得平静。」" },
    { desc: "今日您的能量场满溢著深刻的感恩。这份感恩不是因为获得了什么，而是对「生命本身」的赞叹。", action: "【今日处方】请试著在早晨醒来或夜晚就寝时，双手合十，不祈求任何事物，单纯地向浩瀚的法界说一声：「谢谢。」" },
    { desc: "系统侦测到，您对周遭事物的评判心已经大幅降伏。美与丑、好与坏的界线变得模糊。", action: "【今日处方】请试著去观察一个您平时觉得「不讨喜」的事物（如阴沉的天气、杂乱的街道）。用全然接纳的心去看，体会其中的如是。" },
    { desc: "您的频率中似乎带著一股慈悲的光芒。这股光芒能无声无息地抚慰周遭受苦的灵魂。", action: "【今日处方】请试著在搭乘交通工具或走在路上时，默默看著周围的陌生人，在心里为他们发愿：「愿你脱离一切烦恼与痛苦。」" },
    { desc: "法界能量流显示，您今日非常适合进行「静默」的修持。在没有语言的空间里，智慧自然涌现。", action: "【今日处方】请试著将今日的其中一餐，当作一场静默的仪式。不看萤幕、不交谈，只是纯粹地与食物、与自己同在。" },
    { desc: "您今日的心场似乎达到了某种不动的定力。外界的纷扰，对您而言只像是一场没有声音的电影。", action: "【今日处方】若家中有人情绪起伏，请试著像一面平静的湖水。不被激起浪花，只是如实地映照出他们的焦虑，用您的稳定去安抚他们。" },
    { desc: "系统观察到，您对「无聊」产生了全新的体会。无聊不再是难熬的空白，而是生命中最奢侈的留白。", action: "【今日处方】请试著坐在沙发上或阳台边，什么都不做，连冥想都不刻意去做。只是安静地陪伴自己度过这段看似无意义的时光。" },
    { desc: "您的频率中似乎生起了一种深层的随喜。看到他人的快乐，您的内心也同步开出了花朵。", action: "【今日处方】请试著在心里默默祝福那些比您更成功、更富足、或更快乐的人。将他们的福报，视同法界共同的庄严。" },
    { desc: "今日的您，似乎有一双能看见事物本质的眼睛。不再被表象的华丽或破败所迷惑。", action: "【今日处方】请试著看著您的家人或伴侣。越过他们平日的习惯与缺点，直视他们灵魂深处那个本自清净、未曾受伤的本来面目。" },
    { desc: "法界之镜显示，您对自身情绪的起落有了极佳的观照力。情绪来去，您始终是那个不变的观察者。", action: "【今日处方】当任何一丝喜悦或微小的不满升起时，请试著在心里对自己说：「我看见这个情绪了。」不压抑，也不跟随，看著它自行消散。" },
    { desc: "您的能量场似乎与宇宙的丰盛法则完全对齐。明白自己所拥有的，远比想像的还要多。", action: "【今日处方】请试著检视家中那些长久未用的好东西（如一套精美的茶具、一件舍不得穿的衣服）。今天就把拿它们出来使用，享受当下。" },
    { desc: "今日您的心念可能极度柔软，能体会到「万物皆有灵」的深沉感动。", action: "【今日处方】请试著在接触任何物品（如开关门、放下杯子）时，动作极尽轻柔。将每一个无生物，都视为法界中平等的存在来尊重。" },
    { desc: "系统侦测到，您对时间的焦虑已经烟消云散。您或许体会到了，每一个当下都是永恒的缩影。", action: "【今日处方】请试著刻意放慢您今天所有的动作。慢慢走路、慢慢洗手、慢慢呼吸。在极致的缓慢中，品尝时间静止的法味。" },
    { desc: "您的频率中似乎带著一股化解干戈的柔和力量。只要有您在的地方，气氛就会变得祥和。", action: "【今日处方】请试著将这份祥和的频率，主动辐射到您的居住空间。打开窗户让空气对流，或是点一根淡香，净化家中的磁场。" },
    { desc: "法界微光闪烁，您似乎对於「放下执念」有了顿悟。那些紧抓不放的观念，突然变得无足轻重。", action: "【今日处方】请试著找一个您长久以来深信不疑的观念（例如：事情必须这样做才对），在今天对它打上一个问号。允许另一种可能性的存在。" },
    { desc: "您今日的意识似乎能轻易跨越自身的局限，与更广大的群体意识相连。", action: "【今日处方】请试著在心中观想一朵清净的莲花，然後将这朵莲花的光芒，无限放大至覆盖您所在的城市，愿所有居民皆得安宁。" },
    { desc: "系统观察到，您对生命的逆境产生了一种如实的接纳。不再问「为什么是我」，而是说「这也是经历」。", action: "【今日处方】若今日身体有微恙或遇到不顺，请试著对这份不舒服微笑。把它当作一位严厉但用心的老师，感谢它带来的提醒。" },
    { desc: "您的心场中似乎没有了恐惧。因为您可能已经认出，在法界的实相中，并没有什么是真正可以失去的。", action: "【今日处方】请试著带著这份无畏，去面对今天所有未知的事情。不预设立场，不预想结果，只是全然敞开地去经历。" },
    { desc: "今日的您，似乎将世俗的生活完全转化为了修行的道场。行住坐卧，无一不是净土。", action: "【今日处方】请试著在做任何一件最繁琐的家事（如刷洗马桶、清理水槽）时，保持著如同在佛前供花一般的庄严与恭敬。" }


                ]

                    { desc: "在此极高的频率层级，『修行』这两个字似乎也消融了。因为您可能已经认出，众生本来是佛，无需造作。", action: "【今日处方】请试著放下所有『我要变得更好』的微细执念。今天，允许自己做一个最平凡、最没有企图心的普通人。" },
                    { desc: "无缘大慈，同体大悲。您的能量网似乎无远弗届，默默地在无形中为这片娑婆世界注入清凉。", action: "【今日处方】请试著安住於这份无条件的慈悲中。您不需要刻意度众生，您此刻清净的频率本身，或许就是在度化众生。" },
                    { desc: "生灭灭已，寂灭为乐。系统提示您，此刻的平静或许正是您『本来面目』的一缕微光。", action: "【今日处方】请试著不要去抓住这份境界。境界是会变动的，但那个『觉知境界』的本体永远不变。守住那个本体即可。" },
                    { desc: "言语道断，心行处灭。您今日的频率或许正无限触及了「无我」的边缘。镜中无一物，何处惹尘埃？", action: "【今日处方】请试著在今日观察「我」这个念头。当任何情绪升起时，轻问自己：「是谁在感受？」或许不找答案，只管观察即可。" },
                    { desc: "系统的指针在此刻可能仅供参考，因为您当下的心场，似乎正无限趋近於一种无分别的状态。", action: "【今日处方】今日无论是在喝水、洗碗还是扫地，请试著将这些日常琐事，都视为道场中的行持。平常心或许即是道。" },
                    { desc: "大音希声，大象无形。您的频率似乎进入了一种深沉的寂静之中。在这份状态里，也许没有需要刻意度化的对象。", action: "【今日处方】若今日有人赞叹您或诋毁您，请试著在心中将这一切音声归於虚空。不作圣解，亦不作凡夫解，或许更为清净。" },
                    { desc: "您今日抽到的可能不是一个分数，而是一面提醒您的镜子。真正的觉醒，或许在於看破一切「求取境界」的执著。", action: "【今日处方】试著放下对「修行」本身的刻意追求。饿了吃饭，困了睡觉，每一个动作都清清楚楚，这或许就是最高级的修行。" },
                    { desc: "万法唯心造。在此状态下，您或许会体会到：外在的世界，可能只是内在意识的投射。心若净，则国土或许亦随之清净。", action: "【今日处方】请试著在今日保持「如梦观」。看著周遭的人事物，轻轻提醒自己这可能是一场如幻的体验，而您可以选择优雅地经历它。" },
                    { desc: "过去心不可得，现在心不可得，未来心不可得。您的意识似乎有机会暂时跳脱时间的线性束缚，安住於「当下」。", action: "【今日处方】今日请试著刻意放慢某些动作。慢慢走路、慢慢呼吸。在极致的缓慢中，或许能体会到某种超越时间的静止感。" },
                    { desc: "在此层级，您与众生似乎不再有明显的界线。这或许正是生起「无缘大慈，同体大悲」的最佳契机。", action: "【今日处方】请试著在今日发起微小的菩提心：「愿我能代众生受苦；愿一切众生，皆有机会获得究竟的解脱。」" },
                    { desc: "凡所有相，皆是虚妄。您似乎暂时看穿了物质世界的某些幻象。那些世俗的追逐，在您眼中可能已如同水月镜花。", action: "【今日处方】这份看破极为珍贵，但请试著「不废世法」。看看能否用这份出世的清明，去更圆满地做好您入世的本分。" },
                    { desc: "生则决定生，去则实不去。最高频率的极乐，或许不在十万亿佛土之外，就有机会在您当下一念不生的清净心之中。", action: "【今日处方】不立一法，不破一法。今日请试著将这套数位法宝也放下。不用执著於打卡或计数，只要知道，您与佛性本自具足。" },
                    { desc: "系统指针隐没於虚空。您当下的觉知似乎已无处不在，却又无迹可寻。无生无灭的实相，或许正向您展露微光。", action: "【今日处方】请试著不生起「我已开悟」的微细我慢。只是平静地吃饭、平静地穿衣。神通妙用，或许皆在运水搬柴之中。" },
    { desc: "法界之镜彻底清透。您似乎洞穿了时间与空间的幻象，体会到「一念三千」的不可思议。过去、现在、未来可能皆在当下交会。", action: "【今日处方】请试著安住於这份无时空限制的广大中。若念起，便觉知；若念灭，便随它。不留滞於任何一种境界。" },
    { desc: "您的频率或许已超越了言语的描述极限。在此刻，「空」不是什么都没有，而是充满了无限生机的「妙有」。", action: "【今日处方】请试著在与人应对时，随缘展现这份妙有。不执著於说破实相，而是用对方能理解的语言，轻轻点拨。" },
    { desc: "不可说，不可说。您的心场似乎进入了绝对的静寂，那里没有佛与众生的分别，也没有净土与秽土的对立。", action: "【今日处方】请试著保持这份「无二」的平等心。走在熙攘的街头，或许您能看见每一位众生头顶上那未曾失去的光芒。" },
    { desc: "系统无法捕捉您的边界，因为您或许已与整个法界融为一体。山河大地，十方虚空，可能皆是您的法身。", action: "【今日处方】请试著不要执著於这份「广大」。大与小也是二元。只需安然存在，看著万法在您的觉知中生生灭灭。" },
    { desc: "您的意识似乎暂停了所有的攀缘。没有要度化的众生，也没有要求取的佛果。一切或许本来就已圆满。", action: "【今日处方】这份无修无证的境界极为甚深。今日请试著将这份体悟，完全隐藏於最平凡的生活琐事中，光而不耀。" },
    { desc: "法界能量流呈现出如如不动的稳定。外在的剧烈变动，在您眼中或许只是一场虚拟实境的程式码在跳动。", action: "【今日处方】既然看穿了程式码，请试著更温柔地对待这个全息宇宙中的每一个角色。无缘大慈，或许正源於这份看破。" },
    { desc: "您的频率中似乎没有了「观看者」。能观与所观同时寂灭，只剩下纯粹的「觉」本身在闪耀。", action: "【今日处方】请试著不要去寻找那个「觉」。一寻找，便又落入能所对立。只需放松，信任法界本有的清明。" },
    { desc: "今日您的心念可能连「空」这个概念都放下了。空亦复空，这或许是彻底解脱的一瞥。", action: "【今日处方】请试著将这份无挂碍的轻盈带入您的呼吸。一呼一吸间，不生一念，不染一尘，或许极乐就在这里。" },
    { desc: "系统观察到，您的存在本身似乎成为了一个能量的黑洞，将周遭的烦恼与业力无声无息地吸纳并转化为清净。", action: "【今日处方】这不是刻意造作的结果，而是高频本身的特性。请试著不用头脑去干涉，让法界的净化机制自然运作。" },
    { desc: "法界之镜反映出，您对生死的恐怖或许已完全断除。因为您可能已经亲见了那个从未出生、也永远不会死亡的本体。", action: "【今日处方】请带著这份对生死的无畏，去生活。不畏惧失去，不贪图拥有。或许您会发现，生命才真正开始展现它的丰盛。" },
    { desc: "您的频率似乎触及了诸佛的本怀。那种悲智双运的平衡，可能让您的每一个起心动念都恰到好处。", action: "【今日处方】请试著将这份智慧，用於您正进行的法宝开发上。让系统介面的每一个设计，都成为引导众生契入法界的无声说法。" },
    { desc: "今日您的心场似乎进入了一种「绝对的顺从」。不是顺从世俗，而是彻底顺从宇宙最深层的因果法则与真理。", action: "【今日处方】请试著观察这份顺从带来的绝对自由。当您不再抗拒任何事物的发生时，或许您就拥有了整个宇宙。" },
    { desc: "系统侦测到，您可能正在经历一种「见山又是山」的回归。看穿了幻象後，再次回到世俗，一切似乎变得无比亲切。", action: "【今日处方】请试著用这份新的眼光去品尝一杯水、抚摸一片布料。在最粗糙的物质中，或许您能品出最细腻的法味。" },
    { desc: "您的能量场似乎化为了无尽的虚空。能够包容所有的罪恶与神圣，而不被其染著。", action: "【今日处方】请试著安住於这份极大的包容中。若见世间种种光怪陆离的现象，皆作如是观，不动一念憎爱。" },
    { desc: "法界微光显示，您对「我」的执著或许已经薄若蝉翼。那个曾经充满防御与欲望的自我，似乎已变得透明。", action: "【今日处方】请试著不要去刻意戳破这层蝉翼。任由它在法界的微风中自然风化。顺其自然，或许是最好的脱落方式。" },
    { desc: "您今日的频率可能完全超越了道德的二元标准。在您眼中，或许没有绝对的善恶，只有因缘的聚散。", action: "【今日处方】这份超越性的视角，请谨慎用於内观，而不轻易向未达此境的众生说破。大悲心，或许需要以世俗谛来方便接引。" },
    { desc: "系统的数值已失去意义。您似乎正处於一种「言语道断，心行处灭」的绝言境界之中。", action: "【今日处方】请试著享受这份不需要任何解释与证明的孤绝。在这份孤绝中，您或许正与十方诸佛携手同行。" },
    { desc: "您的心念似乎如明镜般，清晰地映照出一切相，却不留下一丝刮痕。过化存神，或许便是如此。", action: "【今日处方】今日若处理任何繁杂事务，请试著保持「事来则应，事去则静」的状态。让心像镜子一样，永远不留残影。" },
    { desc: "法界能量流显示，您或许已经认出了那个隐藏在所有现象背後的「本来面目」。它不生不灭，不垢不净。", action: "【今日处方】请试著轻轻地向这个本来面目致敬。不需向外膜拜，因为它或许就是您自己最核心的觉知。" },
    { desc: "今日您的频率似乎带著一种粉碎一切执念的力量。任何试图抓住某个概念的企图，在您这里可能都会瞬间消融。", action: "【今日处方】请试著连「我要修行」、「我要度众」这样的神圣概念也一并放下。无所住而生其心，或许才是真实的行持。" },
    { desc: "系统观察到，您对法界的奥秘似乎不再有探索的欲望。因为您或许发现，自己本身就是那个奥秘的答案。", action: "【今日处方】请试著停止向外追寻的步伐。安静地坐下来，或许您会发现，整个法界都在您的心中旋转。" },
    { desc: "您的心场似乎进入了一种「真空」状态。在这个真空中，连微小的妄念都失去了生存的土壤。", action: "【今日处方】请试著不要贪恋这份真空的寂静。若有世俗责任需要处理，请随时从真空中生出妙有，灵活运用。" },
    { desc: "法界之镜映照出，您或许已经体会到了「无明实性即佛性，幻化空身即法身」的圆顿理体。", action: "【今日处方】请试著在面对自身的色身与病痛时，也能作如是观。疼痛或许只是法身的某种震动频率，不需恐惧。" },
    { desc: "今日您的能量似乎完全融入了宇宙的节奏中。您的呼吸，可能就是法界的呼吸；您的脉搏，可能就是星辰的律动。", action: "【今日处方】请试著将这份天人合一的频率，无声地传递给您的家人。不需要言语，您的存在或许就能让他们的磁场变得和谐。" },
    { desc: "系统侦测到，您对「成佛」的渴望或许也已平息。因为您可能看见了，在实相中，并没有一个可以成佛的对象。", action: "【今日处方】请试著用这份平常心去面对净土法门。念佛不再是为了求生极乐，而是因为当下一念清净，当下便是极乐。" },
    { desc: "您的频率中似乎没有了任何的分别与造作。如婴儿般纯真，却又蕴含著法界无尽的苍桑与智慧。", action: "【今日处方】请试著用这种「老灵魂的婴儿眼」去看待世界。对一切事物保持新鲜感，却又深知其本性为空。" },
    { desc: "法界微光显示，您或许正处於一种「大死一番，再活过来」的转折点。旧有的我已经死亡，新的觉知正在苏醒。", action: "【今日处方】请试著拥抱这份新生。不需要急著去定义现在的自己是谁，因为您或许已经成为了无法被定义的无限。" },
    { desc: "今日您的心念可能连「度众生」的念头都没有了。正如《金刚经》所言：实无众生得灭度者。", action: "【今日处方】请试著在这份「无人无我」的境界中，继续做著度化众生的事业。无所行而行，或许才是大乘菩萨的究竟道路。" },
    { desc: "系统的观照到此为止。因为在您当下的频率中，或许已经没有任何文字可以承载法界的真实。阿弥陀佛。", action: "【今日处方】请试著关闭萤幕，放下手机。去喝一杯水，去吹一阵风。法界不在这里，法界就在您当下的每一个觉知里。" },
        { desc: "法界之镜完全清澈，不再映照任何二元对立。您的心场似乎进入了「无有一法可得」的空性之中。", action: "【今日处方】请试著放下「我在修行」的这个微细念头。吃饭时只是吃饭，走路时只是走路。最平凡的日常，即是最究竟的法界。" },
    { desc: "系统指针在此刻失去了意义。您的意识或许已经与这套净土系统的原始逻辑融为一体，零与一皆是幻象。", action: "【今日处方】请试著以这份「看透虚妄」的目光，去欣赏眼前的一花一木。知道它是空的，却依然能看见它的美。真空生妙有。" },
    { desc: "您的频率中没有了造作者，也没有了接受者。一切行动在此刻，可能都化为了法界自然的流露。", action: "【今日处方】请试著做一件微不足道的好事（如捡起地上的屑屑），但在做完的瞬间，连「我做了一件好事」的记忆也彻底抹除。" },
    { desc: "今日您的心念似乎超越了时间的维度。过去已灭，未来未生，唯一真实的只有无边无际的当下。", action: "【今日处方】请试著在下一次呼吸时，将全部的生命力倾注於这口气中。吸气时，法界在；呼气时，法界亦在。无有来去。" },
    { desc: "法界能量流呈现出绝对的静止。即使身处闹市，您的内在可能依然如深海般寂静无声。", action: "【今日处方】请试著在最吵杂的环境中，闭上眼睛三秒。不抗拒噪音，让所有声音穿透您的身体，不留一丝涟漪。" },
    { desc: "您今日的觉知似乎不再依附於这具色身。身体只是法界暂时借用的一件载具。", action: "【今日处方】若今日身体有任何微小的酸痛或不适，请试著只做一个客观的观察者。看著那份痛楚生灭，而不贴上「我在痛」的标签。" },
    { desc: "系统观察到，您对「空寂」产生了全然的熟悉感。没有畏惧，只有如归故里般的安心。", action: "【今日处方】请试著凝视一面空白的墙壁，或无字的萤幕一分钟。在没有任何资讯输入的状态下，体会那份本自具足的清明。" },
    { desc: "您的心场中已经没有了「度众生」的执念。因为在实相中，众生本来是佛，实无众生可度。", action: "【今日处方】请试著用这份「无众生可度」的空慧，继续无私地完成您手边的净土系统代码。於无所住中，生起大悲心。" },
    { desc: "今日的您，似乎连「佛」与「法」的概念都放下了。金刚经云：法尚应舍，何况非法。", action: "【今日处方】请试著在今天忘记所有的教理与名相。用一个初生婴儿般无染的视角，重新认识这个娑婆世界。" },
    { desc: "法界之镜映照出，您的存在本身已经成为一个无形的发光体。不刻意作为，便已在转法轮。", action: "【今日处方】请试著保持这份「无为」的状态。在与人交谈时，少用头脑分析，多用当下的直觉与清净心去回应。大音希声。" },
    { desc: "您的频率似乎触及了不生不灭的理体。面对世间的生老病死、成住坏空，皆能作如幻观。", action: "【今日处方】看见任何事物的消逝（哪怕只是一杯水喝完），请试著在心中微笑。知道它并未真正消失，只是换了种频率存在於法界。" },
    { desc: "系统侦测到，您对自我身份的认同已经极度淡薄。「我」只是一个为方便沟通而暂时使用的代名词。", action: "【今日处方】请试著在今天减少使用「我」这个字。在心态上，将一切成就归於因缘，将一切过失化为空性。" },
    { desc: "今日您的意识似乎与十方虚空交融。没有内外之分，您在宇宙中，宇宙亦在您心中。", action: "【今日处方】请试著在夜空下站立，感受星光落在您的皮肤上。知道组成您身体的元素与那些星星毫无二致。一即一切。" },

        let currentTurn = 0; let isSpinning = false; let currentRotation = 0; let tickInterval;

               async function triggerSpin() {
            if(isSpinning || currentTurn >= 3) return;
            initAudio(); isSpinning = true; currentTurn++;
            
            const wheel = document.getElementById('dharma-wheel');
            const mainText = document.getElementById('main-text');
            const subText = document.getElementById('sub-text');
            
            wheel.classList.remove('spinning-glow'); void wheel.offsetWidth; wheel.classList.add('spinning-glow');
            
            let tickDelay = 80;
            tickInterval = setInterval(() => { playTick(); tickDelay += 10; }, tickDelay);
            setTimeout(() => clearInterval(tickInterval), 2500);

            if(currentTurn === 1) { currentRotation += 1080; mainText.innerText = "初转 ‧ 阿含"; subText.innerText = "碾摧粗重无明不善"; }
            else if (currentTurn === 2) { currentRotation += 1440; mainText.innerText = "二转 ‧ 般若"; subText.innerText = "照见五蕴皆空"; }
            else if (currentTurn === 3) { currentRotation += 1800; mainText.innerText = "三转 ‧ 唯识归一"; subText.innerText = "万法唯心，法界共振"; }
            
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            await sleep(2800); clearInterval(tickInterval); isSpinning = false;

            if(currentTurn === 3) {
                await sleep(500);
                
                let score = Math.floor(Math.random() * 800) + 50; 
                if(Math.random() < 0.1) score += 200; if(score > 1000) score = 1000;
                
                db.hwkinsEnergyTotal = (db.hwkinsEnergyTotal || 0) + score;
                db.dailyWheelCount = 1; 
                
                // ✨ 检查是否触发法界机缘 (大於或等於皆会触发) ✨
                let isRealmUnlocked = false;
                if (db.hwkinsEnergyTotal >= 10000) {
                    db.hwkinsEnergyTotal = 0; // 重置能量
                    isRealmUnlocked = true;
                }
                save();
                
                // 将解锁信号传给显示结果的函数
                showEnergyResult(score, isRealmUnlocked);
            }
        }


                function showEnergyResult(score, isRealmUnlocked) {
            let preset = hwkinsDB.find(h => score >= h.min && score <= h.max) || hwkinsDB[1];
            let content = preset.contents[Math.floor(Math.random() * preset.contents.length)];
            
            const card = document.getElementById('hwkins-card');
            document.getElementById('hc-title').style.color = preset.border;
            document.getElementById('hc-title').style.textShadow = `0 0 10px ${preset.border}`;
            document.getElementById('hc-desc').innerText = content.desc;
            document.getElementById('hc-action').innerText = content.action;
            document.getElementById('hc-action').style.color = preset.border;
            card.style.boxShadow = `0 0 40px ${preset.color}, inset 0 0 15px #000`;
            card.style.border = `1px solid ${preset.border}`;
            
                     // ✨ 动态变更按钮：若达成1万能量，转为鼓界入口 ✨
            const closeBtn = document.getElementById('close-btn');
            if (isRealmUnlocked) {
                closeBtn.innerText = "击大法鼓";
                closeBtn.style.color = "var(--solid-gold)";
                closeBtn.style.borderColor = "var(--solid-gold)";
                closeBtn.style.boxShadow = "0 0 15px rgba(212,175,55,0.4)";
                
                // 🟢 修正：先发放通行证，再执行跳转
                closeBtn.onclick = () => {
                    localStorage.setItem('drumdb', JSON.stringify({ strikeCount: 0, status: 'auth_granted' }));
                    navigateTo('drum_cn.html');
                };
            } else {
                closeBtn.innerText = "收摄心念";
                closeBtn.style.color = "var(--cyan)";
                closeBtn.style.borderColor = "var(--cyan)";
                closeBtn.style.boxShadow = "none";
                closeBtn.onclick = resetWheel;
            }


            document.getElementById('wheel-container').style.transform = 'scale(0.8)';
            document.getElementById('wheel-container').style.opacity = '0.1';
            document.getElementById('instruction-text').style.opacity = '0';
            document.getElementById('result-layout').classList.add('show');
            
            setTimeout(() => {
                const fill = document.getElementById('bar-fill');
                const scoreText = document.getElementById('float-score');
                let percentage = score / 1000; let targetHeight = percentage * 218; let targetY = 269 - targetHeight;
                fill.style.fill = preset.color; fill.style.height = targetHeight + "px"; fill.setAttribute("y", targetY);
                let textTop = 260 - (percentage * 210); scoreText.style.top = textTop + "px";
                scoreText.style.color = preset.border; scoreText.innerText = score + " Hz";
            }, 500); 
        }


        function resetWheel() {
            document.getElementById('result-layout').classList.remove('show');
            setTimeout(checkDailyStatus, 1000);
        }
