                    { desc: "あなたの周波数には造作する者も、受け取る者も存在しません。この瞬間のすべての行動は、法界の自然な流露へと化したのかもしれません。", action: "【本日の処方】些細な良いこと（例えば床のゴミを拾うなど）をしてみてください。しかし終わった瞬間に、「私が良いことをした」という記憶さえも完全に消し去りましょう。" },
                    { desc: "今日のあなたの心念は時間の次元を超越したようです。過去はすでに滅し、未来は未だ生じず、唯一の真実は果てしない今この瞬間だけです。", action: "【本日の処方】次の呼吸の時、すべての生命力をこの一息に注ぎ込んでみてください。息を吸う時、法界は在り、息を吐く時も、法界は在る。去来はありません。" },
                    { desc: "法界のエネルギー流は絶対の静止を示しています。賑やかな街にいても、あなたの内面は深海のように静まり返っているのかもしれません。", action: "【本日の処方】最も騒がしい環境の中で、3秒間目を閉じてみてください。騒音に抵抗せず、すべての音があなたの身体を通り抜け、一筋の波紋も残さないようにしましょう。" },
                    { desc: "今日のあなたの覚知は、もはやこの肉体に依存していないようです。身体は法界が一時的に借りている乗り物にすぎません。", action: "【本日の処方】今日身体に微小な痛みや不快感があったら、ただ客観的な観察者になってみてください。その痛みが生まれ消えるのを見つめ、「私が痛い」というレッテルを貼らないようにしましょう。" },
                    { desc: "システムは、あなたが「空寂」に対して完全な親しみを感じていることを観察しています。恐れはなく、故郷に帰ったような安心感だけがあります。", action: "【本日の処方】何も描かれていない壁、または文字のない画面を1分間見つめてみてください。情報の入力がない状態の中で、その本来具わっている清明さを体感しましょう。" },
                    { desc: "あなたの心場からは「衆生を済度する」という執念が消え去りました。なぜなら実相において、衆生は本来仏であり、済度すべき衆生は存在しないからです。", action: "【本日の処方】この「済度すべき衆生はいない」という空慧を用いて、あなたが手掛けている浄土システムのコードを引き続き無私で書き上げてください。住する所なき中に、大悲心を生ずるのです。" },
                    { desc: "今日のあなたは、「仏」や「法」の概念さえも手放したようです。金剛経に云う「法すら尚応に捨つべし、況や非法をや」の通りです。", action: "【本日の処方】今日はすべての教理や名相（名称）を忘れてみてください。生まれたばかりの赤ん坊のような染まらない視点で、この娑婆世界を再認識してみましょう。" },
                    { desc: "法界の鏡は、あなたの存在自体が見えない発光体となっていることを映し出しています。意図的に何もしなくても、すでに法輪を転じているのです。", action: "【本日の処方】この「無為」の状態を保ち続けてください。人と会話する時は頭での分析を減らし、今この瞬間の直感と清浄心で応答しましょう。大音希声。" },

                    { desc: "システムは、あなたの自己認識に対する執着が極度に希薄になっていることを検知しました。「私」はコミュニケーションの便宜上、一時的に使用する代名詞にすぎません。", action: "【本日の処方】今日は「私」という言葉の使用を減らしてみてください。心構えとして、すべての成就を因縁に帰し、すべての過失を空性へと化しましょう。" },
                    { desc: "今日のあなたの意識は十方虚空と交わり合っているようです。内外の区別はなく、あなたは宇宙の中にいて、宇宙もあなたの心の中にあります。", action: "【本日の処方】夜空の下に立ち、星の光があなたの肌に落ちるのを感じてみてください。あなたの身体を構成する元素が、それらの星々と全く同じであることを知るでしょう。一即一切。" },
                    { desc: "あなたのエネルギー場にはいかなる防御メカニズムもありません。なぜなら、「私」が存在しない時、傷つけられる対象など存在しないからです。", action: "【本日の処方】今日誤解や非難を受けても、いかなる弁明もしないでみてください。虚空のように、他人の言葉が通り抜けるのに任せ、その隙のない柔らかさを体感しましょう。" },
                    { desc: "法界の微光は、あなたが世間法の運行法則を胸の内に熟知しながらも、「其の光を和らげ、其の塵に同じうす」ことを体現し、矛先を見せないことを示しています。", action: "【本日の処方】あなたの極めて高い周波数を、最も平凡な振る舞いの中に隠してみてください。お茶を注ぐ、コードを一行打つ、そうした最も何の変哲もない動作の中に、法界の荘厳さを現しましょう。" },
                    { desc: "今日のあなたの心念は、「清浄」という概念すら超越したかもしれません。垢もなく浄もない、それこそが真の絶言境界です。", action: "【本日の処方】「低周波」に見える人や事柄を排斥しないようにしてみてください。泥にまみれた凡夫の相の中に、未だ染まることのない蓮華の本体を見出すのです。" },
                    { desc: "システムはあなたの境界を計測することができなくなりました。あなたの現在の覚知は、過去・現在・未来の三世諸仏と同じ周波数で共鳴しているのかもしれません。", action: "【本日の処方】極めて微細な「覚（気づき）」を保ち続けてください。何をしている時でも、内なる目が静かにすべてを見つめています。これこそがあなたの本来の顔です。" },
                    { desc: "あなたの周波数には、虚空をも粉砕する力が含まれているようです。いかなる妄想執着も、近づけば自動的に消滅します。", action: "【本日の処方】この極めて鋭利な般若の智慧を、世俗の慈悲で優しく包み込んでみてください。まだ執着の中にいる衆生に対しては、説き明かすのではなく、微笑みと忍耐を与えましょう。" },
                    { desc: "今日のあなたは、「求める所なし」の究極の極楽に安住しているようです。極楽世界は遠くにあるのではなく、今この瞬間の一念の心にあるのです。", action: "【本日の処方】弥陀浄土への憧れを、今この瞬間の一念の清浄へと転化させてみてください。一念清浄なれば、一念仏なり。念念清浄なれば、念念仏なり。この地がすなわち蓮邦です。" },
                    { desc: "法界の鏡は完全に融解しました。鏡もなければ、鏡を照らす人もありません。万法は一に帰す、一は何処に帰す？", action: "【本日の処方】このシステム画面を閉じ、現実の生活に戻ってみてください。風に吹かれ、一口の水を飲みましょう。法界はプログラムコードの中にあるのではなく、今この瞬間のあなたの呼吸の中にあるのです。" }
                ]
            }
        ];

        let currentTurn = 0; let isSpinning = false; let currentRotation = 0; let tickInterval;

        async function triggerSpin() {
            if(isSpinning || currentTurn >= 3) return;
            initAudio(); isSpinning = true; currentTurn++;
            
            const wheel = document.getElementById('dharma-wheel');
            const mainText = document.getElementById('main-text');
            const subText = document.getElementById('sub-text');
            
            wheel.classList.remove('spinning-glow'); void wheel.offsetWidth; wheel.classList.add('spinning-glow');
            
            let tickDelay = 80;
            tickInterval = setInterval(() => { playTick(); tickDelay += 10; }, tickDelay);
            setTimeout(() => clearInterval(tickInterval), 2500);

            if(currentTurn === 1) { currentRotation += 1080; mainText.innerText = "初転 ‧ 阿含"; subText.innerText = "粗重なる無明と不善を打ち砕く"; }
            else if (currentTurn === 2) { currentRotation += 1440; mainText.innerText = "二転 ‧ 般若"; subText.innerText = "五蘊皆空を照見す"; }
            else if (currentTurn === 3) { currentRotation += 1800; mainText.innerText = "三転 ‧ 唯識帰一"; subText.innerText = "万法唯心、法界共振"; }
            
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            await sleep(2800); clearInterval(tickInterval); isSpinning = false;

            if(currentTurn === 3) {
                await sleep(500);
                
                let score = Math.floor(Math.random() * 800) + 50; 
                if(Math.random() < 0.1) score += 200; if(score > 1000) score = 1000;
                
                db.hwkinsEnergyTotal = (db.hwkinsEnergyTotal || 0) + score;
                db.dailyWheelCount = 1; 
                
                let isRealmUnlocked = false;
                if (db.hwkinsEnergyTotal >= 10000) {
                    db.hwkinsEnergyTotal = 0; 
                    isRealmUnlocked = true;
                }
                save();
                
                showEnergyResult(score, isRealmUnlocked);
            }
        }

        function showEnergyResult(score, isRealmUnlocked) {
            let preset = hwkinsDB.find(h => score >= h.min && score <= h.max) || hwkinsDB[1];
            let content = preset.contents[Math.floor(Math.random() * preset.contents.length)];
            
            const card = document.getElementById('hwkins-card');
            document.getElementById('hc-title').style.color = preset.border;
            document.getElementById('hc-title').style.textShadow = `0 0 10px ${preset.border}`;
            document.getElementById('hc-desc').innerText = content.desc;
            document.getElementById('hc-action').innerText = content.action;
            document.getElementById('hc-action').style.color = preset.border;
            card.style.boxShadow = `0 0 40px ${preset.color}, inset 0 0 15px #000`;
            card.style.border = `1px solid ${preset.border}`;
            
            const closeBtn = document.getElementById('close-btn');
            if (isRealmUnlocked) {
                closeBtn.innerText = "大法鼓を撃つ";
                closeBtn.style.color = "var(--solid-gold)";
                closeBtn.style.borderColor = "var(--solid-gold)";
                closeBtn.style.boxShadow = "0 0 15px rgba(212,175,55,0.4)";
                closeBtn.onclick = () => navigateTo('drum_jp.html');
            } else {
                closeBtn.innerText = "心念を収める";
                closeBtn.style.color = "var(--cyan)";
                closeBtn.style.borderColor = "var(--cyan)";
                closeBtn.style.boxShadow = "none";
                closeBtn.onclick = resetWheel;
            }

            document.getElementById('wheel-container').style.transform = 'scale(0.8)';
            document.getElementById('wheel-container').style.opacity = '0.1';
            document.getElementById('instruction-text').style.opacity = '0';
            document.getElementById('result-layout').classList.add('show');
            
            setTimeout(() => {
                const fill = document.getElementById('bar-fill');
                const scoreText = document.getElementById('float-score');
                let percentage = score / 1000; let targetHeight = percentage * 218; let targetY = 269 - targetHeight;
                fill.style.fill = preset.color; fill.style.height = targetHeight + "px"; fill.setAttribute("y", targetY);
                let textTop = 260 - (percentage * 210); scoreText.style.top = textTop + "px";
                scoreText.style.color = preset.border; scoreText.innerText = score + " Hz";
            }, 500); 
        }

        function resetWheel() {
            document.getElementById('result-layout').classList.remove('show');
            setTimeout(checkDailyStatus, 1000);
        }
    </script>
