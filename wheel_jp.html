<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest_jp.json">
    <title>華蔵調波 ‧ 転法輪ハブ</title>
    <style>
        /* --cyan 換成明亮玉石色 (#9fdfc8)，徹底解決暗沉問題 */
        :root { --gold: #f3e5ab; --solid-gold: #d4af37; --gold-dark: #b8860b; --cyan: #9fdfc8; --bg-deep: #020202; }
        body { margin: 0; padding: 0; height: 100vh; background: var(--bg-deep); color: #fff; display: flex; flex-direction: column; justify-content: center; align-items: center; font-family: "PingFang TC", "Microsoft JhengHei", serif; overflow: hidden; user-select: none; -webkit-tap-highlight-color: transparent; }

        /* 換頁黑幕 */
        #page-curtain { position: fixed; inset: 0; background: #000; z-index: 999999; pointer-events: none; transition: opacity 0.8s ease-in-out; opacity: 1; }

        /* 左右對稱：高級玻璃金框導航按鈕 */
        .top-nav-btn {
            position: absolute; top: 20px; 
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(212,175,55,0.6);
            color: var(--gold);
            padding: 8px 16px; border-radius: 25px; font-size: 0.85rem; font-weight: bold; letter-spacing: 1px; 
            display: flex; align-items: center; gap: 6px; z-index: 100; cursor: pointer; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.8), inset 0 0 10px rgba(212,175,55,0.15); 
            backdrop-filter: blur(10px); transition: 0.3s;
        }
        .top-nav-btn:active { transform: scale(0.95); background: rgba(212,175,55,0.25); border-color: var(--solid-gold); box-shadow: 0 0 20px rgba(212,175,55,0.5); }
        
        #back-btn { left: 20px; }
        #huayan-btn { right: 20px; }
        .mini-earth { width: 16px; height: 16px; filter: drop-shadow(0 0 4px rgba(243,229,171,0.5)); }

        /* ======= 法輪本體 ======= */
        #wheel-container { position: relative; width: 340px; height: 340px; cursor: pointer; filter: drop-shadow(0 0 15px rgba(212,175,55,0.25)); transition: filter 0.3s ease, opacity 1s, transform 1s; }
        #wheel-container:active { filter: drop-shadow(0 0 35px rgba(243,229,171,0.7)); }
        #dharma-wheel { width: 100%; height: 100%; transform-origin: center; transition: transform 2.8s cubic-bezier(0.1, 0.9, 0.2, 1); will-change: transform; }
        .spinning-glow { animation: wheel-glow 2.8s ease-out; }
        @keyframes wheel-glow { 0% { filter: drop-shadow(0 0 70px var(--solid-gold)) brightness(1.2); } 100% { filter: drop-shadow(0 0 15px rgba(212,175,55,0.25)); brightness(1); } }

        /* ======= 文字引導區 ======= */
        #instruction-text { margin-top: 40px; font-size: 1.15rem; color: var(--gold); letter-spacing: 5px; text-align: center; height: 65px; transition: opacity 0.5s; text-shadow: 0 0 10px rgba(212,175,55,0.5); }
        .sub-text { font-size: 0.85rem; color: var(--cyan); letter-spacing: 2px; margin-top: 8px; opacity: 0.8; }

        /* ======= 結果區排版 ======= */
        #result-layout { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 94%; max-width: 420px; display: flex; align-items: stretch; justify-content: center; gap: 12px; opacity: 0; pointer-events: none; transition: opacity 1.5s ease; z-index: 100; }
        #result-layout.show { opacity: 1; pointer-events: auto; }

        /* 金剛能量法棒 */
        #energy-bar-wrap { height: 320px; width: 75px; position: relative; display: flex; justify-content: center; flex-shrink: 0; }
        .floating-score { position: absolute; left: 62px; color: #fff; font-size: 0.85rem; font-weight: bold; letter-spacing: 1px; text-shadow: 0 0 10px var(--solid-gold); transition: top 2s cubic-bezier(0.2, 0.8, 0.2, 1), color 1s; white-space: nowrap; }

        /* 心理學籤詩卡片 */
        #hwkins-card { flex: 1; min-width: 0; background: rgba(8,8,8,0.96); border-radius: 16px; padding: 25px 15px; text-align: center; box-shadow: 0 0 50px rgba(0,0,0,0.9), inset 0 0 20px rgba(0,0,0,0.8); display: flex; flex-direction: column; align-items: center; justify-content: center; transition: all 1s; max-height: 80vh; overflow-y: auto; scrollbar-width: none; }
        .hwkins-title { font-size: clamp(1rem, 4vw, 1.15rem); letter-spacing: 3px; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 10px; width: 100%; font-weight: bold; }
        .hwkins-desc { color: #ddd; font-size: clamp(0.85rem, 3.5vw, 0.95rem); line-height: 1.6; text-align: justify; margin-bottom: 15px; word-wrap: break-word; }
        .hwkins-action { font-weight: bold; letter-spacing: 1px; font-size: clamp(0.85rem, 3.5vw, 0.9rem); padding: 12px 10px; background: rgba(255,255,255,0.05); border-radius: 8px; width: 100%; text-align: left; word-wrap: break-word; }
        
        #close-btn { margin-top: 15px; padding: 10px 25px; background: transparent; border: 1px solid var(--cyan); color: var(--cyan); border-radius: 25px; cursor: pointer; letter-spacing: 3px; font-size: 0.85rem; transition: 0.3s; flex-shrink: 0; }
        #close-btn:active { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }

        /* 擋客法語 */
        #wheel-blocked-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: var(--gold); font-size: 1.2rem; letter-spacing: 4px; line-height: 2.5; text-align: center; opacity: 0; transition: 1.5s; text-shadow: 0 0 15px var(--solid-gold); pointer-events: none; display: none; }

        /* 碎片動畫層 */
        #fragment-theater { position: fixed; inset: 0; background: #000; z-index: 99999; display: none; justify-content: center; align-items: center; opacity: 0; transition: opacity 1s ease; pointer-events: none; }
        .frag-zen-text { position: absolute; top: 50%; width: 100%; text-align: center; color: var(--gold); font-size: 1.3rem; letter-spacing: 6px; opacity: 0; transition: opacity 3s; text-shadow: 0 0 20px var(--solid-gold); transform: translateY(-50%); }
        .f-bodhi { position: absolute; width: 12px; height: 12px; background: var(--gold); border-radius: 50%; opacity: 0; transform: scale(0.5); }
        .f-ring { position: absolute; width: 40vmin; height: 40vmin; border-radius: 50%; border: 2px solid rgba(243,229,171,0.8); box-shadow: 0 0 75px rgba(212,175,55,0.7), inset 0 0 45px rgba(212,175,55,0.5); opacity: 0; transform: scale(0.5); }
        .f-pillar { position: absolute; width: 6px; height: 50vmin; background: linear-gradient(to top, rgba(255,255,255,0.6) 0%, rgba(212,175,55,1) 40%, rgba(100,50,0,0.9) 100%); box-shadow: 0 0 50px var(--solid-gold); opacity: 0; transform: scale(0.5); }
    </style>
</head>
<body>

    <div id="page-curtain"></div>

    <div id="back-btn" class="top-nav-btn" onclick="navigateTo('index_jp.html?screen=3')">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        弥陀システムへ戻る
    </div>

    <div id="huayan-btn" class="top-nav-btn" onclick="navigateTo('huayan_jp.html')">
        華蔵世界へ行く
        <svg class="mini-earth" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="earth-glow" cx="30%" cy="30%" r="70%"><stop offset="0%" stop-color="#f3e5ab" stop-opacity="0.6"/><stop offset="100%" stop-color="#000000" stop-opacity="0.8"/></radialGradient>
                <linearGradient id="earth-lines" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#f3e5ab"/><stop offset="100%" stop-color="#d4af37"/></linearGradient>
            </defs>
            <circle cx="12" cy="12" r="10" fill="url(#earth-glow)" stroke="url(#earth-lines)" stroke-width="1.5"/>
            <ellipse cx="12" cy="12" rx="4.5" ry="10" fill="none" stroke="url(#earth-lines)" stroke-width="1" opacity="0.75" transform="rotate(30 12 12)"/>
            <ellipse cx="12" cy="12" rx="10" ry="4.5" fill="none" stroke="url(#earth-lines)" stroke-width="1" opacity="0.75" transform="rotate(-30 12 12)"/>
        </svg>
    </div>

    <div id="wheel-container" onclick="triggerSpin()">
        <svg id="dharma-wheel" viewBox="0 0 280 280" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" stop-color="#f3e5ab" /><stop offset="50%" stop-color="#d4af37" /><stop offset="100%" stop-color="#b8860b" />
                </linearGradient>
                <pattern id="petal-pattern" patternUnits="userSpaceOnUse" width="12" height="24">
                    <path d="M 6 0 C 10 6, 10 18, 6 24 C 2 18, 2 6, 6 0 Z" fill="none" stroke="rgba(243,229,171,0.4)" stroke-width="0.5"/>
                </pattern>
            </defs>
            <circle cx="140" cy="140" r="130" fill="rgba(212,175,55,0.02)" />
            <g id="spokes-layer" transform="translate(140,140)"></g>
            <circle cx="140" cy="140" r="110" fill="none" stroke="url(#gold-grad)" stroke-width="5" />
            <circle cx="140" cy="140" r="98" fill="none" stroke="rgba(212,175,55,0.5)" stroke-width="1.5" />
            <g id="outer-bumps" transform="translate(140,140)"></g>
            <circle cx="140" cy="140" r="34" fill="var(--bg-deep)" stroke="url(#gold-grad)" stroke-width="4" />
            <g id="center-mandala" transform="translate(140,140)"></g>
            <circle cx="140" cy="140" r="12" fill="url(#gold-grad)" />
        </svg>
    </div>

    <div id="instruction-text">
        <div id="main-text">法輪に触れて ‧ 調波を起動</div>
        <div id="sub-text" class="sub-text">無明と不善を打ち砕き、一触で念を転ずる</div>
    </div>

    <div id="wheel-blocked-msg">本日の法界の機縁は満ちました<br>菩提心は恒常にして不滅です<br>行者は当処に安住し、明日また起動してください</div>

    <div id="result-layout">
        <div id="energy-bar-wrap">
            <svg viewBox="0 0 60 320" style="width:100%; height:100%; filter: drop-shadow(0 0 10px rgba(212,175,55,0.2));">
                <path d="M 15 285 Q 30 310 45 285 L 38 270 L 22 270 Z" fill="url(#gold-grad)" />
                <path d="M 22 270 Q 30 260 38 270 Z" fill="#020202" />
                <path d="M 15 35 Q 30 10 45 35 L 38 50 L 22 50 Z" fill="url(#gold-grad)" />
                <path d="M 22 50 Q 30 60 38 50 Z" fill="#020202" />
                <rect x="25" y="50" width="10" height="220" fill="rgba(255,255,255,0.05)" stroke="rgba(212,175,55,0.3)" stroke-width="0.5" rx="2" />
                <rect id="bar-fill" x="26" y="269" width="8" height="0" fill="rgba(160,40,40,0.9)" rx="1" style="transition: all 2s cubic-bezier(0.2, 0.8, 0.2, 1);" />
            </svg>
            <div id="float-score" class="floating-score" style="top: 260px;">0 Hz</div>
        </div>

        <div id="hwkins-card">
            <div class="hwkins-title" id="hc-title">本日の法界観照</div>
            <div class="hwkins-desc" id="hc-desc"></div>
            <div class="hwkins-action" id="hc-action"></div>
            <button id="close-btn" onclick="resetWheel()">心念を収める</button>
        </div>
    </div>

    <div id="fragment-theater">
        <div id="f-bodhi" class="f-bodhi"></div>
        <div id="f-ring" class="f-ring"></div>
        <div id="f-pillar" class="f-pillar"></div>
        <div id="f-text" class="frag-zen-text"></div>
    </div>

    <script>
        // 資料庫初始化
        const MAIN_DB_KEY = 'PX_JP_V15.0'; 
        let db;
        try { 
            db = JSON.parse(localStorage.getItem(MAIN_DB_KEY)); 
        } catch(e) {}
        
        if (!db || typeof db !== 'object') {
            db = { points: 0, puxianData: null }; 
        }
        if (db.hwkinsEnergyTotal === undefined) db.hwkinsEnergyTotal = 0;
        if (db.dailyWheelCount === undefined) db.dailyWheelCount = 0;
        if (db.lastWheelDate === undefined) db.lastWheelDate = "";
        
        function save() { localStorage.setItem(MAIN_DB_KEY, JSON.stringify(db)); }

        let todayStr = new Date().toDateString();

        const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
        
        window.onload = () => {
            document.getElementById('page-curtain').style.opacity = '0';
            buildWheelSVG();
            checkDailyStatus();
        };

        function navigateTo(url) {
            document.getElementById('page-curtain').style.opacity = '1';
            setTimeout(() => { window.location.href = url; }, 800);
        }

        function checkDailyStatus() {
            const today = new Date().toLocaleDateString();
            if (db.lastWheelDate !== today) {
                db.dailyWheelCount = 0; db.lastWheelDate = today; save();
            }
            if (db.dailyWheelCount >= 1) {
                document.getElementById('wheel-container').style.display = 'none';
                document.getElementById('instruction-text').style.display = 'none';
                document.getElementById('wheel-blocked-msg').style.display = 'block';
                setTimeout(()=> { document.getElementById('wheel-blocked-msg').style.opacity = '1'; }, 100);
            }
        }

        let audioCtx;
        function initAudio() {
            if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if(audioCtx.state === 'suspended') audioCtx.resume();
        }
        function playTick() {
            if(!audioCtx) return;
            let osc = audioCtx.createOscillator(); let gain = audioCtx.createGain();
            osc.type = 'triangle'; osc.frequency.setValueAtTime(120, audioCtx.currentTime); 
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.08);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }

        function buildWheelSVG() {
            const svgNS = "http://www.w3.org/2000/svg";
            const spokesG = document.getElementById('spokes-layer'); spokesG.innerHTML="";
            for(let i=0; i<8; i++) {
                const g = document.createElementNS(svgNS, "g"); g.setAttribute("transform", `rotate(${(360/8)*i})`);
                const beam = document.createElementNS(svgNS, "rect"); beam.setAttribute("x", "-7"); beam.setAttribute("y", "-110"); beam.setAttribute("width", "14"); beam.setAttribute("height", "76"); beam.setAttribute("fill", "url(#gold-grad)"); beam.setAttribute("rx", "3"); 
                const pattern = document.createElementNS(svgNS, "rect"); pattern.setAttribute("x", "-7"); pattern.setAttribute("y", "-110"); pattern.setAttribute("width", "14"); pattern.setAttribute("height", "76"); pattern.setAttribute("fill", "url(#petal-pattern)");
                g.appendChild(beam); g.appendChild(pattern); spokesG.appendChild(g);
            }
            const bumpsG = document.getElementById('outer-bumps'); bumpsG.innerHTML="";
            for(let i=0; i<8; i++) {
                const g = document.createElementNS(svgNS, "g"); g.setAttribute("transform", `rotate(${(360/8)*i}) translate(0, -110)`);
                const orn = document.createElementNS(svgNS, "path"); orn.setAttribute("fill", "url(#gold-grad)");
                if(i % 2 === 0) orn.setAttribute("d", "M -18,0 C -18,-8 -12,-10 -8,-7 C -5,-16 5,-16 8,-7 C 12,-10 18,-8 18,0 Z"); else orn.setAttribute("d", "M -14,0 C -14,-10 -6,-15 0,-16 C 6,-15 14,-10 14,0 Z");
                g.appendChild(orn); bumpsG.appendChild(g);
            }
            const centerG = document.getElementById('center-mandala'); centerG.innerHTML="";
            for(let j=0; j<8; j++) {
                const path = document.createElementNS(svgNS, "path"); path.setAttribute("d", `M0 -26 C 13 -17.8, 13 7.8, 0 26 C -13 7.8, -13 -17.8, 0 -26`);
                path.setAttribute("transform", `rotate(${(360/8)*j})`); path.setAttribute("stroke", "rgba(212,175,55,0.7)"); path.setAttribute("fill", "rgba(243,229,171,0.15)"); centerG.appendChild(path);
            }
        }

        // 霍金斯能量 x 法界觀照資料庫 (共 80條 - 日文版)
        const hwkinsDB = [
            // ==========================================
            // 【第一階：0 - 200 Hz】 
            // ==========================================
            { 
                min: 0, max: 200, color: "rgba(160, 40, 40, 0.9)", border: "#ff4d4d", 
                contents: [
                    { desc: "法界の鏡が微かな波動を映し出しています。今日、ある瞬間に潜在意識から気づきにくい焦りや不安が湧き上がるかもしれません。その境界に遭遇した時こそ、絶好の覚察の契機となります。", action: "【本日の処方】感情が湧き上がりそうになったら、深呼吸を3回し、5秒遅らせて口を開いてみてください。他人を許すことで、自分自身を許す機会を得るかもしれません。" },
                    { desc: "システムはあなたの心波がわずかなストレスを抱えていることを捉えています。脳は「まだ起きていない」未来に対して恐れを抱き、それが無意識のうちに生命の動力を消耗させているのかもしれません。", action: "【本日の処方】焦りを感じた時、意識をそっと「足元の一歩」に引き戻してみてください。今目の前で行っている小さなことだけに集中できるか試してみましょう。" },
                    { desc: "今日、あなたの潜在意識には外界の物事に対する比較や不平が潜んでいるかもしれません。法界から見れば、それは一時的に清明さを覆い隠す虚妄の雲にすぎません。", action: "【本日の処方】「自分が現在持っている、感謝すべき」小さな物事を一つ心の中で見つけてみてください。心をそこに定着させれば、雲は自然と晴れるでしょう。" },
                    { desc: "法界の鏡が微かに瞬き、今日の心場が周囲と摩擦を起こしやすいことを知らせています。些細なことがあなたの内なる防衛機制を刺激するかもしれません。", action: "【本日の処方】今日、不快な人や事柄に出会ったら、心の中で仏号を三回唱え、温かいお湯を一杯飲み、一時的にその場を離れてみてください。悪縁を結ぶのを防げるかもしれません。" },
                    { desc: "今日のあなたは、精神的または肉体的に少し疲れや無力感を感じているかもしれません。無理に支えようとすると、かえって心波を継続的に低下させてしまう可能性があります。", action: "【本日の処方】今日は「一時的に何もしない」ことを自分に許可してください。隙間時間を見つけて10分間目を閉じ、その10分間を純粋に手放す時間としてみましょう。" },
                    { desc: "エネルギーメーターは、あなたが今日、過去の遺恨や過ちに対して後悔の念を抱いていることを示しています。この目に見えない重荷が、あなたの周波数を下へと引きずり込んでいるのかもしれません。", action: "【本日の処方】鏡の中の自分に向かって「許してみようと思う」と声をかけてみてください。過去の心は得ることができません。この瞬間から新たな選択をすればよいのです。" },
                    { desc: "あなたの周波数には、他人をコントロールしようとする欲求や過度な期待が混ざっているようです。求めても得られないことが、苦しみの源泉になっているのかもしれません。", action: "【本日の処方】今日は「干渉しない」練習をしてみてください。他人のやり方が自分と違うのを見た時、手を出さずに静かに観察し、どう変化するかを見守ってみましょう。" },
                    { desc: "システムは隠れた悔しさを検知しました。自分は多くを捧げたのに、期待した見返りや評価が得られていないと感じているのかもしれません。", action: "【本日の処方】達磨大師は「無功徳」と説かれました。今日の行いを当然の 本分と見なし、見返りへの期待を手放してみてください。心はより自由になるでしょう。" },       
                    { desc: "システムは、今日のあなたの身体や呼吸にわずかな緊張があることを観察しています。これは潜在意識が未知の変化に抵抗しているサインかもしれません。", action: "【本日の処方】2分間だけ時間をとり、頭から足先まで自分の身体をスキャンしてみてください。緊張している部分を見つけたら、そこにそっと呼吸を送り込むことで和らぐかもしれません。" },
                    { desc: "法界の鏡は、あなたの周波数に「欠乏感」が潜んでいることを示しています。これは時間、お金、あるいは愛が永遠に足りないという錯覚を生み出しやすい状態です。", action: "【本日の処方】今日、友人の長所を心から褒めてみてください。褒め言葉を「与える」ことで、内なる欠乏の錯覚を打ち破ることができるかもしれません。" },
                    { desc: "今日のあなたの心念は、過去のある記憶を繰り返し反芻しがちなようです。これによりエネルギーが過去に留まり、今ここに流れ込めなくなっている可能性があります。", action: "【本日の処方】手を洗う時や入浴時に、清らかな水流がこれらの古い念を洗い流していると観想してみてください。水が流れると共に、執着も流れ去るかもしれません。" },
                    { desc: "今日のあなたは、大量の情報や外界の騒音に対して心が乱れやすく感じるかもしれません。これはシステムが「メモリが満杯に近づいている」と警告している状態です。", action: "【本日の処方】可能であれば、1時間だけスマートフォンのネットワークをオフにしてみてください。純粋な「情報の断食」を行うことで、心波がリセットされるかもしれません。" },
                    { desc: "あなたの周波数には「被害者」としての悔しさが湧き上がっており、環境や他人が自分に不公平だと感じているのかもしれません。", action: "【本日の処方】意識を「なぜ彼は私にこんなことをするのか」から「私は今、自分のために何ができるか」へ移してみてください。選択権を取り戻せば、力も戻ってくるでしょう。" },
                    { desc: "法界の微光が瞬き、今日のあなたが自分自身に対して厳しい批判や不満を抱きやすい状態であることを示しています。この自責の念は、無意識のうちに霊光を消耗させています。", action: "【本日の処方】傷ついた子供に接するように、自分自身に接してみてください。「完璧ではなくても、今の自分を受け入れてみよう」と自分に語りかけてみましょう。" },
                    { desc: "今日のあなたは警戒心が強く、他人の何気ない言葉を攻撃として受け取りやすい状態にあるようです。", action: "【本日の処方】反論や弁解をする前に、心の中で3秒数えてみてください。この3秒の空白が、それが悪意のない投影にすぎないことを見極める助けになるかもしれません。" },
                    { desc: "システムは先延ばしや逃避のエネルギーをわずかに検知しました。やるべき事を前にして、重圧や無力感を感じているのかもしれません。", action: "【本日の処方】自分に「5分だけやろう」と言い聞かせてみてください。取り掛かるハードルを下げれば、最初の一歩を踏み出すだけで重圧感は消え去るかもしれません。" },
                    { desc: "あなたの周波数は「白か黒か」という二元対立に陥っているようです。正しいか間違っているかという思考は、あなたを孤立無援に感じさせる可能性があります。", action: "【本日の処方】今日は物事の「グレーゾーン」を探してみてください。対立の裏にある苦衷を見つめることで、張り詰めた心場が少し緩むかもしれません。" },
                    { desc: "今日のあなたは、周囲から無視されていると感じているかもしれません。この喪失感は、外側に承認を求める習性から生じている可能性があります。", action: "【本日の処方】自分自身の点灯人になってみてください。今日、自分だけのために小さくても楽しいこと（例えば好きなお菓子を食べるなど）をし、外界の評価に依存するのをやめてみましょう。" },
                    { desc: "今日のあなたの心は「自分が正しいことを証明したい」という執念に陥りやすいようです。これは見えない壁を作り、善縁の流れを妨げる可能性があります。", action: "【本日の処方】もし今日誰かと意見が対立したら、心の中で「彼にも彼の理屈があるのかもしれない」と考えてみてください。そっと身を引くことで、視界が広がるかもしれません。" },
                    { desc: "今日のあなたの意識の周縁には、言葉にできない喪失感が彷徨っているようです。これは、コントロールできない人や物事への微細な執着から生じている可能性があります。", action: "【本日の処方】両手をそっと腹部に当て、深く長い呼吸を3回感じてみてください。すべてをコントロールできないと認めることこそが、力を取り戻す始まりかもしれません。" },
                    { desc: "システムの微光が瞬き、あなたの今の心念が未知への不安に引っ張られていることを反映しています。脳はまだ起きていないシナリオのためにエネルギーを消耗しているようです。", action: "【本日の処方】恐れが湧き上がるのに気づいたら、心の中で「これは今起きていることだろうか？」と静かに問いかけてみてください。念を当処に引き戻すことで、焦りの回路を断ち切れるかもしれません。" },
                    { desc: "あなたのエネルギー場には、自己不信の重苦しさが漂っているようです。これは過去の挫折が、潜在意識の中で密かに再生されているからかもしれません。", action: "【本日の処方】心の中で、その挫折した自分に向かって「あの時、あなたは最善を尽くしたよ」と声をかけてみてください。少しの自己理解が、深い自責を溶かすかもしれません。" },
                    { desc: "法界の鏡は、あなたの周波数に周囲の環境への軽い抵抗が潜んでいることを示しています。この不満が、見えないところであなたの生命力を縛り付けている可能性があります。", action: "【本日の処方】今日、思い通りにならない状況に遭遇したら、まずは急いでそれを変えようとしないでください。ただその「不快感」を静かに観察し、それが身体にどれくらい留まるかを見つめてみましょう。" },
                    { desc: "今日のあなたの心場は、他人のネガティブな感情と共鳴しやすくなっているようです。これにより、理由のわからない疲労感や煩躁感を感じるかもしれません。", action: "【本日の処方】心の中で見えない境界線を引いてみてください。「それは彼の課題であり、私のものではない」と自分に言い聞かせることで、交わったエネルギー場が再び清明さを取り戻すでしょう。" },
                    { desc: "システムは、未来に対する焦燥感をわずかに検知しました。時間が足りない、あるいは進捗が期待通りでないと感じ、無意識に心拍数が上がっている可能性があります。", action: "【本日の処方】歩く時も食べる時も、意識してペースを落としてみてください。「すべてには最も適したタイミングがあるのかもしれない」と自分に語りかけましょう。" },
                    { desc: "今日、あなたの潜在意識に微かな嫉妬や比較の心が芽生えているかもしれません。これは、認められたいという人間性の渇望の投影です。", action: "【本日の処方】比較の心を引き起こした相手に対し、心の中でそっと祝福を送ってみてください。対立を随喜に変えることで、縮こまっていた心輪が再び広がるかもしれません。" },
                    { desc: "あなたの周波数は、抜け出しにくい無力感に陥っているようです。複雑な物事を前にして、前進する動力を一時的に見失っているのかもしれません。", action: "【本日の処方】今日は「最も小さく、かつ必要な」事だけを一つ行うことを自分に許可してください。極めて小さな行動を完了させるだけで、エネルギーの流れが再起動するかもしれません。" },
                    { desc: "法界のエネルギー流は、あなたが失われた関係や機会に対して密かに心を痛めていることを示しています。手放すことを拒むと、心の空間が窮屈になってしまいます。", action: "【本日の処方】両手で砂を強く握りしめ、そしてゆっくりと指を開いていく様子を想像してみてください。手を放して初めて、新たな因縁を迎える空間ができるのかもしれません。" },
                    { desc: "今日のあなたは、他人の言葉に対して防衛的な反応を示しやすいようです。これは内なる癒やされていない脆弱な部分に起因している可能性があります。", action: "【本日の処方】反論したい衝動が湧き上がったら、まず唾を一口飲み込んでみてください。自分に2秒間の空白を与えることで、防衛の裏にある虚弱さを見つめることができるかもしれません。" },
                    { desc: "システムは、あなたの心念が「不完璧」に対して厳しい批判を行っていることを観察しています。この苛立ちは、あなたの清浄心を消耗させています。", action: "【本日の処方】今日は物事の中に「欠落の美」を探してみてください。その微小な不完璧さこそが、娑婆世界の真実を構成しているのかもしれません。" },
                    { desc: "あなたの周波数には、抑圧された怒りが漂っているようです。これは何度も妥協を重ねた結果、内なる真実の声が聴き入れられなかったことへの抗議かもしれません。", action: "【本日の処方】誰もいない空間を見つけ、軽くため息をつくか、またはその感情を紙に書いてから破り捨ててみてください。エネルギーに出口を与えれば、自身に跳ね返ることはないでしょう。" },
                    { desc: "法界の鏡は、今日のあなたが何らかの責任に対して異常なほどの重圧を感じていることを映し出しています。その圧迫感が、呼吸の軽やかさを忘れさせているのかもしれません。", action: "【本日の処方】肩を上にすくめ、3秒間緊張させてから完全に下ろしてみてください。身体の緊張を解くことで、心にも「重荷は一時的に下ろしてもよい」と伝えることができるかもしれません。" },
                    { desc: "あなたの心場は「理解されない」という孤独感に包まれているようです。外側に共鳴を求めても得られず、その喪失感が深まっている可能性があります。", action: "【本日の処方】あなた自身にとって最も忠実な聞き手になってみてください。心の中で「あなたの辛さはわかっているよ」と自分に言い聞かせてみましょう。自己の理解は、外界の千の言葉に勝るかもしれません。" },
                    { desc: "今日のあなたのエネルギーは、停滞した混沌状態にあるようです。苦痛ではないものの喜びもなく、まるで霧の中に閉じ込められているかのようです。", action: "【本日の処方】冷たい水で顔を洗うか、少し温かい白湯を一杯飲んでみてください。最も純粋な物理的感覚の刺激が、眠っている覚知を呼び覚ますかもしれません。" },
                    { desc: "システムは微弱な報復心や不満を検知しました。これは不公平な扱いを受けた後、自己防衛機制が反発している状態です。", action: "【本日の処方】馴染みのある法語や格言を一つ思い出してみてください。意識をより高次元の智慧に移すことで、この低周波の絡み合いを解消できるかもしれません。" },
                    { desc: "今日のあなたの周波数は、過去の遺恨に引っ張られやすいようです。「あの時もし…」という念が、今ここにある力を削いでいる可能性があります。", action: "【本日の処方】何もない空間に向かって「過去はもう過ぎ去った」と静かに呟いてみてください。幻影への執着を断ち切ることで、エネルギーを今この瞬間に引き戻すことができるでしょう。" },
                    { desc: "法界の微光は、あなたが自己限定の枠に囚われている可能性を示しています。「私にはできない」「私には価値がない」というのは、錯覚にすぎないかもしれません。", action: "【本日の処方】今日は、普段はしない小さなことを一つやってみてください。例えば帰る道順を変えるなどです。微小な習慣を打破することで、内なる死結が解けるかもしれません。" },
                    { desc: "あなたの心念は、間もなく訪れる結果に対して一喜一憂しているようです。結果に過度に注目すると、過程が苦痛に満ちたものになってしまいます。", action: "【本日の処方】「人事を尽くして天命を待つ」と自分に言い聞かせてみてください。目の前の一歩一歩に集中すれば、結果は自然と形になるのかもしれません。" },
                    { desc: "今日のあなたは、周囲の音に対して特に敏感になり、煩わしさを感じやすいようです。これは内なるメモリが雑念で満杯になっているという警告です。", action: "【本日の処方】人の声が入っていない純粋な音楽をヘッドホンで聴くか、10分間の絶対的な静寂を楽しんでみてください。心に少しの余白を与えることで、弾力性が回復するかもしれません。" },
                    { desc: "システムは、あなたの周波数に他人を喜ばせようとする傾向が潜んでいることを観察しています。他人の目を過度に気にすると、自分自身の重心を失ってしまいます。", action: "【本日の処方】今日何かを決断する時、まず「これは私が本当に望んでいることか？」と自問してみてください。自分の感情を第一に置くことは、決して利己的ではありません。" },
                    { desc: "あなたのエネルギー場には、冷淡さや疎外感が漂っているようです。これは傷つくのを避けるために、外界との繋がりを一時的に閉じているからかもしれません。", action: "【本日の処方】温かいお茶のカップや毛布など、温度のある物に触れてみてください。微小な温もりを通じて、内なる防護壁がゆっくりと溶けていくかもしれません。" },
                    { desc: "法界の鏡は、あなたが他人の過ちのために自分を罰している可能性を反映しています。他人に代わって受けているその重苦しさは、あなたのものではないのかもしれません。", action: "【本日の処方】心の中で静かにその責任を相手に返してみてください。「これはあなたの課題だから、あなたに返します」と。属さない重荷を下ろせば、心はとても軽くなるでしょう。" },
                    { desc: "今日、あなたの潜在意識には「奪われた」という感覚が芽生えているようです。得るべきものを得ていないと感じ、それが密かな憤りを引き起こしている可能性があります。", action: "【本日の処方】周囲を見渡し、努力しなくてもすでに持っているもの（空気や太陽の光など）を一つ見つけてみてください。これらの無償の存在に感謝することで、欠乏感を転換できるかもしれません。" },
                    { desc: "あなたの心念は固執した盲点に陥り、何度も堂々巡りをして出口が見つからない状態のようです。これは視点が単一になりすぎているためかもしれません。", action: "【本日の処方】現在の困難を、第三者の視点から見つめ直してみてください。賢者ならこの事柄をどう見るか想像してみましょう。距離を置くことで新たな洞察が得られるかもしれません。" },
                    { desc: "システムは隠れた悲しみを検知しました。この悲しみには明確な理由はなく、魂がある瞬間に娑婆の無常を感じ取っただけなのかもしれません。", action: "【本日の処方】その悲しみが存在することを許し、急いで追い払おうとしないでください。静かに自分に寄り添い、この感情が流れ去った後には、より深い平静が残るかもしれません。" },
                    { desc: "今日のあなたの周波数は、未知の変化に対して抵抗を感じやすいようです。現状維持という安全感を求めることが、生命の自然な流れを妨げている可能性があります。", action: "【本日の処方】「私は未知の可能性に向かって心を開く」と自分に言ってみてください。確実性への執着を手放して初めて、法界の計らいが見えてくるのかもしれません。" },
                    { desc: "法界のエネルギー流は、あなたが過度に分析的な状態にあることを示しています。頭脳ですべての問題を解決しようとすると、心がオーバーヒートしてしまいます。", action: "【本日の処方】思考を手放し、皿洗いや掃除などの反復的な作業に意識を向けてみてください。身体を動かすことで、頭脳を休ませることができるかもしれません。" },
                    { desc: "あなたの心場は、目に見えない羞恥心に縛られているようです。自分のどこかが不十分だと感じることは、光が入り込むのを阻む壁となります。", action: "【本日の処方】「今この瞬間の自分は、これでいいのだ」と受け入れてみてください。隠そうとするのをやめ、全面的に受け入れることこそが、真の癒やしの始まりかもしれません。" },
                    { desc: "今日のあなたのエネルギーは外側に向かって極度に発散しており、収めるのが難しい状態のようです。これにより、一日が終わる頃には異常な疲労を感じるかもしれません。", action: "【本日の処方】目を閉じて、自分が一本の木になり、根を地中深くに張っている姿を想像してみてください。観想を通じて心神を収めることで、内なる定海神針を取り戻せるかもしれません。" },
                    { desc: "あなたのエネルギー場は少し散漫で冷淡に見えます。これは通常、生活に対する情熱を一時的に失っているか、過度な消耗の後に生じる自己防衛機制です。", action: "【本日の処方】少し自然に触れてみてください。葉っぱに触れたり、空を見上げたり、あるいは自分のために温かいお茶を淹れたりしてみましょう。微小な感覚体験が覚知を呼び覚ますかもしれません。" },
                    { desc: "システムの微光が瞬き、今のあなたが少しの煩躁感や停滞感に包まれていることを示しています。この時、大悟を無理に求める必要はなく、微小な物理的変化だけで十分です。", action: "【本日の処方】鏡の前に立ち、自分に向かって3秒間だけ微笑んでみてください。少し無理をしてでも顔の筋肉を動かすという微小な動作が、強張った心場を緩めるかもしれません。" },
                    { desc: "あなたの周波数には、物質やお金に対する微かな焦りが漂っているようです。欠乏感は往々にして、与えることを恐れるところから生じます。", action: "【本日の処方】今日もし買い物をしたら、電子レシートを慈善団体に寄付するか、少額の寄付をしてみてください。全く負担にならない微小な布施を通じて、自分が豊かであることを潜在意識に宣言しましょう。" },
                    { desc: "法界のエネルギー流は、あなたの身体が潜在意識の緊張を抱え込み、呼吸が浅くなっていることを示しています。", action: "【本日の処方】手元の作業を一旦置き、温かい白湯をゆっくりと一杯飲んでみてください。温水が食道を通って胃に入る過程を感じ、純粋な物理的温もりで内側を安撫しましょう。" },
                    { desc: "今日のあなたは、周囲の環境の乱れに対して少しイライラしているかもしれません。外側のエントロピーの増大は、往々にして内側の周波数にも影響を与えます。", action: "【本日の処方】床に落ちている紙くずを拾うか、机の上の定位置にない物を一つ片付けてみてください。微小な秩序の再構築が、不思議なほどの平穏をもたらすでしょう。" },
                    { desc: "あなたの心念は、繰り返されるネガティブなループに陥っているようです。脳は起きない出来事を予行演習するために無駄なエネルギーを消耗しています。", action: "【本日の処方】深呼吸をし、両手で3秒間強く拳を握りしめ、その後完全に力を抜いてみてください。見えない焦りを筋肉の張力という形あるものに変換し、そして解放しましょう。" },
                    { desc: "システムは、先延ばしによる微細な罪悪感を検知しました。やるべき事に対する重苦しい感覚が、行動の開始を阻んでいます。", action: "【本日の処方】「1分間」だけ整理整頓をしてみてください。例えばお皿を1枚だけ洗う、メッセージを1通だけ返すなど。静止摩擦力を打ち破れば、エネルギーは自然と流れ始めます。" },
                    { desc: "今日のあなたの周波数は、他人の欠点を拡大して見やすい状態のようです。これは自身の疲労を反映する鏡です。", action: "【本日の処方】今日は意識的に「良い言葉」を探して口に出してみてください。店員に「ありがとう、助かりました」と褒めるだけでも、その言葉はまずあなた自身の聴覚を温めるでしょう。" },
                    { desc: "法界の鏡は、あなたの肩や首が無意識のうちに防衛状態にあることを反映しています。これは目に見えない圧力に抵抗している状態です。", action: "【本日の処方】自分の両肩を軽く3回叩き、「お疲れ様、今はもう安全だよ」と自分に伝えてみてください。身体の武装を解除すれば、心も呼吸ができるようになります。" },
                    { desc: "今日のあなたの意識は少し散漫になっており、意味のないデジタル情報の中で迷子になりやすく、エネルギーが流出しています。", action: "【本日の処方】画面を閉じ、窓際か屋外に出て、空を30秒間見上げてみてください。視線を近くの仮想現実から遠くの真実へと移し、脳波をリセットしましょう。" },
                    { desc: "あなたのエネルギー場には、過去への少しの後悔が漂っているようです。この結び目は、非常に軽微な転念で解くことができます。", action: "【本日の処方】不要な紙を取り出し、その気になる後悔を書き留めてから、静かに丸めてゴミ箱に捨ててください。「手放す」という動作を具象化してみましょう。" },
                    { desc: "システムは、あなたが自身に対する柔軟性を少し欠いていることを観察しています。過度な自己要求が、周波数を硬く折れやすいものにしています。", action: "【本日の処方】手を洗う時、動作をゆっくりにして、水流が肌を滑る感触を味わってみてください。この日常の動作を、微小な浄化の儀式と捉えてみましょう。" },
                    { desc: "今日のあなたの心場は、未解決の些細な事柄に軽く干渉されており、背景のノイズのようにシステムリソースを消耗しているようです。", action: "【本日の処方】極めてシンプルなリストを書き出し、今日「絶対に完了しなければならない」事を一つだけ書き出してください。注意力を一点に収束させることで、ノイズは自然と弱まります。" },
                    { desc: "法界の微光が瞬き、あなたがすれ違った人や事柄に対して微細な反感を抱いていることを示しています。", action: "【本日の処方】心の中で、その相手も疲労し、悩みを持つ普通の人だと想像してみてください。共に娑婆に生きる无奈（むない）さを見ることで、反感は平淡へと変わるかもしれません。" },
                    { desc: "あなたの周波数には、閉じ込められているような感覚が潜んでいます。物理的な空間の制限か、思考の死角かもしれません。", action: "【本日の処方】窓を開けるか、座席の角度を少し調整してみてください。新鮮な空気や新しい視点を取り入れ、物理的な膠着状態を打ち破りましょう。" },
                    { desc: "今日のあなたは、自分が孤立無援の状態にあり、周囲との繋がりが希薄になっていると感じているかもしれません。", action: "【本日の処方】植物の葉に触れるか、木製の家具の木目にそっと触れてみてください。自然の材質と微細な接触を持つことで、大地との繋がりを再構築することができます。" },
                    { desc: "システムは潜在的な焦燥感をわずかに検知しました。足早になり、呼吸が浅くなっており、何かの目標に向かって急いでいるのかもしれません。", action: "【本日の処方】次の10歩は、意識して足取りを遅くし、足の裏が地面に触れる重みを感じてみてください。注意力を「目的地」から「今歩いている」この両足に引き戻しましょう。" },
                    { desc: "あなたのエネルギーは少し停滞しており、流れのない死水のようになっています。活力を取り戻すには、少しの外部からの撹乱が必要です。", action: "【本日の処方】大きく伸びをして、軽くため息をついてみてください。身体が伸びたがる本能を抑圧せず、濁った空気をため息と共に排出しましょう。" },
                    { desc: "法界の鏡は、今日のあなたの心念が「私には価値がない」という低周波の振動に留まりやすいことを示しています。", action: "【本日の処方】「時間通りに起きた」や「しっかり食事をとった」など、今日すでに無事に完了した小さなことを一つ思い出してみてください。最も基本的な生存の努力を認めてあげましょう。" },
                    { desc: "今日のあなたの周波数は音に対して特に敏感で、環境音を内なるイライラに変換しやすいようです。", action: "【本日の処方】目を閉じて、環境の中で最も遠く、最も微弱な音を探すことに集中してみてください。騒音への抵抗から主動的な傾聴へと切り替えることで、周波数は変化します。" },
                    { desc: "システムは、あなたの心場が防衛的な収縮状態にあり、微細な不確実性を拒絶していることを観察しています。", action: "【本日の処方】利き手ではない手（右利きなら左手）でドアを開けたりコップを持ったりしてみてください。この不器用な微細な変化を通じて、潜在意識の絶対的な支配欲を打ち破りましょう。" },
                    { desc: "システムは隠微な疲労感をわずかに検知しました。意識が目の前の悩みに集中しすぎると、エネルギーが停滞しやすくなります。", action: "【本日の処方】5分間だけ「絶対に何も考えない」時間を作ってみてください。座り心地の良い椅子に座り、何も考えず、何もしない、無為の状態を自分に許可しましょう。" },
                    { desc: "あなたの周波数には、名状しがたい重苦しさが蓄積しているようです。これは日常の些事による無形のエントロピー増大かもしれません。", action: "【本日の処方】自分のために温かいお茶やコーヒーを淹れてみてください。お湯が沸き、湯気が立ち上るのを待つ過程で、心念をそのシンプルな静寂の中に置いてみましょう。" },
                    { desc: "法界の鏡は、今日のあなたの思考が絡まった毛糸のようであり、理路整然とさせようとするほどにかえって緊張が高まることを示しています。", action: "【本日の処方】顔を洗うか、温水で両手を洗ってみてください。水流が皮膚表面の微細な埃を持ち去るのを感じながら、水が脳内のノイズも洗い流すと観想しましょう。" },
                    { desc: "今日のあなたのエネルギー場は、環境の乱れに対して敏感になっているようです。外在的な無秩序は、内なる微細な焦りを引き起こしやすくなります。", action: "【本日の処方】引き出し一つ、机の上の一部など、家の中の極小のエリアを整理してみてください。外在的な物理空間の秩序を再構築することで、内面の安定を取り戻しましょう。" },
                    { desc: "潜在意識の中に、昨日の小さな出来事への後悔が残っており、この未消化の感情があなたの周波数を引きずり下ろしているようです。", action: "【本日の処方】一枚の紙を取り出し、その気になる小さな事を書き留め、そして静かにその紙を破り捨ててください。「手放す」という動作を具象化しましょう。" },
                    { desc: "あなたの身体は無意識のうちに何らかの防衛姿勢を保っており、それが呼吸を浅く、制限されたものにしているようです。", action: "【本日の処方】立ち上がり、深く大きな伸びをして、深く息を吐き出してみてください。身体を伸ばすことで、滞っていたエネルギーを再び流動させましょう。" },
                    { desc: "今日のあなたは、生活に新鮮な活水が欠けており、すべてが少し単調でつまらないと感じているかもしれません。", action: "【本日の処方】一番柔らかくて着心地の良い部屋着に着替えてみてください。布地と肌の触覚を変えることで、身体に微小で確実な慰めを与えましょう。" },
                    { desc: "システムは、あなたの心念が未来への懸念に留まりやすく、脳が未発生の困難を予行演習するためにエネルギーを消耗していることを観察しています。", action: "【本日の処方】注意力を「咀嚼」に向けてみてください。今日の食事の一口一口を、20回以上噛んでみましょう。意識を当処の味覚に完全に収束させてください。" },
                    { desc: "あなたの周波数には、邪魔されることへの不耐性が潜んでおり、完全に自分だけの清浄な場所を渇望しているようです。", action: "【本日の処方】30分間だけスマートフォンのネットワーク接続をオフにしてみてください。誰にも邪魔されない真空の時間を自分に与え、外界の情報の無駄な消耗を遮断しましょう。" },
                    { desc: "法界の微光が瞬き、あなたが自分の小さなミスに対して不満を抱いていることを示しています。", action: "【本日の処方】鏡の前に歩み寄り、自分の目を見つめて、心の中で「大丈夫、これでもう十分だよ」と静かに言ってみてください。自分自身に最も基本的な寛容を与えましょう。" },
                    { desc: "今日のあなたのエネルギーは少し内側に退縮しているようです。これは脳が休眠を必要としていることを宣言する自然な保護機制です。", action: "【本日の処方】可能であれば、目を閉じて10分間仮眠をとってみてください。目を閉じて休むだけでも、視覚の過度な入力を遮断し、周波数をゆっくりと回復させることができます。" },
                    { desc: "システムは隠れた欠乏感をわずかに検知しました。時間、精神、または物質など、何かが足りないと感じているようです。", action: "【本日の処方】周囲を見渡し、「現在持っていて実用的な」物を3つ（座り心地の良い椅子、使いやすいコップなど）見つけ、心の中でその「持っている」という確かな感覚を確認してください。" },
                    { desc: "あなたの心場は、ネガティブな精神のBGMに干渉されており、不愉快な記憶が繰り返し再生されている可能性があります。", action: "【本日の処方】最も穏やかで歌詞のない軽音楽、または自然のホワイトノイズを再生してみてください。高周波の音波で低周波のノイズを上書きしましょう。" },
                    { desc: "今日のあなたは、周囲の人や事柄を過剰に解釈する傾向があり、中立的な出来事を自分に向けられたものと見なすことがあるようです。", action: "【本日の処方】心の中で「これはすべて私とは無関係かもしれない」と呟いてみてください。一歩下がり、自分を出来事の中心から切り離し、単なる傍観者になってみましょう。" },
                    { desc: "あなたの周波数には、元の計画や考えを簡単には変えたくないという硬直した頑固さが漂っているようです。", action: "【本日の処方】今日は意識的に、無害な小さな習慣を一つ破ってみてください。例えば水を飲むコップを変えたり、座る椅子を変えたりして、微小な変化で硬直を緩めましょう。" },
                    { desc: "法界のエネルギー流は、あなたが「事態が過ぎ去るのを待つ」という苦しみの中にいる可能性を示しています。", action: "【本日の処方】両手を擦り合わせて温め、それを両目や首の後ろにそっと当ててみてください。手のひらの温度を通じて焦る神経を安撫し、すべては過ぎ去ると自分に言い聞かせましょう。" },
                    { desc: "あなたの心念は、コントロールできない現状に対して無力感を感じており、その抵抗があなたの霊光を消耗させているようです。", action: "【本日の処方】コントロール可能な微小な物事に注意を向けてみてください。シーツを平らに伸ばす、靴を揃えるなど、小さなところで主導権を取り戻しましょう。" },
                    { desc: "今日のあなたは、自分がこの世界から少し切り離されていると感じ、言葉にしがたい孤立感を生んでいるかもしれません。", action: "【本日の処方】窓際に行き、外の木や雲を観察してみてください。あなたがその木や雲と、同じ空と空気を共有していることを意識してみましょう。" },
                    { desc: "システムは、あなたの身体が座りっぱなしや姿勢の悪さにより、局所的な不快感や低周波を蓄積していることを観察しています。", action: "【本日の処方】3分間の簡単なストレッチを行うか、首や手首を軽く回してみてください。関節に溜まった濁気を解放してあげましょう。" },
                    { desc: "あなたの周波数には、現状から逃避したいという衝動が潜んでいるようです。", action: "【本日の処方】その衝動に抗わないでください。今日は一時的に「それほど努力しない」人になることを自分に許可しましょう。自分の低迷を受け入れることが、往々にして反発の始うためだけに。" }
                ]
            },
            

            { 
                min: 201, max: 400, color: "rgba(210, 120, 30, 0.9)", border: "#ffa64d", 
                contents: [
                    { desc: "法界の鏡は、今日のあなたの心場が非常に開かれており、万物を受け入れる勇気と柔軟性を示す絶好の機会であることを映し出しています。エネルギーは負から正へと転じ、生機を醸成しているのかもしれません。", action: "【本日の処方】今日は自ら進んで、見返りを求めずに誰かを助けるか、周囲の人を心から褒めてみてください。そのポジティブな動力が伝播していくでしょう。" },                    
                    { desc: "法界の鏡は、今日あなたが非常に優れた「学習と吸収」の能力を持っていることを示しています。空の杯のような心構えが、あなたの周波数を着実に上昇させています。", action: "【本日の処方】今日は今まで触れたことのない法語や知識を読んでみてください。心を開いておけば、思いがけない霊感が閃くかもしれません。" },
                    { desc: "あなたの周波数には、「身を低くする」という柔和さが漂っているようです。この柔軟性が、不必要な衝突を避ける助けとなるでしょう。", action: "【本日の処方】今日、自分の意見を押し通したくなる状況に遭遇したら、「あなたの提案も素晴らしいですね、試してみましょう」と言ってみてください。一歩引くことの広大さを味わいましょう。" },
                    { desc: "今日のあなたは、周囲の喧騒を客観的な視点で見つめることができるようです。この「執着しない」理性は、非常に貴重な心の防壁となります。", action: "【本日の処方】この清明さを保ち続けてください。誰かが感情のゴミを押し付けてきても、ただの聞き手となり、相手の負のエネルギーを吸収せず、急いでアドバイスをしないよう心がけましょう。" },
                    { desc: "システムは、あなたが長年抱えていた問題に対して、新たな受容の心を持ち始めていることを検知しました。抵抗しないことこそが、転換の始まりなのかもしれません。", action: "【本日の処方】その悩ましい問題に向かって微笑みかけてみてください。「これも私の修行の道場かもしれない」と自分に言い聞かせることで、心が転じ、状況も共に転じるでしょう。" },
                    { desc: "今日のあなたの周波数は、「慈悲の境界線」を築くのに非常に適しています。適度に断ることを知るのも、菩提心を守る一つの方法です。", action: "【本日の処方】今日、誰かから無理な要求をされたら、温和かつ毅然とした態度で自分の境界線を伝えてみてください。他人を愛する前に、まず自分自身を大切にする必要があるのかもしれません。" },
                    { desc: "法界のエネルギー流は、今日あなたに古い誤解を解く契機が訪れる可能性を示しています。理性と勇気の結合が、固い氷を溶かすでしょう。", action: "【本日の処方】心の中でずっと解決したいと思っていた結び目があるなら、今日は温かいメッセージを送る良い機会かもしれません。結果を求めず、ただ心の安寧だけを求めましょう。" },
                    { desc: "今日のあなたの心場は、「微小な美しさを発見する」能力に満ちているようです。この感知力が、平凡な日常を輝かせるのです。", action: "【本日の処方】帰り道に、3つの小さな美しいもの（一輪の花、一つの微笑み、一陣のそよ風）を見つけ、心の中で静かに感謝してみてください。" },
                    { desc: "あなたの周波数には、「随喜」の潜在能力が現れているようです。他人の成功を見て嫉妬しないことは、あなたの心量を急速に拡大させます。", action: "【本日の処方】今日、他人の良い知らせを聞いたら、心の中で「彼がさらに良くなりますように、すべての衆生が安楽を得られますように」と真の祝福を送ってみてください。" },
                    { desc: "システムは、今日あなたが「不完璧さ」に対してより深い寛容を持っていることを示しています。この心の広さが、内なる消耗を大幅に減らします。", action: "【本日の処方】今日、物事が計画通りに進まなかったり、自分が小さなミスをしたりしても、軽く笑って受け流してみてください。欠落の中にも円満な計らいが隠されているのかもしれません。" },
                    { desc: "今日のあなたの行動力が目覚めようとしているようです。ただの空想に留まらず、実践の歩みを踏み出す意志があります。", action: "【本日の処方】複雑な目標を最も簡単な第一歩に分解し、今日中にそれを完了させてみてください。行動することこそが、最良の精神安定剤となるでしょう。" },
                    { desc: "今日のあなたの周波数は、「考えて問題を解決しようとする」柔軟性を醸成しています。かつて困難だと思っていたことも、今日は違った転機を迎えるかもしれません。", action: "【本日の処方】この動力を活かし、長い間保留にしていた小さな問題に今日取り組んでみてください。想像以上にスムーズに進むかもしれません。" },
                    { desc: "法界は、今日のあなたの心念に温かい寛容さが宿っていることを映し出しています。これこそが菩薩の「無縁大慈」の小さな火種かもしれません。", action: "【本日の処方】今日、誰かがあなたに対して悪気のない小さな過ちを犯したら、微笑みでそれを受け流してみてください。あなたの寛容さが、互いの善縁の始まりとなるでしょう。" },
                    { desc: "あなたの周波数は停滞を打破し、「自ら動く」輝きを見せる機会を得ているようです。この力を善きことに使えば、多くの菩提の資糧を蓄積できるかもしれません。", action: "【本日の処方】今日あなたにサービスを提供してくれた人（店員や運転手など）に対し、真心を込めた温かい感謝の言葉を伝えてみてください。その流れるような善意を体験しましょう。" },
                    { desc: "今日のあなたの心場は非常に安定しており、物事を引き受ける力に満ちています。この周波数は、周囲の人々に無意識の安心感を与えるでしょう。", action: "【本日の処方】今日、突発的な仕事や煩雑な家事に直面したら、不平を言わずに向き合ってみてください。これこそが、忍辱と精進を練習するための素晴らしい道場なのかもしれません。" },
                    { desc: "システムは、あなたが目の前の紛争に対して、それに振り回されない冷静さを示していることを検知しました。これは環境に影響されない良好な契機です。", action: "【本日の処方】この傍観者としての清明さを保ち続けてください。他人が焦ってもあなたは焦らず、他人が怒ってもあなたは穏やかでいる。静をもって動を制すことで、思いがけない結果が得られるかもしれません。" },
                    { desc: "今日のあなたの思考ロジックは特に鮮明なようです。これにより、物事の表面的な絡み合いを見抜き、問題の核心に触れることができるでしょう。", action: "【本日の処方】この理性を内観に用いてみてください。感情が湧き上がった時、すぐに発散させるのではなく、それがどこから来てどこへ行くのかを理知的に観察しましょう。" },
                    { desc: "あなたの心念の中に、他人の境遇に対する理解と共感が芽生えているようです。誰もが言葉にできない苦しみを抱えていることに気づき始めているのかもしれません。", action: "【本日の処方】今日、怒りっぽい人に出会ったら、心の中で「彼は今とても苦しいから、こんな態度をとるのだろう」と考えてみてください。そうすることで、慈悲の心を育てることができるでしょう。" },
                    { desc: "今日のあなたは、「期待通りにいかない」ことに対して、より大きな受容力を示しているようです。この無理に求めない心構えこそが、解脱の始まりなのかもしれません。", action: "【本日の処方】自然の流れに任せてみてください。もし今日計画が変更されたら、それを喜んで受け入れ、その突然の空白が何をもたらすかを見つめてみましょう。" },
                    { desc: "法界のエネルギー流は、今日のあなたが物理的な物や心の中の執着を「整理し、手放す」のに非常に適していることを示しています。", action: "【本日の処方】今日、使わなくなった物を一つ整理するか、不要な情報を削除してみてください。外側の空間を空けることで、内側の軽やかさが引き出されるかもしれません。" },
                    { desc: "法界の鏡は、今日のあなたが古い偏見を乗り越える柔軟性を備えていることを示しています。かつて眉をひそめた意見も、今のあなたには少し理にかなって聞こえるかもしれません。", action: "【本日の処方】反対意見を聞いた時、まずは頷いて「そういう可能性もあるね」と言ってみてください。心を開いておけば、思いがけない知恵を得られるかもしれません。" },
                    { desc: "今日のあなたの周波数には、新しいことに挑戦する勇気が含まれているようです。この穏やかな動力が、生活に新鮮な活水をもたらすでしょう。", action: "【本日の処方】今日、小さな習慣を一つ変えてみてください。新しい食べ物を試すか、挨拶の仕方を変えるなどして、微小な変化がもたらす生機を味わいましょう。" },
                    { desc: "システムは、あなたの心念が周囲の人や事柄に対してより多くの信頼を寄せていることを観察しています。このリラックスした状態が、無意識のコントロール欲を減らしているのかもしれません。", action: "【本日の処方】他人と協力する事項があれば、今日は相手のやり方に任せてみてください。信頼の流れが、双方に利益をもたらす結果を生むかもしれません。" },
                    { desc: "今日のあなたのエネルギー場は、着実な建設性を示しているようです。空想に流されず、袖を捲って実際の問題を解決する意志があります。", action: "【本日の処方】この集中力を、保留にしていた些細な事に注いでみてください。それを完了させた瞬間、周波数がさらに安定するのを感じるでしょう。" },
                    { desc: "あなたの心場は、「卑屈にならず、傲慢にもならない」バランスの中にいるようです。自分を貶める必要も、他人を喜ばせる必要もありません。", action: "【本日の処方】この自信を持って他者と交流してみてください。対等な対話を通じて、人と人との最も純粋な繋がりを見ることができるでしょう。" },
                    { desc: "法界の微光は、今日あなたに複雑なものを単純化する直感があることを映し出しています。複雑な表象も、あなたの目には簡単に核心へと分解されるようです。", action: "【本日の処方】複雑な決断に迫られたら、まず3分間目を閉じて心を静めてください。枝葉末節を切り捨てれば、最初に浮かんだ答えが最も適切なものとなるでしょう。" },
                    { desc: "今日のあなたの周波数は、自己対話に非常に適しています。内なる声がいつもより鮮明で、温和な理性を帯びているかもしれません。", action: "【本日の処方】少し時間をとって、最近の感情やインスピレーションを書き留めてみてください。これらの言葉が、将来迷った時の重要な指針となるかもしれません。" },
                    { desc: "システムは、あなたが過去のある経験に対して新たな解釈を生み出していることを検知しました。かつてのつまずき石が、今日は踏み台になっているのかもしれません。", action: "【本日の処方】心の中で、その経験に対して感謝の意を伝えてみてください。視点の転換こそが、業力を願力に変える鍵となります。" },
                    { desc: "あなたの心念の中に、物事を「ありのままに観照する」客観性が芽生えているようです。急いで良し悪しのレッテルを貼らない、この中立性は非常に貴重です。", action: "【本日の処方】今日どんな知らせを聞いても、すぐに評価を下さないようにしてみてください。情報を心の中で少し沈殿させることで、より全体的な実相が見えてくるかもしれません。" },
                    { desc: "今日のあなたは、人生の通りすがりの人や変数に対して、より多くの安らぎを得ているようです。縁の集散を、比較的穏やかな心で受け止められるようになり始めています。", action: "【本日の処方】すでに去っていった人や物事に対し、心の中で静かに祝福を送ってみてください。無理に引き留めないことで、心境はさらに広大になるでしょう。" },
                    { desc: "法界のエネルギー流は、今日のあなたが平凡な日常から少しのユーモアや趣を抽出できることを示しています。これは心量が拡大している兆候です。", action: "【本日の処方】歩いている時や通勤中に、通行人の表情や雲の形を観察してみてください。平凡の中に非凡を発見することが、あなたの周波数を継続的に高めるでしょう。" },
                    { desc: "あなたの周波数には、責任を引き受ける意志という重厚さが漂っているようです。これは強いられた圧力ではなく、成熟した選択です。", action: "【本日の処方】この落ち着きを持って、身近な焦っている人を安撫してみてください。あなたの存在そのものが、周囲の環境の安定装置となるかもしれません。" },
                    { desc: "今日のあなたの心場は比較的澄み切っており、脅威を感じることなく他人の長所を見ることができます。他人を評価できるこの能力は、素晴らしいポジティブな循環を生み出します。", action: "【本日の処方】同僚や家族の長所を具体的に褒めてみてください。言葉を通じてその評価を表現することで、互いの善縁が強化されるかもしれません。" },
                    { desc: "システムは、あなたが「未知」に対する態度を恐怖から好奇心へと転換させていることを観察しています。この心構えの変化が、新しい次元を開くかもしれません。", action: "【本日の処方】今日、馴染みのない分野や知識に出会ったら、探求心を持って少しだけでも理解しようとしてみてください。それが未来の何かの契機の種となるでしょう。" },
                    { desc: "今日のあなたのエネルギーは、コミュニケーションと調整に非常に適しているようです。あなたの口調には、自然と安撫と説得の力が備わっているかもしれません。", action: "【本日の処方】協議すべき事項があるなら、今日は良いタイミングかもしれません。誠意と柔軟性を持って表現することで、円滑に合意に達することができるでしょう。" },
                    { desc: "法界の鏡は、あなたが自分自身に対してより深い寛容を持っていることを反映しています。たまにはミスをしても良いと許す、その柔らかさが内なる消耗を大幅に減らします。", action: "【本日の処方】今日、些細な事で少し失敗してしまったら、自分自身にユーモアのある微笑みを向けてみてください。ミスを重く受け止めすぎない方が、かえって早く修正できるかもしれません。" },
                    { desc: "あなたの周波数には、「許す意志」という空間が潜んでいるようです。これは他人を許すだけでなく、過去の自分を許すことも含まれているかもしれません。", action: "【本日の処方】心の中で、長年絡み合っていた結び目をそっと解いてみてください。「私の平穏のために、手放すことを選ぶ」と自分に言い聞かせてみましょう。許しは自分への贈り物です。" },
                    { desc: "今日のあなたの心念は、終着点を急いで見渡すことなく、現在のステップに安住できているようです。この一歩一歩の着実さは、非常に優れた定力です。", action: "【本日の処方】目の前で行っている仕事に完全に注意を集中させてみてください。プロセス自体を楽しむことで、結果を焦るよりも効率が良くなるかもしれません。" },
                    { desc: "システムは、あなたが世俗の損得に対して、微小な疎外感を持っていることを検知しました。この深入りしすぎない心構えが、進退に適切な度合いをもたらします。", action: "【本日の処方】今日何か利益を得たり、失ったりしても、平常心を保つよう心がけてみてください。すべてを法界の流転と見なすことで、心はより自由になるでしょう。" },
                    { desc: "あなたの心場に、温和な秩序感が芽生えているようです。雑然とした事柄も、あなたの整理によって徐々に明確な脈絡を見せるようになるでしょう。", action: "【本日の処方】デスクやパソコンのデスクトップを実際に整理してみてください。外的な空間の秩序が、内的な周波数にさらなる良いフィードバックをもたらすかもしれません。" },
                    { desc: "法界のエネルギー流は、今日のあなたが非常に優れた共感の基盤を持っていることを示しています。他人の言葉を聞き取るだけでなく、言外の音も理解できているようです。", action: "【本日の処方】誰かがあなたに悩みを打ち明けてきたら、視線での肯定を多くし、指導は少なくしてみてください。時には、完全な傾聴こそが最高の癒やしとなります。" },
                    { desc: "今日のあなたの周波数は、善願を起こすのに非常に適しているようです。微小な思い立ちが、法界にポジティブな波紋を生み出すかもしれません。", action: "【本日の処方】外出する前に、心の中で静かに「今日の私の言動が、他人に煩悩をもたらしませんように」と発願してみてください。この善なる護念が、一日中あなたを守ってくれるでしょう。" },
                    { desc: "今日のあなたは、「待つ」ことに対してより多くの忍耐を持っているようです。時間の経過に焦ることなく、そのプロセスの中に安然と留まることができます。", action: "【本日の処方】渋滞や行列に遭遇したら、スマートフォンを見ずに、ただ静かに周囲を感じてみてください。待つことを休息と捉えることで、周波数は安定した状態を保てるでしょう。" },
                    { desc: "システムは、あなたの心念から打算が少し減り、随順の心が少し増していることを観察しています。損をすることに対しても、それほど重く受け止めていないのかもしれません。", action: "【本日の処方】今日、少しの譲歩が必要な場面に遭遇したら、それを喜んで受け入れてみてください。無害な小さな損をすることで、心の広大さを得ることができるでしょう。" },
                    { desc: "あなたの周波数は、ある種の「感謝の基盤」と共鳴しているようです。平凡で平穏な日々そのものが、一種の福報であることに気づき始めているのかもしれません。", action: "【本日の処方】寝る前に今日の三食を振り返り、あなたの温かい食事を静かに支えてくれた無名の因縁に感謝してみてください。この心念が、あなたの福徳を育むでしょう。" },
                    { desc: "法界の鏡は、今日のあなたがネガティブな言葉を中立的な情報に変換する能力を持っていることを映し出しています。他人の愚痴が、あなたの心に痕跡を残しにくくなっています。", action: "【本日の処方】この情報をフィルタリングする清明さを保ち続けてください。水を吸わないスポンジのように、他人の感情を流し去り、自身のプレッシャーとして内面化しないようにしましょう。" },
                    { desc: "今日のあなたのエネルギーは、新鮮な学習意欲を帯びているようです。異なる分野の知識に対しても、謙虚に教えを乞う態度を持っているかもしれません。", action: "【本日の処方】身近な異なる年齢層の人に、小さな質問を一つしてみてください。身を低くして交流することで、思いがけない啓発をもたらすかもしれません。" },
                    { desc: "今日のあなたの心場は比較的自立しており、自己価値を支えるために外界の承認に過度に依存する必要がありません。", action: "【本日の処方】一人で何かを完了させるか、一人で食事を楽しんでみてください。一人でいることの中に自給自足の安らぎを味わうことで、周波数をより強固なものにすることができるでしょう。" },
                    { desc: "システムは、あなたが人生の「自然の成り行き」に対してより深い理解を得ていることを検知しました。すべての事柄がシナリオ通りに進むことを強要しなくなっています。", action: "【本日の処方】今日、予期せぬ変更に対して「はい」と言ってみてください。流れに身を任せることで、法界の計らいが小さな自分の計画よりも巧妙であることに気づくかもしれません。" },
                    { desc: "あなたの周波数には、他人と分かち合うことを厭わない寛大さが含まれているようです。物質的なものであれ経験であれ、あなたは喜んで与えることができるでしょう。", action: "【本日の処方】有益な記事や温かい言葉を、必要としている人にシェアしてみてください。善意の流通が、あなたのエネルギー場をさらに豊かなものにするでしょう。" },
                    { desc: "法界の鏡は、今日のあなたの周波数が非常に安定しており、動力を伴っていることを映し出しています。これは微細な善法の資糧を蓄積する絶好の機会です。", action: "【本日の処方】公共の場所に出入りする際、後ろの人のためにドアを3秒間長く開けておいてみてください。この微不足道な思いやりこそが、日常で実践する菩薩行です。" },
                    { desc: "あなたの心念の中に、与えようとする柔軟性が含まれているようです。この寛大さは必ずしも物質である必要はなく、言葉の布施も同様に強大なエネルギーを持ちます。", action: "【本日の処方】今日、同僚や家族に対して「今日のあなたの対応は素晴らしかった」など、具体的な肯定の言葉をかけてみてください。良い言葉を口にすることは、最も直接的な調波の法具となります。" },
                    { desc: "今日のあなたのエネルギー場は開かれた状態を示しており、未知の善意に対する良好な送受信能力を持っています。", action: "【本日の処方】機会があれば、あなたにサービスを提供してくれた見知らぬ人（清掃員やバスの運転手など）に軽く会釈して「ありがとう」と伝えてみてください。善意が流通すれば、周波数は自然と上昇します。" },
                    { desc: "システムは、あなたが周囲の環境に対して温和な観察力を持っていることを検知しました。この観察力は、すぐに行動の道場へと転化することができます。", action: "【本日の処方】会議室やトイレなどの空間を離れる際、ついでにテーブルを拭いたり、椅子を揃えたりしてみてください。あなたの存在によって、環境をより良くしましょう。" },
                    { desc: "あなたの周波数には、鮮明な理性と包容力が漂っています。異なる意見に直面しても、あなたにはより多くの旋回する余地があるようです。", action: "【本日の処方】今日議論に参加する際は、まず相手の話を完全に聞き終え、2秒間ポーズを置いてから応答してみてください。この2秒の余白は、修養であり、智慧でもあります。" },
                    { desc: "法界の微光は、今日あなたが微小な障害を自ら進んで解消する動力を備えていることを示しています。他人が解決するのを待つのではなく、自ら袖を捲る意志があります。", action: "【本日の処方】オフィスの植物に水をやる、コピー用紙を補充するなど、誰もが面倒がるけれども簡単な些事を処理してみてください。人知れず黙々と引き受けましょう。" },
                    { desc: "今日のあなたの心場は、資源を大切にする心で満ちているようです。この福を惜しむ心念は、宇宙の豊かさの法則と共鳴することができます。", action: "【本日の処方】今日、微細な省エネを一度実践してみてください。不必要な電気を消すか、水を節約するなど。法界の資源を大切にすることは、自身の福徳を育むことになります。" },
                    { desc: "システムは、あなたの周波数が「他人の成就を助けたい」という善良な状態にあることを観察しています。", action: "【本日の処方】インターネットで有益な記事や動画を見た際、惜しみなく「いいね」を押すか、ポジティブなコメントを残してみてください。随喜し賛嘆することは、心量を急速に拡大させます。" },
                    { desc: "今日のあなたは、秩序感に対する温和な要求を持っているようです。外側の雑然さを整理することは、内側の論理を強固にするのに役立ちます。", action: "【本日の処方】財布の中のレシートや領収書をきれいに整理してみてください。クラウド上のシステムをお持ちであれば、レシートを一つ弱者支援団体に寄付する設定をするのも良いでしょう。財を理めることは心を理めることでもあります。" },
                    { desc: "あなたのエネルギー場には、見返りを求めない軽やかさが漂っています。これは無相の微細な布施を行うのに非常に適しています。", action: "【本日の処方】道を歩いている時、邪魔になる石や木の枝を見つけたら、後から来る人がつまずかないように、ついでに道の端に寄せてみてください。無言の善を行えば、心は自然と坦蕩になります。" },
                    { desc: "法界の鏡は、あなたが時間の経過に対して以前ほど焦りを感じなくなり、余裕と待つための忍耐力が増していることを反映しています。", action: "【本日の処方】今日、レジの列やバス待ちの際、あなたより急いでいる人に自ら順番を譲ってみてください。あなたの時間の余裕を、焦っている人に布施しましょう。" },
                    { desc: "今日のあなたの心念は、物事の明るい面をよく見ることができるようです。このポジティブな解釈能力は、境界を転換する鍵となります。", action: "【本日の処方】普段習慣として使っているネガティブな言葉を一つ置き換えてみてください。例えば「これは面倒だ」を「これは少し忍耐が必要だ」に変えるなど。言葉が変われば、心境も即座に転換します。" },
                    { desc: "システムは、あなたが良好な境界線と共感能力を備えていることを検知しました。自分を守りながら、他人を思いやることもできます。", action: "【本日の処方】今日、誰かからセールスや要求を受けたら、最も温和かつ毅然とした口調で断ってみてください。焦りを見せる必要はなく、ただ冷静に立場を述べるだけで十分です。" },
                    { desc: "あなたの周波数には「和合」の力が芽生えているようです。あなたは周囲の雰囲気の調和剤となることができるでしょう。", action: "【本日の処方】身近で二人が小さな口論をしていたら、ユーモアや中立的な言葉で軽く受け流し、焦点をずらしてみてください。争いを解消することこそが、浄土を創造することです。" },
                    { desc: "今日のあなたの意識は、物理的な世界との繋がりにさらに深い理解を持ち、自らの手で創造や修復を行おうとする意志があるようです。", action: "【本日の処方】自分や家族のために簡単な食事を自らの手で準備するか、何かを洗ってみてください。動作に集中力と善意を注ぎ込むことで、物も高い周波数で応えてくれるでしょう。" },
                    { desc: "法界のエネルギー流は、今日のあなたの学習力と開放性が非常に優れていることを示しています。この謙虚さが、あなたをスポンジのように法益を吸収させます。", action: "【本日の処方】身近な人に、あなたの知らない些細な事を尋ね、心からお礼を言ってみてください。身を低くして学ぶことで、自己の境界線はさらに柔らかくなるでしょう。" },
                    { desc: "あなたの心場には安定した集中力があり、もはや外界の雑音に簡単に引きずられることはないようです。", action: "【本日の処方】今日は一定の時間、スマートフォンの通知を一切見ず、目の前の仕事や会話だけに集中する時間を選んでみてください。注意力を最も貴重な贈り物として、今この瞬間に捧げましょう。" },
                    { desc: "システムは、あなたが生命の法則に対して理性的な順従を持っていることを観察しています。小さな挫折に遭遇しても、すぐに心構えを調整することができます。", action: "【本日の処方】今日、うっかり物を壊したり服を汚したりしてしまっても、3秒以内にその事実を受け入れてみてください。不平を言わず、ただ静かに後始末をしましょう。" },
                    { desc: "今日のあなたの周波数は、長期的な善縁を築くのに非常に適しています。目先の利益を求めず、ただ耕すことのみを問います。", action: "【本日の処方】長く連絡を取っていない長老や友人を気遣う、簡単なメッセージを送ってみてください。何の目的もなく、ただ純粋な挨拶と善意として。" },
                    { desc: "法界の鏡は、あなたが自身が所有している物事に対して、確かな感謝の念を抱いていることを映し出しています。", action: "【本日の処方】今日、何かの物品（パソコン、ペン、食器など）を使用する際、動作を少しだけ軽くしてみてください。万物に優しく接すれば、万物もまたあなたに優しく接してくれるでしょう。" },
                    { desc: "法界の鏡は、今日のあなたの心念が非常に安定していることを映し出しています。この余裕は、生活の中の微小な芸術を味わうのに非常に適しています。", action: "【本日の処方】ずっと見たいと思っていた映画を一つ選ぶか、心を静めて良書を数ページ読んでみてください。質の高い作品が、あなたの意識の周波数を養ってくれるでしょう。" },
                    { desc: "あなたのエネルギー場には、尽くし、世話をしようとする優しさが含まれています。この善意が流れれば、極めて良好な共鳴を生み出すでしょう。", action: "【本日の処方】同居している家族、またはたまたま会った親友のために、自ら進んで温かいお水を一杯注ぐか、小さなお菓子を準備してみてください。言葉は不要です、微細な行動で思いやりを伝えましょう。" },
                    { desc: "今日のあなたの周波数は、「清潔さと秩序」に対して自然な憧れを抱いているようです。これこそが、家事を禅の修行へと転換する絶好の機会です。", action: "【本日の処方】「清浄な道場」という心構えで、掃き掃除や拭き掃除をしてみてください。ほうきを振るうたびに、心の中の塵を掃き清めていると観想しましょう。" },
                    { desc: "システムは、あなたが良好な傾聴の空間を備えていることを検知しました。あなたの内面には、他人の声を受け入れる十分な余裕があります。", action: "【本日の処方】今日、家族や友人と話す際は、終始集中してアイコンタクトを保ち、相手の話を絶対に遮らないようにしてみてください。完全な傾聴を与えましょう。" },
                    { desc: "あなたの心場に、「和解」の意志が芽生えているようです。過去の微小な摩擦に対して、もはやそれほど正誤に執着していません。", action: "【本日の処方】かつて小さな誤解があった家族や友人に、自ら進んで簡単な朝の挨拶の画像やメッセージを送ってみてください。最も軽やかな方法で固い氷を溶かしましょう。" },
                    { desc: "法界のエネルギー流は、今日のあなたの直感と美意識が特に鋭敏であることを示しています。平凡な日常の中から、容易に非凡さを捉えることができるでしょう。", action: "【本日の処方】家の近くを散歩する際、普段は気にも留めない美しい一角（特別な窓や、壁際の野花など）を見つけ、心の中でそれを賛嘆してみてください。" },
                    { desc: "今日のあなたの周波数は、日用品の古くなったものを新しくするのに非常に適しています。これも一種の新陳代謝のプロセスです。", action: "【本日の処方】家にある破れた雑巾、期限切れの食品、使わなくなった古い物を適切に処分してみてください。物理的な空間を空けることで、新しい高周波のエネルギーを迎えることもできます。" },
                    { desc: "システムは、あなたが言葉の重みに対してより深い覚知を持っていることを観察しています。適度に口を閉ざすことを知り、適度に褒めることも知っています。", action: "【本日の処方】今日、身近な最も親しい家族に「いつも家をきれいにしてくれてありがとう」など、具体的な感謝の言葉を一つ伝えてみてください。" },
                    { desc: "あなたの周波数には、着実な忍耐力が漂っているようです。反復的な単調な事柄に対しても、もはや煩わしさを感じません。", action: "【本日の処方】服を畳むことや皿洗いを、集中力のトレーニングと見なしてみてください。衣類の触感を感じ、水流の温度を感じ、急いで終わらせようとせず、プロセスだけを楽しみましょう。" },
                    { desc: "今日のあなたは、「譲歩」に対して新たな理解を得ているようです。一歩引くことは委屈ではなく、かえって世界が広がることを理解しています。", action: "【本日の処方】今日、家族と些細なこと（どのテレビを見るか、何を食べるかなど）で意見が合わなかったら、微笑みながら「いいよ、今日はあなたの言う通りにしよう」と言ってみてください。固執を手放す気軽さを味わいましょう。" },
                    { desc: "法界の鏡は、今日のあなたが植物や大自然と繋がるのに非常に適していることを示しています。緑色の周波数は、あなたの心輪を大きく安定させるでしょう。", action: "【本日の処方】家の鉢植えに水をやり、葉っぱをそっと拭いてみてください。鉢植えがない場合は、公園に行って木の幹に触れ、大地の安定した周波数を感じてみましょう。" },
                    { desc: "あなたのエネルギー場には、「執着しない」爽やかさがあるようです。他人が感情のゴミを捨ててきても、聞いてすぐ忘れることができます。", action: "【本日の処方】この境界線を保ち続けてください。他人の愚痴を聞いた時は、頷いて理解を示すだけで、心の中で共鳴させず、ましてやその感情を自分の空間に持ち帰らないようにしましょう。" },
                    { desc: "今日のあなたの心念は、平穏な生活に対する感謝の念を生み出しているかもしれません。大風も大波もないことこそが、最良の日々です。", action: "【本日の処方】寝る前に、今日起きた平凡で順調だった小さな事を3つ思い出してみてください。この平淡な感謝を、一日を締めくくる最も完璧な終わりにしましょう。" },
                    { desc: "システムは、あなたが自身の健康に対してより温和な覚知を持っていることを検知しました。実際の行動でこの肉体を愛護する意志があります。", action: "【本日の処方】今夜は熱いお風呂にゆっくり浸かるか、足湯をしてみてください。湯気の中で、今日一日あちこち走り回ってくれた両足に感謝しましょう。" },
                    { desc: "あなたの周波数は、ある種の規則正しい秩序感を確立するようあなたを導いているようです。これは心に極めて大きな安全感を与えます。", action: "【本日の処方】5分早めに明日の準備をしてみてください。明日着る服を出しておく、鍵を定位置に置くなど。微小な事前準備が、長期的な安定をもたらします。" },
                    { desc: "法界の微光が瞬き、あなたは「分かち合う」ことに対して悦びを感じているようです。美しいものを独占しないことは、周波数を高める近道です。", action: "【本日の処方】心地よい純粋な音楽や、知恵に満ちた法語を、それを必要としていると思われる友人にシェアしてみてください。" },
                    { desc: "今日のあなたの意識は、自己の視点から抜け出し、他人の立場に立って問題を考えることができるようです。", action: "【本日の処方】今日家族の機嫌が悪かったら、「どうしたの？」と尋ねるのではなく、彼がやるはずだった家事を黙って引き受け、無言のサポートを与えてみてください。" },
                    { desc: "システムは、あなたのお金と資源に対する態度がより透き通ったものになっていることを観察しています。流通こそが豊かさの本質であることを理解しています。", action: "【本日の処方】家に集まった小銭をコンビニの募金箱に入れるか、余っている使える物資を寄付してみてください。停滞している資源を再び流動させましょう。" },
                    { desc: "今日のあなたは、生活の中の「空白」に対して良好な受容力を持っているようです。無意味な忙しさで時間を埋める必要がなくなっています。", action: "【本日の処方】自分に「計画のない午後」を設けてみてください。どこへ行くか、何をするかをあらかじめ決めず、その瞬間の最も直接的な心意に従って行動してみましょう。" },
                    { desc: "あなたの心場に、安定した自愛の力が存在しているようです。外的な承認を必要とせずとも、自らの価値を確認することができます。", action: "【本日の処方】今日は自分のために花を買うか、少しだけ贅沢な夕食を準備してみてください。何かの記念日のためではなく、自分が無事に存在していることを祝うためだけに。" }
                ]
            },
            { 
                min: 401, max: 600, color: "rgba(40, 140, 160, 0.9)", border: "#4dd2ff", 
                contents: [
                    { desc: "今日あなたの心波は、法界の「清浄」と共鳴するための極めて広大な空間を持っているようです。多くの事物がより心地よく見え、内側に喜びが流れていることに気づくかもしれません。", action: "【本日の処方】この静けさに執着しないよう心がけてください。寝る前に「わだかまりのある人」を静かに思い浮かべ、彼もこの平穏を得られるよう願ってみてください。一念の回向が、法界そのものとなるかもしれません。" },                    
                    { desc: "法界の鏡は、今日のあなたの周波数が「施受同体」の菩薩道と微妙な共鳴をしていることを示しています。他人の苦楽をより感じやすくなっているかもしれません。", action: "【本日の処方】呼吸の間に練習をしてみてください。息を吸う時、衆生の煩悩を吸い込むと観想し、息を吐く時、あなたの平穏と光を彼らに送ると観想しましょう。" },
                    { desc: "今日のあなたのエネルギーは、無条件の善意で満ち溢れているようです。理由を必要としないこの愛こそが、最も強大な防護壁となります。", action: "【本日の処方】この善意を行動に移してみてください。家族に水を一杯用意するか、同僚のためにドアを開けるなど、この高周波のエネルギーを人間関係の中で自然に流動させましょう。" },
                    { desc: "システムは、あなたの心場が極めて祥和な静寂の中にあることを捉えています。言葉は余計なものとなり、ただ存在するだけで美しいと感じられます。", action: "【本日の処方】今日は不必要な会話を減らしてみてください。沈黙の中でこそ、法界の声や内なる智慧がより聞こえてくるかもしれません。" },
                    { desc: "今日のあなたの周波数は、周囲の低周波エネルギーを容易に変換できるようです。あなたはまるで小型の空気清浄機のようであり、どこへ行ってもそこが清浄になります。", action: "【本日の処方】この清浄な心を持って群衆の中へ歩み入ってみてください。意図的に何かをする必要はなく、あなたの安定した存在が、他人が焦りを感じた時の避難港となるかもしれません。" },
                    { desc: "法界の反映は、今日あなたが「神聖さを見る」目を持っているかもしれないことを示しています。最も平凡な衆生の中にも、未来の仏性を見出すことができるようです。", action: "【本日の処方】今日は「諸仏を礼敬する」心構えですべての人に接してみてください。相手の態度がどうであれ、心の中でその人が本来持っている仏性に向かって合掌しましょう。" },
                    { desc: "あなたの心念から「小さな私の成就」への執着が消え去っているようです。事事を成し遂げても、それが「私」の手柄だとは思わなくなっています。", action: "【本日の処方】今日のすべての順調さと成就を、心の中で静かに仏菩薩の加護と衆生の因縁によるものだと帰結させてください。無我こそが、無限なのかもしれません。" },
                    { desc: "今日のあなたの言葉は極めて強い癒やしの力を持っているようです。簡単な一言が、他人の傷を癒やすことができるかもしれません。", action: "【本日の処方】今日は「愛語の布施」を実践してみてください。疲れている身近な人に、心からの励ましの言葉をかけてみましょう。あなたの声が、彼にとっての甘露となるかもしれません。" },
                    { desc: "システムは、あなたが逆境に直面した時、それを迅速に修行の栄養へと昇華させることができることを示しています。火中に蓮を生ずる、非凡な境地です。", action: "【本日の処方】今日、世の中の苦難のニュースを見たら、悲憤を生じさせるのではなく、それを深遠な慈悲観へと転じ、法界の災厄が平息するよう静かに祈願してみてください。" },
                    { desc: "今日のあなたの心境は「随遇而安（状況に随って安んずる）」の高さに達しているようです。喧騒の中にいても、静寂の中にいても、内心は如如として動きません。", action: "【本日の処方】最も騒がしい環境（地下鉄や道路など）の中で、心念の集中を保ってみてください。外の車の往来も、法界のもう一つの梵音にすぎないのかもしれません。" },
                    { desc: "法界のメーターは、あなたの周波数が深い「感謝」と共鳴していることを示しています。これは特定の事物に対する感謝ではなく、「存在」そのものへの賛嘆です。", action: "【本日の処方】今夜寝る前、何も祈求することなく、ただ純粋に虚空法界に向かって「すべてが起こってくれたことに感謝します」と伝えてみてください。" },
                    { desc: "今日、あなたは瑠璃のように清透な周波数を発する可能性が非常に高いです。これを保つことができれば、個人的な損得を少し超越して、万物に対する慈悲の共感を生み出すことができるかもしれません。", action: "【本日の処方】道を歩いていて野良犬や猫、お年寄りや弱者を見かけたら、心の中で静かに彼らのために仏号を数回唱え、輪廻から早く抜け出せるよう願ってあげてください。" },
                    { desc: "法界の反映は、今日のあなたの内面が極めて「順流」であることを示しています。この潜在的な高周波により、外界の順境や逆境に引きずられにくくなっているようです。", action: "【本日の処方】今日、本来なら怒ってしまうような障害に遭遇したら、心の中で微笑んでみてください。それを天から与えられた小テストとみなすことができるかもしれません。" },
                    { desc: "あなたの周波数指標は、無私の階層へと近づいているようです。今日のあなたは、太陽の光のように無条件の善意を示す潜在能力に満ちています。", action: "【本日の処方】このエネルギーを独占しないでください。文字や声を通じて、落ち込んでいる友人を心から褒めたり励ましたりしてみましょう。" },
                    { desc: "これは無漏の功徳を蓄積する絶好の機会かもしれません。今日のあなたの心量は、かつては乗り越えがたいと感じていた多くの人や事柄を包み込むのに十分なようです。", action: "【本日の処方】今夜就寝前、今日のすべての善念と平穏を、苦しんでいるかもしれないすべての衆生に惜しみなく回向してみてください。" },
                    { desc: "あなたの内側から深い満足感が溢れ出ているようです。外に求めず、本来自ら具わっている状態です。理由がなくても安然としていられる状態を体得したのかもしれません。", action: "【本日の処方】この静寂を食事に取り入れてみてください。今日の一食は、スマートフォンを見ず、言葉を発さず、感謝の心を持ち、食べ物の味わいをじっくりと体感してみましょう。" },
                    { desc: "法界のメーターは、あなたの心場が極めて調和のとれた状態にあることを示しています。過去にあなたを悩ませていた人や事柄も、今は逆増上縁となっているのかもしれません。", action: "【本日の処方】今日、心の中で静かに、かつてあなたを傷つけた人に感謝の意を伝えてみてください。この感謝の心念が、悪業の繋がりを断ち切る助けとなるかもしれません。" },
                    { desc: "今日のあなたの直感とインスピレーションは非常に鋭敏になるでしょう。あなたの心という湖には一時的に波風が立っていないため、事物をより鮮明に映し出す機会があるからです。", action: "【本日の処方】決断を下す際は、最初に感じた平静な直感の導きを参考にしてみてください。頭脳で過度に損得を計算しない方が、かえって正しい道を歩めるかもしれません。" },
                    { desc: "一花一世界、一葉一如来。今日、あなたは最も平凡で微小な事物の中に、宇宙の運行の調和と美しさを感じる機会があるでしょう。", action: "【本日の処方】3分間だけ時間を取り、雲の動きや葉脈を観察してみてください。自分自身をこの観察の中に純粋に溶け込ませることができるか試してみましょう。" },
                    { desc: "あなたの周波数は、深い「法喜」と共鳴しているようです。この喜びは物質の獲得から来るものではなく、内なる清明さから来るものかもしれません。", action: "【本日の処方】今日、一度だけ微小な「無相の布施」を行ってみてください。誰にも知られないようにこっそりと良いことをし、その見返りを求めない自在さを味わいましょう。" },
                    { desc: "法界の微光が瞬き、今日のあなたの周波数が深い喜びと共鳴していることを示しています。この喜びは外的な刺激を必要とせず、ただ存在しているだけで美しいと感じられるかもしれません。", action: "【本日の処方】この喜びを心の中だけに留めないでください。すれ違う見知らぬ人に心からの微笑みを送ることで、その人の一日を明るく照らすことができるかもしれません。" },
                    { desc: "あなたの心念は広大な海となり、周囲の雑音や紛争を包み込むことができるようです。すべての動的な変化も、あなたの目には調和のとれた波と映るかもしれません。", action: "【本日の処方】群衆の中で1分間静かに立ち止まってみてください。ただこの広大さを感じるだけで、あなた自身と周囲の世界に何の違いもないことに気づくかもしれません。" },
                    { desc: "システムは、あなたのエネルギー場が温和な癒やしの力を発していることを検知しました。あなたに近づく人は、無意識のうちにリラックスと安心を感じるでしょう。", action: "【本日の処方】もし身近に焦っている人がいたら、言葉を使わず、ただ集中して平静な存在としてその人のそばに寄り添ってみてください。あなたの周波数が最高の慰めとなるかもしれません。" },
                    { desc: "今日のあなたの心場には、因果を見透かす慈悲が芽生えているかもしれません。他人の悪行を見ても、怒りではなく、その背後にある無明への悲哀をより多く感じるようです。", action: "【本日の処方】心の中で、今まさに悪業を造っている人々のために静かに祈願してみてください。彼らが一日も早く善き因縁に出会えますようにと。これこそが菩提心の深層の現れかもしれません。" },
                    { desc: "法界の鏡は、あなたの周波数が対立する評価を超越していることを映し出しています。良いと悪い、美しいと醜いの境界線が、あなたの心の中で曖昧になり、平等になっているのかもしれません。", action: "【本日の処方】普段は「美しくない」と感じる事物を観察してみてください。清浄な心で見ることで、そこに隠された法界の美しさを発見できるかもしれません。" },
                    { desc: "今日のあなたの直感は、宇宙の智慧と深く繋がっているようです。複雑な論理的推論を必要とせず、事物の核心を直接感知できるかもしれません。", action: "【本日の処方】もし迷っている事があるなら、心の中の最も静かな直感を信じてみてください。もしかすると、法界がすでにあなたに方向を示してくれているのかもしれません。" },
                    { desc: "システムは、あなたの心念が無条件の受容で満ちていることを観察しています。自分に対しても世界に対しても、深い「如是（ありのまま）」を感じているのかもしれません。", action: "【本日の処方】自分自身に「すべてはちょうど良い」と優しく語りかけてみてください。この円満さの中に安住することで、周波数は高い次元で安定し続けるでしょう。" },
                    { desc: "今日のあなたのエネルギーは太陽のように、出会うすべての人を平等に照らしているようです。これは分別心のない愛と善意です。", action: "【本日の処方】この平等な善意を、普段は見過ごしがちな微小な命（植物や昆虫など）にも与えてみてください。万物には霊性があり、皆があなたの周波数を感じ取れるのかもしれません。" },
                    { desc: "法界のエネルギー流は、あなたが「自我の融解」という軽やかさを経験しているかもしれないことを示しています。小我の損得の心が一時的に舞台裏へと退いているようです。", action: "【本日の処方】今日の行動において、「私」の存在を隠してみてください。良いことをしたら黙って立ち去り、名前を残さず、三輪体空の法喜を味わいましょう。" },
                    { desc: "あなたの周波数には深い感謝の念が宿っているようです。これは特定の恩恵に対してではなく、広大な宇宙が絶え間なく生み出されることへの賛嘆です。", action: "【本日の処方】1分間、空を見上げてみてください。言葉は必要ありません。ただこの感謝の心で法界と見つめ合うことで、極めて清浄な共鳴が生まれるかもしれません。" },
                    { desc: "今日のあなたの心場は、不動の山のような静定に達しているようです。外界の賞賛や誹謗中傷も、あなたの心に波紋を起こすことはできないかもしれません。", action: "【本日の処方】この「八風吹不動」の覚知を保ち続けてください。日常の会話において、声のトーンを穏やかにゆっくりと保つことで、この静定が自然と現れるでしょう。" },
                    { desc: "システムは、あなたが法界の運行法則に対して深い信服と順応を生み出していることを検知しました。逆流しようとするのではなく、因縁に随順することを選んでいます。", action: "【本日の処方】今日突発的な出来事に遭遇したら、心の中で「これも最高の計らいかもしれない」と考えてみてください。抵抗を放棄すれば、開かれたもう一つの扉が見えるかもしれません。" },
                    { desc: "今日のあなたの周波数は、エネルギーをより大きな集団へ回向するのに非常に適しているようです。あなたの一念の清浄が、周囲の磁場に影響を与えるのに十分かもしれません。", action: "【本日の処方】今夜寝る前、あなたの心から柔らかな光が放たれ、都市全体を覆うのを観想してみてください。すべての有情衆生が、安らぎを得られますように。" },
                    { desc: "法界の鏡は、あなたが万物の間にある見えない繋がりを見出していることを反映しています。あなたは「一即一切、一切即一」を深く体感しているのかもしれません。", action: "【本日の処方】食事の際、その一杯のご飯の背後にある太陽の光、雨水、土壌、そして農家の人々の存在を見てみてください。微小な事物を通じて、法界全体と融け合うことができるかもしれません。" },
                    { desc: "今日のあなたの心念は、生命に対する無限の賛美で満ちているかもしれません。この高周波の喜びは、内なる霊性の目覚めの重要な特徴です。", action: "【本日の処方】歌詞のないメロディーを鼻歌で歌うか、仏号を唱えてみてください。声にこの喜びの周波数を乗せ、虚空へと消散させましょう。" },
                    { desc: "システムは、あなたのエネルギー場が防御を完全に解き放っていることを観察しています。真実の法界において、傷つけられるものなど何もないことを理解したからかもしれません。", action: "【本日の処方】この完全に開かれた心で、他人の苦痛に耳を傾けてみてください。解答を提示する必要はありません、あなたの開放性が相手の悲しみを吸収するかもしれません。" },
                    { desc: "あなたの周波数には、「求めるものがない」という自在さが芽生えているようです。心の隙間を埋めるために、外的な物質や関係を追求することがなくなりました。", action: "【本日の処方】何もしない一人の時間を楽しんでみてください。ただ座り、ただ呼吸する。「何もする必要がないほど円満である」という状態を体験しましょう。" },
                    { desc: "今日のあなたの直感は、苦難の裏に隠された霊的な贈り物を見出すようあなたを導くかもしれません。この洞察力は、煩悩を菩提へと転換させます。", action: "【本日の処方】過去の傷跡を思い出したなら、「この経験は私に何を教えてくれたのだろうか？」と自問してみてください。すべての傷痕が、法界の光の入り口であることに気づくかもしれません。" },
                    { desc: "法界の微光は、今日あなたが他人と容易に同調し、共鳴できることを示しています。これは極めて高次元の共感能力です。", action: "【本日の処方】人と対話する際、言葉に集中するだけでなく、その言葉の背後にある周波数を感じてみてください。言葉を交わさずとも、深い理解を伝えることができるかもしれません。" },
                    { desc: "あなたの心場は、究極の調和状態に入っているようです。内なる男性エネルギーと女性エネルギーが、完璧なバランスに達しているのかもしれません。", action: "【本日の処方】行動する際、理知的な決断力を保ちながらも、柔らかな包容力を持ち合わせてみてください。この剛柔併せ持つ姿勢こそが、世間の法を処理する最も円満な方法かもしれません。" },
                    { desc: "システムは、あなたの生死に対する見方が、ある種の超越的な解放感を生み出していることを検知しました。生命は単なる意識の流転にすぎないと感じ始めているのかもしれません。", action: "【本日の処方】心の中で、過去の先祖や亡くなった親友へ静かに敬意を表してみてください。悲しみを穏やかな祝福に置き換えることで、互いのエネルギーが昇華されるかもしれません。" },
                    { desc: "今日のあなたの周波数は、深い静心や瞑想に非常に適しているようです。無念の清明な状態に容易に入ることができるかもしれません。", action: "【本日の処方】20分間の時間をとり、静かに座ってみてください。いかなる境地も無理に求めず、ただ念が起きたり沈んだりするのを見つめることで、法界の実相を垣間見ることができるかもしれません。" },
                    { desc: "法界の鏡は、あなたが世俗の繁華や誘惑に対してある程度の興味を失っていることを映し出しています。この淡白さは、心智が成熟した自然な結果かもしれません。", action: "【本日の処方】この清らかな好みを維持してみてください。食事や娯楽において最もシンプルな方法を選ぶことで、霊性がさらに大きな空間を得るかもしれません。" },
                    { desc: "今日のあなたの心念には、すべての衆生に対する切実な祈願が芽生えているかもしれません。この願力こそが、あなたが前進し続けるための最強の動力となります。", action: "【本日の処方】この大願を短い言葉（例：衆生が苦から離れ楽を得ますように）に凝縮し、呼吸のたびに静かに繰り返してみてください。願力を生命の鼓動と一つにさせましょう。" },
                    { desc: "あなたのエネルギー場は、周囲の険悪な空気を自動的に解消できるようです。これは、あなたの周波数が高すぎて低周波と共鳴しなくなったからかもしれません。", action: "【本日の処方】衝突が起きている環境に身を置いた時、ただ平静な観察者になってみてください。是非に巻き込まれず、あなたの存在そのものが事態を徐々に鎮静化させるかもしれません。" },
                    { desc: "システムは、あなたの自己価値の肯定が、いかなる外的な成就にも依存しなくなったことを観察しています。自分自身が法界の奇跡であることを理解したのかもしれません。", action: "【本日の処方】鏡の中の自分に向かい、その目を深く見つめてみてください。言葉は必要ありません。ただ、本来清浄であるその魂を見つめてあげましょう。" },
                    { desc: "今日のあなたの周波数には、余裕のある遊戯感覚が漂っているようです。世間の出来事を、リアルなホログラム映像を見ているかのように捉えているのかもしれません。", action: "【本日の処方】このリラックスした心境で、今日の挑戦に向き合ってみてください。真剣にゲームに参加しつつも、心の中ではこれがただの体験であることを理解していれば、すべてがすんなり解決するかもしれません。" },
                    { desc: "法界のエネルギー流は、あなたが深い内面の再構築を経験しているかもしれないことを示しています。古い信念システムが崩壊し、より広大な真理に道を譲ろうとしています。", action: "【本日の処方】この内なる解体のプロセスに抵抗しないようにしてみてください。自分に少しの忍耐と空間を与えれば、繭を破った後のあなたは、全く異なる法界を見るかもしれません。" },
                    { desc: "今日のあなたの心場は、「慈悲喜捨」の四無量心と微妙に一直線に並んでいるようです。あなたの一つ一つの行動から、これら四つの特質が発せられているかもしれません。", action: "【本日の処方】日常生活の中で、自分の行動がこれら四つの心に合致しているか、意識的に検証してみてください。常にここに安住することができれば、そこが人間浄土となるでしょう。" },
                    { desc: "あなたの周波数は、ある種の無声の梵音に触れているようです。この静寂の中で、あなたは法界の最も真実な呼び声を聞くことができるかもしれません。", action: "【本日の処方】この無声の体悟を、あなたが開発している浄土システムに融合させてみてください。一文字一文字、一行一行のコードに、この高周波の静寂と祝福を込めましょう。" },
                    { desc: "法界の微光が瞬き、あなたの心場は無差別の善意を発しています。この周波数は物理的な境界線を容易に超え、他人の魂に触れることができます。", action: "【本日の処方】道を歩いている時、すれ違う最初の見知らぬ人に向かって、心の中で「今日のあなたが平安と喜びの中にありますように」と静かに語りかけてみてください。痕跡を残さず祝福を送りましょう。" },
                    { desc: "あなたの周波数には深い感謝が満ち溢れているようです。この感謝は損得を超越し、存在の状態そのものとなっています。", action: "【本日の処方】食事の前に、食べ物だけでなく、太陽の光、雨水、そしてこの食事を可能にしてくれたすべての無名の因縁にも静かに感謝してみてください。一砂一世界を体感しましょう。" },
                    { desc: "システムは、あなたが生命の中の「雑音」に対して極めて大きな包容力を持っていることを検知しました。普段は耳障りに感じる音も、今は法界のもう一つの振動に聞こえるかもしれません。", action: "【本日の処方】遠くの犬の吠え声や工事の音が聞こえたら、抵抗せず、この土地が呼吸している音だと捉えてみてください。世間の相に随順しましょう。" },
                    { desc: "今日のあなたのエネルギー場は極めて柔らかく、他人の感情を敏感に捉えつつも、それに飲み込まれることはないようです。", action: "【本日の処方】ニュースで苦しんでいる人々を見た時、悲しみの泥沼に沈むのではなく、清浄な一念の祈願へと転化してみてください。「法界の有情が、皆解脱を得られますように」と。" },
                    { desc: "あなたの心念の中に、「無条件の随喜」が芽生えているようです。他人が何かを得るのを見ると、まるで自分が得たかのように喜びを感じます。", action: "【本日の処方】今日、他人の成就や幸福を見たら、心の底から真の賛嘆を送ってみてください。一抹の嫉妬もない随喜は、周波数を瞬時に跳ね上がらせます。" },
                    { desc: "法界の鏡は、今日のあなたの言葉が極めて高い癒やしの力を持つことを映し出しています。大口を叩く必要はありません、最もシンプルな言葉こそが真言です。", action: "【本日の処方】疲れている人に向かって「あなたは本当によく頑張ったね」と一言かけてみてください。理解に満ちたこの優しい言葉が、彼の暗い一日を照らすかもしれません。" },
                    { desc: "今日のあなたの直感は法界の周波数と高度に共鳴しており、事物の表象の対立を容易に見抜き、背後にある統一に触れることができるようです。", action: "【本日の処方】今日選択を迫られたら、複雑な論理的推論を手放し、3秒間心を静め、心の中の最初の平静な直感を信じてみてください。それが法界の導きです。" },
                    { desc: "システムは、あなたが自身の存在に対し、外に求めない満足感を感じていることを観察しています。証明する必要はなく、存在自体が円満なのです。", action: "【本日の処方】一人でお茶を飲む時間を楽しんでみてください。スマートフォンも音楽も不要です。ただ純粋に自分自身と共におり、求めるもののない安らかさを味わいましょう。" },
                    { desc: "あなたの周波数には、万物に対する平等の心が隠されているようです。動物、植物、人類も、あなたの目には等しく尊い命として映ります。", action: "【本日の処方】道端の野良犬や野良猫、虫を見た時、心の中で彼らのために「阿弥陀仏」と一言唱え、未来の清浄な法縁を結んであげてください。" },
                    { desc: "今日のあなたは、平凡なものを神聖なものへと変える魔法の力を持っているようです。日常の些事も、修行の道場となります。", action: "【本日の処方】入浴を浄化の儀式とみなしてみてください。清浄な水流が身体の塵を洗い流すだけでなく、すべての無明と業障をも洗い清めると観想しましょう。" },
                    { desc: "法界のエネルギー流は、あなたの心場が極めて大きな寛恕の中にあることを示しています。過去の傷も、もはやあなたの感情を動かすことはできないようです。", action: "【本日の処方】心の中で円を描き、かつてあなたとわだかまりのあった人たちをその中に入れてみてください。平静な心念で彼らに「私たちはお互いに借りはない」と伝えてみましょう。" },
                    { desc: "あなたの意識は、過去を追憶せず、未来を妄想せず、今この瞬間に容易に安住できるようです。", action: "【本日の処方】歩く時、足の裏と地面の接触に完全に注意を向けてみてください。一歩歩くごとに、大地に清らかな蓮の花を印しているかのように。" },
                    { desc: "システムは、あなたが「与える」ことに対してより深い悟りを得ていることを検知しました。真の与えるとは三輪体空であり、施す者も、受ける者も、施す物も無いことを理解しています。", action: "【本日の処方】電子レシートを自動寄付に設定するか、誰も見ていないところで小銭を入れてみてください。終わったらすぐに忘れ、自己満足の痕跡を一切残さないようにしましょう。" },
                    { desc: "今日のあなたの心念は、名利の虚妄を見破る清明さを生み出しているかもしれません。外界の賞賛や誹謗も、空谷の跫音の如くです。", action: "【本日の処方】今日誰かがあなたを褒めたら、心の中で静かにその賞賛を十方諸仏に回向してみてください。批判されたら、それを業を消すための助縁とみなしましょう。" },
                    { desc: "あなたの周波数には温かい光の束が漂っており、無意識のうちに周囲の警戒や冷淡さを溶かすことができるようです。", action: "【本日の処方】群衆の中で微笑みを保ってみてください。言葉を発さなくても、あなたの安定した温和な表情が、空間全体の磁場を安定させる力となるでしょう。" },
                    { desc: "法界の鏡は、あなたが生命の流転に対して深い畏敬の念と慈悲を持ち、短かい所有に執着しなくなっていることを映し出しています。", action: "【本日の処方】落ち葉が舞い散るのや花が枯れるのを見た時、惜しむ心を起こすのではなく、その無常の美しさを鑑賞してみてください。成住壊空、すべては法界の荘厳です。" },
                    { desc: "今日のあなたのエネルギーは、深い内なる対話を行うのに非常に適しています。その微弱な霊性の声が、今日は特に鮮明に聞こえるでしょう。", action: "【本日の処方】寝る前に3分間静座してみてください。いかなる境地も求めず、ただ静かに心拍の音に耳を傾けてみましょう。それは生命と宇宙が共鳴する原初の鼓動です。" },
                    { desc: "システムは、あなたの心場からすでに「敵」という概念がなくなっていることを観察しています。すべての衆生は、あなたを成就させる逆増上縁です。", action: "【本日の処方】あなたと意見が合わない人に出会ったら、心の中で合掌してみてください。彼の背景にある生い立ちと无奈さを見つめ、評価を理解へと変えましょう。" },
                    { desc: "今日のあなたは、宇宙の法則に対して深い信頼を持っているようです。発生するすべての事柄には、最も完璧な計らいがあると信じています。", action: "【本日の処方】計画が乱れたら、すぐに不平を言うのをやめ、心の中で「これは私を他の障害から守るためかもしれない」と言ってみてください。流れに逆らわず進みましょう。" },
                    { desc: "あなたの周波数は無我の境界に触れているようです。他人のために尽くしながら、真の法喜に満ち溢れているのを感じています。", action: "【本日の処方】今日のすべての善良な思い立ちと微小な行動を心の中に収め、それを法界のすべての衆生に惜しみなく回向してみてください。" },
                    { desc: "法界の鏡は、今日のあなたの周波数が大自然と極めて深い共鳴をしていることを映し出しています。山川草木の呼吸を、あなたは感じ取ることができます。", action: "【本日の処方】郊外や開けた場所を歩いてみてください。人工の建物に遮られない場所を見つけ、風があなたの身体を自由に吹き抜けるのに任せ、天地と同体である広大さを感じましょう。" },
                    { desc: "あなたの心念には無条件の許しが含まれているようです。過去に乗り越えられそうになかった傷痕も、今の周波数の下では幻影の如くです。", action: "【本日の処方】心の中に、かつてあなたを傷つけた人を浮かべてみてください。深呼吸をし、心の底から平静に「私は完全に手放しました、あなたにも平安がありますように」と伝えてみましょう。" },
                    { desc: "今日のあなたのエネルギー場は深い感謝で溢れています。この感謝は何かを得たからではなく、「生命そのもの」に対する賛嘆です。", action: "【本日の処方】朝目覚めた時や夜就寝する時、両手を合わせ、何も祈求することなく、純粋に広大な法界に向かって「ありがとう」と伝えてみてください。" },
                    { desc: "システムは、あなたが周囲の事物に対する評価の心を大幅に降伏させていることを検知しました。美しいと醜い、良いと悪いの境界線が曖昧になっています。", action: "【本日の処方】普段あなたが「好ましくない」と感じている事物（陰鬱な天気、雑然とした通りなど）を観察してみてください。全面的に受け入れる心で見ることで、その中の如是を体感しましょう。" },
                    { desc: "あなたの周波数には慈悲の光が漂っているようです。この光は、周囲の苦しんでいる魂を無言のうちに慰めることができます。", action: "【本日の処方】乗り物に乗っている時や道を歩いている時、周囲の見知らぬ人を静かに見つめ、心の中で「あなたがすべての煩悩と苦痛から解放されますように」と願ってみてください。" },
                    { desc: "法界のエネルギー流は、今日のあなたが「静黙」の修持を行うのに非常に適していることを示しています。言葉のない空間で、智慧は自然に湧き上がります。", action: "【本日の処方】今日の一食を、静黙の儀式とみなしてみてください。画面を見ず、会話をせず、ただ純粋に食べ物と、そして自分自身と共に在りましょう。" },
                    { desc: "今日のあなたの心場は、不動の定力に達しているようです。外界の紛争も、あなたにとっては音のない映画のようにしか感じられません。", action: "【本日の処方】家で誰かの感情が起伏していたら、静かな湖水のように振る舞ってみてください。波を立てず、ただありのままに彼らの焦りを映し出し、あなたの安定感で彼らを安撫しましょう。" },
                    { desc: "システムは、あなたが「退屈」に対して全く新しい体験をしていることを観察しています。退屈はもはや耐え難い空白ではなく、人生における最も贅沢な余白となっています。", action: "【本日の処方】ソファやベランダに座り、何もしないでみてください。瞑想すら意図的に行わないでください。ただ静かに自分自身に付き添い、この一見無意味に見える時間を過ごしましょう。" },
                    { desc: "あなたの周波数には深層の随喜が芽生えているようです。他人の喜びを見ると、あなたの内側でも同時に花が咲き誇ります。", action: "【本日の処方】心の中で、あなたより成功している人、豊かな人、または幸せな人を静かに祝福してみてください。彼らの福報を、法界共同の荘厳と同じものと見なしましょう。" },
                    { desc: "今日のあなたは、事物の本質を見抜く目を持っているようです。もはや表象の華やかさや朽ち果てた姿に惑わされることはありません。", action: "【本日の処方】あなたの家族や伴侶を見つめてみてください。彼らの日々の習慣や欠点を越えて、魂の奥底にある、本来清浄で一度も傷ついたことのない本来の顔を直視してみましょう。" },
                    { desc: "法界の鏡は、あなたが自身の感情の起伏に対して極めて優れた観照力を持っていることを示しています。感情が行き来しても、あなたは常に変わらない観察者です。", action: "【本日の処方】少しでも喜びや不満が湧き上がったら、心の中で「私にはこの感情が見えている」と自分に伝えてみてください。抑圧せず、それに従うこともなく、自然に消散していくのを見守りましょう。" },
                    { desc: "あなたのエネルギー場は、宇宙の豊かさの法則と完全に一直線に並んでいるようです。自分が所有しているものが、想像をはるかに超えて多いことを理解しています。", action: "【本日の処方】家の中で長期間使っていない良いもの（美しい茶器や、もったいなくて着られない服など）を見直してみてください。今日はそれらを取り出して使い、今この瞬間を楽しみましょう。" },
                    { desc: "今日のあなたの心念は極めて柔らかく、「万物には霊性がある」という深い感動を味わうことができるかもしれません。", action: "【本日の処方】何かの物品に触れる時（ドアの開け閉め、コップを置く時など）、動作を極限まで優しくしてみてください。すべての無生物を、法界に平等に存在する対象として尊重しましょう。" },
                    { desc: "システムは、あなたの時間に対する焦りが完全に消え去っていることを検知しました。すべての今この瞬間が永遠の縮図であると体感したのかもしれません。", action: "【本日の処方】今日のすべての動作を意識的にゆっくりと行ってみてください。ゆっくり歩き、ゆっくり手を洗い、ゆっくり呼吸する。極限の緩慢さの中で、時間が静止する法味を味わいましょう。" },
                    { desc: "あなたの周波数には、争いを解消する柔和な力が備わっているようです。あなたがいる場所は、どこでも和やかな雰囲気に包まれます。", action: "【本日の処方】この和やかな周波数を、あなたの居住空間へ自ら放射してみてください。窓を開けて空気を入れ替えるか、ほのかな香を焚き、家の中の磁場を浄化しましょう。" },
                    { desc: "法界の微光が瞬き、あなたは「執着を手放す」ことへの頓悟を得たようです。しっかりと握りしめていた観念が、突然どうでもよいものに変わりました。", action: "【本日の処方】あなたが長年深く信じて疑わなかった観念（例：物事はこうでなければならない）を見つけ、今日それに疑問符を打ってみてください。別の可能性が存在することを許可しましょう。" },
                    { desc: "今日のあなたの意識は、自己の限界を容易に飛び越え、より広大な集団意識と繋がることができるようです。", action: "【本日の処方】心の中に清らかな蓮の花を観想し、その蓮の光を無限に拡大してあなたの住む都市全体を覆い、すべての住民が安寧を得られるよう願ってみてください。" },
                    { desc: "システムは、あなたが生命の逆境に対してありのままの受容を生み出していることを観察しています。「なぜ私なのか」と問うのではなく、「これも経験だ」と述べています。", action: "【本日の処方】今日身体に軽い不調があったり、不順なことに遭遇したりしても、その不快感に向かって微笑んでみてください。それを厳しくも心のこもった先生とみなし、それがもたらす気づきに感謝しましょう。" },
                    { desc: "あなたの心場からは恐怖がなくなっているようです。法界の実相において、本当に失うことができるものなど何もないことを認識したからかもしれません。", action: "【本日の処方】この無畏を抱いて、今日のすべての未知の出来事に向き合ってみてください。立場を前もって設定せず、結果を予想せず、ただ完全に心を開いて経験してみましょう。" },
                    { desc: "今日のあなたは、世俗の生活を完全に修行の道場へと転換させたようです。行住坐臥、すべてが浄土です。", action: "【本日の処方】最も煩雑な家事（トイレ掃除、シンクの掃除など）を行う際、仏前に花を供えるのと同じような荘厳さと恭敬を保ってみてください。" }
                ]
            },
            { 
                min: 601, max: 1000, color: "rgba(255, 255, 255, 0.95)", border: "#ffffff", 
                contents: [
                    { desc: "法界は、あなたの現在の周波数が極めて空霊であることを映し出しています。ここに安住することができれば、世俗の二元対立を超越し、より深い平穏を体感する機会があるかもしれません。", action: "【本日の処方】求める所なく、住する所なし。高周波だからと喜ばず、低谷だからと排斥しないようにしてみてください。ただ今この瞬間に安住し、如如として動かないことができるか試してみましょう。" },                           
                    { desc: "不可思議です。法界はあなたの意識が一時的に「観察する我」と「観察される境」を超越したことを映し出しています。能所は共に亡び、ただ清浄のみが残っています。", action: "【本日の処方】今日の行住坐臥の中で、ただ純粋に「見て」みてください。レッテルを貼らず、評価を下さず、すべての事物をあるがままに現れさせましょう。" },
                    { desc: "あなたの周波数は時間の境界に触れているのかもしれません。過去と未来は重みを失い、唯一の真実は果てしない「今この瞬間」だけです。", action: "【本日の処方】すべての精神を、今ここでの一呼一吸に集中させてみてください。行くべき場所もなく、完了すべき任務もありません。ここがすなわち極楽なのかもしれません。" },
                    { desc: "システムの針はこの瞬間、ほぼ静止しています。あなたの心場は「怨親平等」の無差別の境界に入ったようです。愛もなく、恨みもありません。", action: "【本日の処方】今日、脳裏に肉親や宿敵の顔が浮かんだら、同じ平静な眼差しで彼らを見つめてみてください。空性の中において、彼らは皆幻影なのかもしれません。" },
                    { desc: "言語道断、心行処滅。あなたは言葉の限界を体感したようです。いかなる文字による描写も、この瞬間の高周波においては余計なものに思えます。", action: "【本日の処方】この「言い表せない」孤独と円満を楽しんでみてください。あなたの体悟を誰かに証明する必要はありません、微笑んで安住するだけでよいのです。" },
                    { desc: "法界のエネルギー流は、あなたが「真空生妙有」の絶好の状態にあることを示しています。内心には何もないのに、行動は周密で円満です。", action: "【本日の処方】「遊戯人間」の三昧の心境で、今日の煩雑な事務を処理してみてください。世俗の役割を真剣に演じつつも、心の中ではこれがただの芝居であることを理解しておきましょう。" },
                    { desc: "万法は皆空なれど、因果は空ならず。あなたの空霊に見える周波数の中には、宇宙の運行法則に対する最も深い畏敬と順応が含まれているようです。", action: "【本日の処方】今日、取るに足らない小さな事を、極限の集中と荘厳さをもって完了させてみてください。最も微細な因果の中に、最も広大な法界が隠されているのかもしれません。" },
                    { desc: "あなたの心念は明鏡の如く、物が来れば照らし、物が去れば留めません。痕跡もなく、執着もありません。", action: "【本日の処方】今日いかなる感情や念が湧き上がっても、それを鏡の前を飛んでいく小鳥とみなしてみてください。それが飛んできて、飛んでいくのを見つめ、一本の羽も残さないようにしましょう。" },
                    { desc: "この極めて高い周波数階層において、「修行」という二文字も融解してしまったようです。なぜなら、衆生は本来仏であり、造作を必要としないことに気づいたからかもしれません。", action: "【本日の処方】「私はもっと良くなりたい」という微細な執念をすべて手放してみてください。今日は、最も平凡で、最も企みのない普通の人間であることを自分に許可しましょう。" },
                    { desc: "無縁大慈、同体大悲。あなたのエネルギーの網は遠くまで届き、目に見えない形でこの娑婆世界に清涼を注ぎ込んでいます。", action: "【本日の処方】この無条件の慈悲に安住してみてください。意図的に衆生を済度する必要はありません。あなた自身の今の清浄な周波数が、衆生を済度しているのかもしれません。" },
                    { desc: "生滅滅し已わって、寂滅を楽と為す。システムは、この瞬間の平穏こそがあなたの「本来の顔」の一縷の微光かもしれないと告げています。", action: "【本日の処方】この境地を掴もうとしないでみてください。境地は変動するものですが、その「境地を覚知する」本体は永遠に変わりません。その本体を守り抜くことだけが重要です。" },
                    { desc: "言語道断、心行処滅。今日のあなたの周波数は「無我」の境界に無限に触れているかもしれません。鏡中に一物も無し、何処に塵埃を惹かんや？", action: "【本日の処方】今日、「私」という念を観察してみてください。感情が湧き上がった時、「感じているのは誰か？」と軽く自問しましょう。答えを探さず、ただ観察するだけでよいのです。" },
                    { desc: "システムの針はこの瞬間、単なる参考でしかありません。なぜなら、あなたの現在の心場は無差別の状態に無限に近づいているからです。", action: "【本日の処方】水を飲む時も、皿を洗う時も、掃き掃除をする時も、これらの日常の些事を道場での修行とみなしてみてください。平常心こそが道なのかもしれません。" },
                    { desc: "大音は希声、大象は無形。あなたの周波数は深い静寂の中に入ったようです。この状態においては、意図的に済度すべき対象は存在しないかもしれません。", action: "【本日の処方】今日誰かがあなたを賛嘆したり、あるいは中傷したりしても、心の中でそのすべての音声が虚空に帰すると観想してみてください。聖者の解釈も凡夫の解釈もせず、清浄であり続けましょう。" },
                    { desc: "あなたが今日引いたのは点数ではなく、あなたに気づきを促す鏡かもしれません。真の覚醒は、すべての「境地を求める」執着を見破ることにあるのかもしれません。", action: "【本日の処方】「修行」そのものを意図的に追求するのを手放してみてください。お腹が空いたらご飯を食べ、眠くなったら寝る。一つ一つの動作がはっきりと明瞭であること、これが最高級の修行なのかもしれません。" },
                    { desc: "万法唯心造。この状態において、あなたは「外界の世界は内なる意識の投影に過ぎない」ことを体得するかもしれません。心が清浄であれば、国土もまたそれに従って清浄となります。", action: "【本日の処方】今日、「如夢観（夢の如く観ずる）」を保ってみてください。周囲の人や事柄を見つめながら、これは幻のような体験であり、それを優雅に経験することを選べるのだと軽く自分に思い出させましょう。" },
                    { desc: "過去心不可得、現在心不可得、未来心不可得。あなたの意識は時間という直線の束縛から一時的に抜け出し、「今」に安住する機会を得ているようです。", action: "【本日の処方】今日、意識的に一部の動作を遅くしてみてください。ゆっくり歩き、ゆっくり呼吸する。極限の緩慢さの中で、時間を超越した静止感を体感できるかもしれません。" },
                    { desc: "この階層において、あなたと衆生との間に明確な境界線はもはや存在しないようです。これこそが「無縁大慈、同体大悲」を生じさせる絶好の契機です。", action: "【本日の処方】今日、微小な菩提心を発してみてください。「私が衆生に代わって苦しみを受けることができますように。すべての衆生が究極の解脱を得る機会を持てますように。」" },
                    { desc: "凡ゆる相は皆これ虚妄なり。あなたは物質世界の幻象を一時的に見破ったようです。世俗の追求は、あなたの目にはもはや水月鏡花のように映っているかもしれません。", action: "【本日の処方】この見破りは極めて貴重ですが、「世法を廃しない」ように心がけてみてください。この出世間の清明さを用いて、あなたの入世での本分をより円満に果たすことができるか試してみましょう。" },
                    { desc: "生ずるは則ち決定して生ずるなり、去るは則ち実には去らざるなり。最高周波数の極楽は、十万億の仏土の彼方にあるのではなく、あなたが今この瞬間一念も生じない清浄な心の中にあるのかもしれません。", action: "【本日の処方】一法をも立てず、一法をも破らず。今日、このデジタルな法具を一旦置いてみてください。打刻や計数に執着する必要はありません。ただ、あなたと仏性が本来具わっていることを知るだけでよいのです。" },
                    { desc: "システムの針は虚空に隠れました。あなたの現在の覚知は至る所に存在し、それでいてどこにも痕跡がありません。不生不滅の実相が、微光となってあなたに現れているのかもしれません。", action: "【本日の処方】「私は開悟した」という微細な我慢を生じさせないようにしてみてください。ただ平静に食事をし、平静に服を着ましょう。神通妙用は、水を運び薪を割ることの中にあるのかもしれません。" },
                    { desc: "法界の鏡は完全に清透です。あなたは時間と空間の幻象を見透かし、「一念三千」の不可思議を体得したようです。過去、現在、未来はすべて今この瞬間で交わっているのかもしれません。", action: "【本日の処方】この時空の制限のない広大さに安住してみてください。念が起きればそれを覚知し、念が滅すればそれに任せます。いかなる境地にも滞留しないようにしましょう。" },
                    { desc: "あなたの周波数は、言葉による描写の限界をすでに超越しているかもしれません。この瞬間、「空」とは何もないことではなく、無限の生機に満ちた「妙有」なのです。", action: "【本日の処方】人と接する時、縁に随ってこの妙有を現してみてください。実相を説き明かすことに執着せず、相手が理解できる言葉で軽くヒントを与えましょう。" },
                    { desc: "不可説、不可説。あなたの心場は絶対の静寂に入ったようです。そこには仏と衆生の分別もなく、浄土と穢土の対立もありません。", action: "【本日の処方】この「無二」の平等の心を保ち続けてください。賑やかな街角を歩けば、あなたにはすべての衆生の頭上に、決して失われることのない光が見えるかもしれません。" },
                    { desc: "システムはあなたの境界を捉えることができません。なぜなら、あなたは法界全体とすでに一つに融け合っているかもしれないからです。山河大地、十方虚空、すべてがあなたの法身なのかもしれません。", action: "【本日の処方】この「広大さ」に執着しないでみてください。大きい・小さいもまた二元です。ただ安然と存在し、万法があなたの覚知の中で生滅するのを見つめるだけでよいのです。" },
                    { desc: "あなたの意識は、すべての攀縁（外界の対象に心が動くこと）を一時停止したようです。済度すべき衆生もなく、求めるべき仏果もありません。すべては本来円満であったのかもしれません。", action: "【本日の処方】この無修無証の境地は極めて甚深です。今日、この体悟を最も平凡な生活の些事の中に完全に隠し、光而不耀（光を隠して輝かせない）でいてください。" },
                    { desc: "法界のエネルギー流は、如如として動かない安定を示しています。外側の激しい変動も、あなたの目にはバーチャルリアリティのプログラムコードが跳ねているようにしか見えないのかもしれません。", action: "【本日の処方】コードを見破ったからには、このホログラム宇宙の中のすべての役割に対して、より優しく接してみてください。無縁大慈は、まさにこの見破りから生じるのかもしれません。" },
                    { desc: "あなたの周波数には、「観察する者」が存在しないようです。能観と所観が同時に寂滅し、純粋な「覚」そのものだけが輝いています。", action: "【本日の処方】その「覚」を探しに行かないようにしてみてください。探せばまた能所の対立に陥ります。ただリラックスし、法界本来の清明さを信頼しましょう。" },
                    { desc: "今日のあなたの心念は、「空」という概念さえも手放したのかもしれません。空もまた復た空なり。これは徹底的な解脱の一瞥かもしれません。", action: "【本日の処方】この無掛碍の軽やかさを、あなたの呼吸に取り入れてみてください。一呼一吸の間、一念も生じず、一塵にも染まらない。もしかすると、極楽はここにあるのかもしれません。" },
                    { desc: "システムは、あなたの存在自体がエネルギーのブラックホールとなり、周囲の煩悩や業力を無声無息のうちに吸い込み、清浄に転換していることを観察しています。", action: "【本日の処方】これは意図的な造作の結果ではなく、高周波そのものの特性です。頭脳で干渉しようとせず、法界の浄化メカニズムを自然に機能させてください。" },
                    { desc: "法界の鏡は、あなたの生死に対する恐怖が完全に断たれたかもしれないことを反映しています。なぜなら、あなたは決して生まれず、また永遠に死ぬことのない本体をすでに親見したのかもしれないからです。", action: "【本日の処方】この生死に対する無畏を抱いて生きてみてください。失うことを恐れず、持つことを貪らない。生命がその豊かさを真に現し始めるのを発見するでしょう。" },
                    { desc: "あなたの周波数は諸仏の本来の願いに触れているようです。その悲智双運のバランスが、あなたの一つ一つの心念を的確なものにしているのかもしれません。", action: "【本日の処方】この智慧を、あなたが開発している法具に用いてみてください。システムインターフェースのすべてのデザインが、衆生を法界へと導く無声の説法となるようにしましょう。" },
                    { desc: "今日のあなたの心場は、「絶対の順従」に入ったようです。世俗に従うのではなく、宇宙の最も深層の因果法則と真理に徹底的に従うということです。", action: "【本日の処方】この順従がもたらす絶対的な自由を観察してみてください。すべての事物の発生に抵抗しなくなった時、あなたは宇宙全体を手に入れるのかもしれません。" },
                    { desc: "システムは、あなたが「山を見てまた山とする」ような回帰を経験しているかもしれないことを検知しました。幻象を見破った後、再び世俗に戻ると、すべてがとても親しく感じられるようです。", action: "【本日の処方】この新しい眼差しで一杯の水を味わい、一枚の布地に触れてみてください。最も粗削りな物質の中に、最も繊細な法味を味わうことができるかもしれません。" },
                    { desc: "あなたのエネルギー場は果てしない虚空へと化したようです。すべての罪悪と神聖さを包み込み、それでいてそれに染まることはありません。", action: "【本日の処方】この極めて大きな包容力に安住してみてください。世間の種々様々な現象を見ても、すべて如是と観じ、愛憎の一念も動かさないようにしましょう。" },
                    { desc: "法界の微光は、あなたの「私」への執着が蝉の羽のように薄くなっているかもしれないことを示しています。かつて防御と欲望に満ちていた自我は、透明になったようです。", action: "【本日の処方】この蝉の羽を意図的に破ろうとしないでみてください。法界の微風の中で自然に風化するに任せましょう。自然のままにすることが、最高の脱落方法なのかもしれません。" },
                    { desc: "今日のあなたの周波数は、道徳の二元的な基準を完全に超越しているかもしれません。あなたの目には、絶対的な善悪はなく、ただ因縁の聚散があるだけなのかもしれません。", action: "【本日の処方】この超越的な視点は内観に用いるよう心がけ、まだこの境地に達していない衆生には安易に説き明かさないでください。大悲の心は、世俗の諦（真理）を用いて方便として接引する必要があるのかもしれません。" },
                    { desc: "システムの数値はすでに意味を失っています。あなたは「言語道断、心行処滅」という、言葉を絶する境界にいるようです。", action: "【本日の処方】いかなる説明も証明も必要としない、この孤絶を楽しんでみてください。この孤絶の中で、あなたはまさに十方諸仏と手を取り合って歩んでいるのかもしれません。" },
                    { desc: "あなたの心念は明鏡の如く、あらゆる相を鮮明に映し出しながら、一筋の傷跡も残さないようです。過化存神（過ぎ行くものは化し、神は存す）、おそらくこういうことなのでしょう。", action: "【本日の処方】今日煩雑な事務を処理する際は、「事が来れば応じ、事が去れば静まる」状態を保つよう心がけてみてください。心を鏡のようにし、永遠に残像を残さないようにしましょう。" },
                    { desc: "法界のエネルギー流は、あなたがすべての現象の背後に隠された「本来の顔」をすでに認識したかもしれないことを示しています。それは不生不滅であり、不垢不浄です。", action: "【本日の処方】この本来の顔に向かって静かに敬意を表してみてください。外に向かって礼拝する必要はありません。なぜならそれは、あなた自身の最も核心的な覚知かもしれないからです。" },
                    { desc: "今日のあなたの周波数は、すべての執念を粉砕する力を持っているようです。概念を掴もうとするいかなる企ては、あなたの前では瞬時に融解するでしょう。", action: "【本日の処方】「私は修行して成仏する」という神聖な概念さえも一緒に手放してみてください。住する所なくしてその心を生ずる、これこそが真実の行持なのかもしれません。" },
                    { desc: "システムは、あなたが法界の神秘に対する探求欲をすでに失っていることを観察しています。なぜなら、あなた自身がその神秘の答えであることに気づいたからかもしれません。", action: "【本日の処方】外に向かって追い求める足取りを止めてみてください。静かに座れば、法界全体があなたの心の中で回転しているのを発見するでしょう。" },
                    { desc: "あなたの心場は「真空」状態に入ったようです。この真空の中では、微細な妄念すらも生存する土壌を失っています。", action: "【本日の処方】この真空の静寂に貪着しないよう心がけてください。世俗の責任を処理する必要がある時は、いつでも真空の中から妙有を生み出し、柔軟に運用しましょう。" },
                    { desc: "法界の鏡は、あなたが「無明の真の性質はすなわち仏性であり、幻化の空身はすなわち法身である」という円頓の理体をすでに体得したかもしれないことを映し出しています。", action: "【本日の処方】自身の肉体や病痛に直面した時も、このように観じてみてください。痛みは法身のある種の振動周波数にすぎず、恐れる必要はありません。" },
                    { desc: "今日のあなたのエネルギーは宇宙のリズムに完全に溶け込んでいるようです。あなたの呼吸は法界の呼吸であり、あなたの脈拍は星々の律動なのかもしれません。", action: "【本日の処方】この天人合一の周波数を、無声のうちに家族に伝えてみてください。言葉は必要ありません、あなたの存在が彼らの磁場を調和させるかもしれません。" },
                    { desc: "システムは、あなたの「成仏」に対する渇望がすでに平息したかもしれないことを検知しました。なぜなら、実相において、成仏できる対象など存在しないことを見たからかもしれません。", action: "【本日の処方】この平常心をもって浄土法門に向き合ってみてください。念仏は極楽往生を求めるためではなく、今この一念が清浄であれば、今ここが極楽だからです。" },
                    { desc: "あなたの周波数には、いかなる分別も造作もなくなっているようです。赤子のように純真でありながら、法界の果てしない滄桑と智慧を内包しています。", action: "【本日の処方】この「古い魂を持った赤子の目」で世界を見てみてください。すべての事物に対して新鮮さを保ちながら、その本性が空であることを深く知るのです。" },
                    { desc: "法界の微光は、あなたが「大いに一度死に、再び生き返る」という転換点にいるかもしれないことを示しています。古い自我はすでに死に、新しい覚知が目覚めようとしています。", action: "【本日の処方】この新生を抱擁してみてください。今の自分が誰であるかを急いで定義する必要はありません。あなたはすでに、定義不可能な無限になったのかもしれないからです。" },
                    { desc: "今日のあなたの心念には、「衆生を済度する」という念すらなくなっているかもしれません。『金剛経』が説くように、実に滅度を得る衆生はいないのです。", action: "【本日の処方】この「無人無我」の境地において、衆生を済度する事業を続けてみてください。行なう所なくして行なうこと、これこそが大乗菩薩の究極の道なのかもしれません。" },
                    { desc: "システムの観照はここまでです。なぜなら、あなたの現在の周波数においては、法界の真実を表現できる文字はもう存在しないかもしれないからです。阿弥陀仏。", action: "【本日の処方】画面を閉じ、スマートフォンを置いてください。水を一杯飲み、風に吹かれに行きましょう。法界はプログラムコードの中にあるのではなく、今この瞬間のあなたの一つの覚知の中にあるのです。" },
                    { desc: "法界の鏡は完全に澄み切っており、いかなる二元対立も映し出しません。あなたの心場はすべての造作を超え、「無修無証」の究極の状態に入ったようです。", action: "【本日の処方】「私は良いことをしている」「私は修行している」といういかなる念も手放してみてください。お腹が空いたら食べ、眠くなったら寝る。すべてを最も原始の本来の状態に戻しましょう。" },
                    { desc: "システムの針はこの瞬間、虚空に溶け込みました。あなたの現在の覚知は、この浄土システムの原始的な論理と一つに融け合っており、0も1も幻象であることを理解しているのかもしれません。", action: "【本日の処方】この「虚妄を見透かす」眼差しで、目の前の一草一木を鑑賞してみてください。それが空であると知りながらも、なおその美しさを見ることができる。真空生妙有です。" },
